 observation is the framework's strongest intuitive appeal and its least secured claim, and both facts deserve stating.\n\nEvery clinician in this area reports it and every patient has lived it: a family shares a building, one member becomes severely and multiply ill, the others have a stuffy nose or nothing. Differential susceptibility to a shared environmental exposure is thoroughly ordinary in medicine — asthma, coeliac disease, drug hypersensitivity, berylliosis, and hypersensitivity pneumonitis all work this way, and several have known HLA associations.\n\nThe framework's specific proposal is that particular HLA class II haplotypes present these antigens poorly, leaving persistent stimulation, and that roughly a quarter of the population carries a susceptible type. That is a testable claim of exactly the kind modern genetics handles well.\n\nThe competing explanations are equally live and much less discussed. Occupants of one building genuinely differ in exposure — hours at home, which rooms, basement use, sleeping location relative to the stack. They differ in pre-existing airway and immune status. And they differ in age, sex and hormonal state, all of which shift innate responses substantially.","angles":[["Differential susceptibility as an ordinary finding","Many accepted diseases affect a minority of the exposed, so unequal illness in one household requires no unusual mechanism to be plausible."],["Within-household exposure variation as the rival explanation","Occupants differ in hours, rooms and activity, so apparent susceptibility differences may be exposure differences that nobody measured."]],"world":"exposure","upAlt":null,"edge":[],"fr":null,"lon":60.19200000000002,"short":"susceptibility"},{"id":"mycotoxin","level":1,"parent":"inhale","tier":"point","ab":3,"label":"Mycotoxins: potency, half-life, and the aerosolisation bottleneck","view":"The molecules themselves are not in doubt, and their properties are known well enough to see exactly where the indoor argument fails and where it survives.\n\nThe macrocyclic trichothecenes from Stachybotrys — satratoxins G and H — are potent ribosomal inhibitors, and animal work is unambiguous: satratoxin G instilled into mouse nose produces olfactory sensory neuron loss and inflammation extending into the olfactory bulb. Aflatoxins are among the most potent known hepatocarcinogens. Ochratoxin A is nephrotoxic with a human half-life measured in weeks. Gliotoxin is immunosuppressive.\n\nSo potency is real. Two bottlenecks stand between potency and indoor illness. Aerosolisation: Stachybotrys releases intact spores poorly, and the airborne concentration of any mycotoxin in a house is low, though the fragment finding partly relieves this. And kinetics: these compounds are cleared in hours to days and are not stored, so there is no accumulating body burden of the kind consumer testing implies.\n\nThe honest position is that mycotoxin poisoning from a house is poorly supported, and that this says nothing about whether the same material provokes an inflammatory response — a different claim with different mathematics.","angles":[["Animal instillation studies as evidence about potency, not exposure","Direct nasal instillation demonstrates a toxin can damage neural tissue while saying nothing about whether ambient air delivers a comparable quantity."],["Potency and delivery as independent questions","A highly potent molecule that does not become airborne poses little inhalation risk, so toxicological potency alone cannot establish an exposure hazard."]],"world":"exposure","upAlt":null,"edge":["down"],"fr":null,"lon":290.656,"short":"mycotoxins"},{"id":"beta","level":1,"parent":"inhale","tier":"point","ab":3,"label":"Beta-glucans, chitin, endotoxin, and the receptors that read them","view":"This is where the biology is strongest and where the framework's newer arguments live, so it deserves specifics.\n\nFungal cell walls are built from beta-1,3-glucan and chitin. Both are recognised by the innate immune system through dedicated receptors: Dectin-1 binds beta-glucan and signals through Syk and CARD9 to drive Th17 responses; the mannose receptor and various Toll-like receptors read mannans; chitin has its own recognition pathways with size-dependent effects. Bacterial lipopolysaccharide signals through TLR4, and TLR2 reads Gram-positive components including those of actinobacteria.\n\nThree features make this account fit the illness better than mycotoxicosis does. These receptors amplify rather than titrate, so trace quantities produce measurable systemic responses. They work on fragments as readily as on whole organisms, so poor spore aerosolisation is no objection. And they require no prior sensitisation, which explains why IgE testing is uninformative and why the response is properly called innate.\n\nIt also converges with the framework's complement claim, since the lectin pathway recognises the same carbohydrates. Two independent arms of innate immunity read fungal cell wall, which is a coherent picture rather than a stipulated one.","angles":[["Receptors as amplifiers rather than dose meters","Pattern-recognition signalling produces large responses to trace quantities, which is why dose arguments built on toxicological thresholds do not transfer."],["Two innate arms reading the same molecule","Dectin-1 and the lectin complement pathway both recognise fungal cell-wall carbohydrates, so glucan exposure predicts both cytokine and complement activation."]],"world":"exposure","upAlt":null,"edge":["down"],"fr":null,"lon":324.90208,"short":"glucans + receptors"},{"id":"hla","level":1,"parent":"susceptible","tier":"point","ab":3,"label":"HLA-DR haplotypes: the susceptibility claim and the evidence it rests on","view":"The genetic claim is specific enough to be checked, and checking it exposes a methodological problem rather than a wrong answer.\n\nThe framework holds that particular HLA class II haplotypes — 4-3-53, 11-3-52B, 14-5-52B and several others in its notation — confer inability to clear biotoxins, that roughly twenty-four per cent of the population carries a susceptible type, and that around ninety per cent of patients presenting for evaluation carry one. Relative risk is computed as haplotype frequency in cases divided by frequency in controls, with 2.0 treated as the threshold. HLA class II associations with environmental disease are entirely orthodox — chronic beryllium disease and HLA-DPB1 Glu69 is the textbook case, and coeliac disease with DQ2 and DQ8 is another.\n\nThe problem is the control group. The framework's comparisons are against international registry gene frequencies rather than a locally recruited, ancestry-matched control cohort. HLA frequencies vary enormously between ancestral populations, so a case series drawn from one region compared against a global registry will generate spurious associations reliably. This is the exact failure mode that produced a generation of irreproducible HLA association claims across medicine before ancestry matching became standard.\n\nThe fix is a well-trodden method: a modest case-control study with ancestry-matched controls and principal-component correction. It has not been published.","angles":[["Population stratification as a manufacturer of false associations","Comparing cases from one region against global allele frequencies produces apparent associations from ancestry differences alone, which is why matched controls are mandatory."],["Beryllium disease as the orthodox precedent","A class II association determining who becomes ill from a workplace exposure is established medicine, so the form of the CIRS claim is unremarkable even though its evidence is weak."]],"world":"exposure","upAlt":null,"edge":["down"],"fr":null,"lon":43.648000000000025,"short":"HLA-DR"},{"id":"mixture","level":1,"parent":"susceptible","tier":"point","ab":3,"label":"The mixture problem: nobody is exposed to one agent","view":"This is the methodological wall the whole exposure science runs into, and it is not specific to damp buildings — it is the reason mixture toxicology is one of the hardest areas in environmental health.\n\nAn occupant of a wet building inhales, simultaneously, several fungal species and their fragments, multiple mycotoxin classes, beta-glucans, chitin, actinobacterial metabolites, Gram-negative endotoxin, microbial volatiles, dust mite allergen thriving in the same humidity, and elevated formaldehyde and other emissions because damp building materials off-gas faster. The components interact: endotoxin and glucan co-stimulation produces responses different from either alone, and this has been demonstrated experimentally.\n\nStandard toxicology cannot handle this. Its methods assume one agent, one dose axis, one outcome. Twelve co-varying agents with interaction terms require sample sizes and designs that indoor-air epidemiology has never had access to.\n\nWhich produces the awkward practical conclusion that both sides in this dispute keep declining to state plainly. The specific agent may not be identifiable, and it may not need to be, because dampness itself is the exposure metric with a demonstrated health association — and remediation is the intervention with demonstrated benefit regardless of which component was responsible.","angles":[["Dampness as the operative exposure metric","Because the health associations were established against dampness rather than any single agent, remediation is warranted without identifying which component causes harm."],["Co-stimulation producing non-additive responses","Endotoxin and glucan together generate responses unlike either alone, so a mixture cannot be modelled by summing its components."]],"world":"exposure","upAlt":null,"edge":["down"],"fr":null,"lon":77.89408000000003,"short":"mixture"},{"id":"timing","level":1,"parent":"dose","tier":"point","ab":3,"label":"Latency: why the illness arrives late and is diagnosed later","view":"The temporal structure of this illness is what makes it so hard to see, and the reasons are ordinary rather than mysterious.\n\nChronic inflammatory states have long induction periods. Hypersensitivity pneumonitis takes months to years of exposure. Occupational asthma has a latency measured in months. Chronic beryllium disease can appear a decade after exposure ends. None of this is unusual biology — a state that requires immune reprogramming rather than direct injury takes time to establish, and once established can persist without the trigger.\n\nThree consequences follow, and they explain most of the diagnostic difficulty. The exposure is identified retrospectively, if at all, which means exposure data is reconstructed from memory and property records rather than measured. Onset is gradual, so there is no index event to bring the patient to a clinic while the exposure is current. And because the state is self-maintaining, leaving the building produces incomplete improvement — which is read by the patient as confirmation and by a skeptical clinician as disconfirmation, since a genuine environmental illness should resolve on removal.\n\nBoth readings are defensible from the same observation. That is a recurring structural feature of this terrain and it is worth recognising when it appears.","angles":[["Latency as the reason exposure data is always retrospective","An illness appearing months after exposure begins is systematically studied with reconstructed rather than measured exposure, which weakens every subsequent inference."],["Incomplete recovery read two ways","Partial improvement after leaving supports both a self-sustaining illness and a wrong attribution, so the observation cannot adjudicate between them."]],"world":"exposure","upAlt":null,"edge":["down"],"fr":null,"lon":3.9705600000000074,"short":"latency"}],"living":[{"id":"avoidance","level":3,"parent":null,"tier":"city","ab":1,"label":"Avoidance as the one intervention nobody disputes","view":"Strip this entire contested field back to what every party agrees on and one thing survives: a person should not live in a persistently damp building, and if they are ill in one, leaving or fixing it is the first move.\n\nThat agreement is unusually broad. WHO recommends prevention and remediation as a priority. NAM found remediation reduces adverse outcomes. ACMT, reaffirming in 2025, concurs that damp indoor spaces present health risks. The CIRS framework puts removal from exposure as step one and refuses to proceed without it. The intervention literature supports it: adult dampness remediation studies show odds ratios around 0.6 for respiratory and asthma outcomes, roughly a forty per cent reduction, and children moved into moisture-controlled housing gained several asthma-free days per fortnight.\n\nSo a person who has left a wet building is standing on the best-supported ground in this entire terrain, whatever they call their illness and whichever clinician they see. That is worth saying plainly, because patients in this space spend a great deal of energy defending a diagnosis when the action they took needs no diagnosis to justify it.\n\nWhat follows from here is harder: remediation, relocation and re-entry each have their own economics, their own failure modes, and their own literature-free zones.","angles":[["An action justified without its diagnosis","Leaving a damp building is supported by mainstream reviews independently of any contested syndrome, so the decision does not require the diagnosis to be validated."],["Remediation trials as the strongest evidence in indoor air","Intervention studies showing improvement after moisture control provide causal evidence that observational dampness studies cannot."]],"world":"living","upAlt":null,"edge":["up","left","right"],"fr":null,"lon":0.0,"short":"avoidance"},{"id":"remediate","level":2,"parent":"avoidance","tier":"town","ab":2,"label":"Remediating a building you still have to live in","view":"Remediation is a construction problem with a medical deadline, and the sequence matters more than the products.\n\nThe order that works: find and stop the water, dry the assembly, remove damaged porous material, clean and verify, then reinstate with a corrected detail so the same wetting cannot recur. Skipping the first step makes the rest cosmetic — the most common failure in this field is a remediated bathroom with an uncorrected shower pan. Biocide application without moisture correction is the second most common and is essentially useless; dead fungal material still carries glucans and toxins, and the fragment issue is unaffected by whether the organism was alive.\n\nTwo things specific to occupants matter. Remediation aerosolises: demolition of contaminated material produces exposures far above normal occupancy levels, and containment, negative pressure and occupant absence exist for that reason. Hurricane Sandy reconstruction produced documented lower-respiratory symptoms in exactly this way. And verification is genuinely unsettled — post-remediation clearance criteria vary by jurisdiction and contractor, and the honest state of the art is observational reassessment plus the absence of moisture, not a laboratory number.\n\nFor a symptomatic occupant, being elsewhere during the work is the part most often skipped and least optional.","angles":[["Remediation as an acute exposure event","Demolition of contaminated material produces exposures well above ordinary occupancy, which is why occupant absence and containment are standard rather than cautious."],["Dead organisms still carrying the agents","Because glucans, toxins and fragments persist after the organism dies, biocide treatment without material removal does not reduce exposure."]],"world":"living","upAlt":null,"edge":[],"fr":null,"lon":307.2,"short":"remediating"},{"id":"relocate","level":2,"parent":"avoidance","tier":"city","ab":2,"label":"Relocating: what a dry-climate move actually buys, and what it does not","view":"This is the decision a great many people in this situation make, and the evidence supports part of it clearly and part of it not at all. Both halves are worth having straight.\n\nWhat a move reliably buys: separation from a specific building that was making someone ill. That is the whole of step one, it is the best-evidenced intervention available, and it does not depend on anyone accepting a diagnosis. If the illness was driven by that building, leaving it is the treatment.\n\nWhat the climate itself buys is much less than people expect, and the data on this is uncomfortable. Lawrence Berkeley's US surveys find dampness or mould in roughly the same proportion of homes in arid states as in humid ones — the driver is building condition, not outdoor weather. The European ECRHS study found ambient relative humidity was not associated with indoor dampness at all; ambient temperature and precipitation were, and building age and envelope condition were much stronger. Arid-region buildings have their own moisture failure modes: evaporative coolers, irrigation against foundations, slab-on-grade capillary rise, and air conditioning that runs cold surfaces through humid monsoon air. Allergists generally do not recommend relocating for mould alone, for exactly this reason.\n\nSo the honest version: the move was probably right, and it was right because of the building left behind rather than the climate arrived at. The next building matters as much as the last one did.","angles":[["Building condition dominating outdoor climate","Dampness prevalence is similar in arid and humid regions because envelope condition and building age predict it far better than weather does."],["Arid-region moisture failure modes","Evaporative cooling, foundation irrigation and slab capillary rise are specific to dry climates, so relocation exchanges one set of risks for another rather than eliminating them."],["Attribution and the second building","Crediting recovery to the climate rather than to leaving a specific building leads people to under-inspect the house they move into."]],"world":"living","upAlt":null,"edge":[],"fr":null,"lon":7.602807272633072e-15,"short":"relocating"},{"id":"reentry","level":2,"parent":"avoidance","tier":"town","ab":2,"label":"Re-entry, reactivity, and the shrinking world","view":"The part of this illness that most often does the disabling is not the original episode. It is what comes after: a growing list of places a person cannot go.\n\nThe pattern clinicians describe is consistent. After removal and partial recovery, small exposures that were previously unremarkable — a hotel bathroom, a friend's basement, an old office, a library — produce rapid symptom return. The list of tolerable environments contracts. Travel stops, then social contact, then work. People sleep in cars and garages, discard possessions, and reorganise their entire life around an exposure map. Some of this is unavoidable and rational. Some of it becomes its own disease.\n\nTwo accounts of the mechanism are live and both are covered on the frontier band of the subject world. What matters practically is that they have opposite treatment implications — one says avoid more precisely, the other says the avoidance is now part of the problem — and that nobody can currently tell a given patient which they are dealing with.\n\nWhat can be said without resolving that: total avoidance is not achievable, the attempt is progressively costly, and cost is a legitimate clinical variable. A plan that trades a small measured exposure risk for keeping a job, a marriage or a social world is not a failure of rigour.","angles":[["Avoidance behaviour as a treatment variable with its own costs","Progressive environmental restriction carries measurable losses in employment, income and social contact, which belong in the clinical calculation alongside exposure risk."],["Two mechanisms with opposite prescriptions","Immune sensitisation implies tighter avoidance while learned reactivity implies graded re-exposure, and no available test tells a patient which applies to them."]],"world":"living","upAlt":null,"edge":[],"fr":null,"lon":60.19200000000002,"short":"re-entry"},{"id":"possessions","level":1,"parent":"remediate","tier":"point","ab":3,"label":"Possessions: what can come, and what the literature actually says","view":"Advice in this area is confident far beyond its evidence, and a patient facing the discarding of everything they own deserves to know that.\n\nWhat is reasonably established: porous materials in contact with contaminated surfaces retain fungal material and fine dust that ordinary cleaning does not remove — upholstered furniture, mattresses, carpet, cardboard, books' page blocks. Fine settled dust is the reservoir that mould-specific PCR indices measure, and it transfers on textiles. Hard non-porous surfaces clean effectively. HEPA vacuuming and laundering remove a substantial fraction from washable textiles.\n\nWhat is not established, at all: that clothing must be discarded rather than washed; that books cannot be salvaged; that specific ozone, hydroxyl or fogging treatments work — the evidence for these is largely vendor-supplied; that any particular sequence of decontamination steps achieves a defined endpoint, since no validated post-cleaning threshold exists for personal property.\n\nNo controlled study has measured whether bringing washed possessions into a new home affects symptoms. That study does not exist. Which means the near-universal advice to discard extensively is a precaution rather than a finding, and its financial and emotional cost — often tens of thousands of dollars and every photograph a person owns — is being imposed on the basis of no data whatever.","angles":[["Precaution presented as evidence","Advice to discard possessions is a reasonable precaution with no supporting study, and the distinction matters because the cost imposed is very large."],["Porosity as the one defensible sorting rule","Non-porous surfaces clean effectively and porous ones retain fine material, which supports sorting by material rather than discarding indiscriminately."]],"world":"living","upAlt":null,"edge":["down"],"fr":null,"lon":290.656,"short":"possessions"},{"id":"cost","level":1,"parent":"remediate","tier":"point","ab":3,"label":"The economics of leaving: insurance, disclosure, and the second mortgage","view":"The financial structure of this illness is a substantial part of its harm, and it is almost entirely absent from the clinical literature.\n\nHomeowner insurance in the US generally covers sudden water damage and generally excludes long-term seepage, gradual deterioration and mould beyond a low sublimit — often a few thousand dollars, sometimes nothing. The exclusions were tightened industry-wide in the early 2000s in direct response to mould litigation. Which means the most consequential exposures, the slow hidden ones, are systematically the least covered.\n\nDisclosure law varies by state and is generally weak on remediated moisture damage, so a seller's obligation frequently ends at known present conditions. A buyer inherits an assembly they cannot inspect. Selling a house identified as the source is worse: disclosure obligations attach, and the property's value falls at the moment its owner needs money for somewhere else to live.\n\nSo a typical trajectory is remediation cost, then relocation cost, then a devalued asset, then medical costs that are largely uncovered because the diagnosis is unrecognised, sustained by someone whose earning capacity is impaired. Renters face a different version — a lease, a landlord with no obligation, and the choice between paying twice or staying.\n\nThere is no meaningful research on financial outcomes in this population. It may be the most under-documented harm here.","angles":[["Insurance exclusions tracking litigation rather than risk","Mould coverage was narrowed in response to lawsuits, so the exposures most likely to cause illness are the ones least likely to be insured."],["Financial outcome as an unmeasured harm","No study tracks income, asset or debt trajectories in this population, so the largest documented cost of the illness is entirely outside its literature."]],"world":"living","upAlt":null,"edge":["down"],"fr":null,"lon":324.90208,"short":"the money"},{"id":"arid","level":1,"parent":"relocate","tier":"point","ab":3,"label":"Arid does not mean dry: what the survey data says about the desert","view":"The specific empirical claim underneath a dry-climate move deserves to be stated with the numbers, because the numbers are counterintuitive.\n\nRoughly forty-seven to fifty per cent of US homes show signs of dampness or mould, and analyses of the housing survey data find that figure holds across climate zones — Arizona in much the same range as Florida. The European ECRHS work, inspecting three thousand homes across twenty-two centres, found ambient relative air humidity not associated with indoor dampness or mould; ambient temperature was, precipitation was, and building age was strongly associated. What predicts a damp interior is the envelope, the ventilation, the insulation and the age, in that rough order.\n\nArid regions have their own mechanisms. Evaporative coolers deliberately add moisture to interior air. Landscape irrigation against foundations drives capillary rise through slab-on-grade construction. Monsoon season delivers concentrated rainfall to buildings detailed for dryness. Air conditioning creates cold surfaces in humid summer air. And in much of the southwestern US the housing stock is newer, built tighter, and thus less forgiving of a wetting event.\n\nWhat a dry climate does deliver is faster drying after a wetting event, which is genuinely protective, and lower outdoor spore counts, which matters for allergy and not much for indoor dampness. Both are real. Neither makes the next house safe by default.","angles":[["Faster drying as the real arid-climate benefit","Low ambient humidity shortens drying time after a wetting event, which is protective in a way that outdoor spore counts are not."],["Newer, tighter housing as a distinct risk profile","Southwestern US construction is newer and more airtight, which reduces some moisture pathways and makes the building less tolerant of a single wetting event."]],"world":"living","upAlt":null,"edge":["down"],"fr":null,"lon":3.9705600000000074,"short":"arid ≠ dry"},{"id":"sensitisation","level":1,"parent":"reentry","tier":"point","ab":3,"label":"Two accounts of getting worse, and why neither means it is imagined","view":"This deserves care because it is where patients are most often hurt by clinicians, and where clinicians are most often dismissed by patients.\n\nThe immune account: continued innate priming means each re-exposure meets a system already at a lower threshold, so responses become faster and larger over time. This is not exotic — it is how occupational asthma and hypersensitivity pneumonitis behave, and it predicts exactly the observed narrowing of tolerance.\n\nThe learning account: the nervous system builds predictive models of threat, and a stimulus reliably paired with illness becomes a cue that generates the response in advance. Interoceptive prediction, autonomic conditioning and central sensitisation are well-characterised mechanisms with imaging and physiological correlates. Symptoms produced this way are not imagined and not milder; conditioned nausea in chemotherapy patients is as real as the drug's.\n\nThree things are worth holding. The accounts are not exclusive, and the sequence inflammation-then-conditioning is the most likely truth in many cases. Neither implies the person is exaggerating or could stop by deciding to. And they diverge on treatment — tighter avoidance versus graded re-exposure — which is why the distinction is not academic and why the frontier position on blinded provocation matters so much.\n\nA clinician who asserts either account confidently in an individual case is going beyond the evidence.","angles":[["Conditioned symptoms as physiologically produced","Learned symptom responses arise through measurable autonomic and cortical mechanisms, so identifying learning does not imply the symptoms are voluntary or imagined."],["Sequential rather than competing mechanisms","Inflammation followed by conditioning to its cues is the most likely account in many cases, which makes the two explanations complementary rather than rival."]],"world":"living","upAlt":null,"edge":["down"],"fr":null,"lon":43.648000000000025,"short":"getting worse"},{"id":"social","level":1,"parent":"reentry","tier":"point","ab":3,"label":"Being disbelieved: the second illness","view":"The literature on contested diagnoses documents something consistent enough to be treated as part of the clinical picture rather than a complaint about bedside manner.\n\nPatients with unrecognised conditions report a characteristic second injury: the accumulation of appointments that end in nothing, the note in the record that reframes the illness as anxiety, the family member who stops asking, the disability claim denied for want of a code. Studies of medically unexplained symptoms and of contested syndromes find that the experience of not being believed predicts worse outcomes independently of symptom severity — through delayed care, through withdrawal from healthcare altogether, and through the loss of the social support that buffers any chronic illness.\n\nThere is a documented association between damp housing and depression, stress and anxiety in adults, and children in damp homes show more emotional symptoms. The causal direction is genuinely ambiguous and the reviews say so — damp housing correlates with poverty, insecure tenure and overcrowding, all independently associated with distress. But the association exists, and treating a patient's distress as evidence their physical illness is psychological gets the logic backwards: living in a house that is making you ill, in a dispute you cannot win, while being disbelieved, is a sufficient cause of distress by itself.\n\nFor the person in this situation the practical implication is unglamorous and real: keep at least one relationship that does not require adjudicating the diagnosis.","angles":[["Disbelief as an independent predictor of outcome","Not being believed worsens outcomes through delayed care and withdrawal from healthcare, separately from the underlying illness severity."],["Distress as consequence rather than cause","Insecure housing, financial loss and a contested diagnosis are sufficient causes of anxiety, so distress in this population does not support a psychological aetiology for the physical illness."]],"world":"living","upAlt":null,"edge":["down"],"fr":null,"lon":77.89408000000003,"short":"being disbelieved"}],"field":[{"id":"fate","level":3,"parent":null,"tier":"city","ab":3,"label":"How contested diagnoses resolve: the three historical paths","view":"Looking forward from CIRS means asking what happens to conditions in this position, and the history is reasonably clear that there are three destinations.\n\nThe first is vindication through mechanism. Peptic ulcer disease was a stress illness until Helicobacter pylori was cultured; multiple sclerosis was hysteria until imaging; coeliac disease was a childhood failure to thrive until the antibodies and the HLA association. What these share is not better advocacy. It is that someone found a measurable, specific, reproducible mechanism, and the argument ended within about a decade of that.\n\nThe second is administrative recognition without mechanism. ME/CFS took this path — codes, funding lines and formal institutional review, driven by patient advocacy and a formal evidence assessment, still without a validated biomarker. Recognition arrived; the science did not resolve.\n\nThe third is dissolution. Neurasthenia, chronic brucellosis, and most likely multiple chemical sensitivity in its strong form went this way — not refuted so much as decomposed into other diagnoses as the field moved past them.\n\nCIRS could take any of the three, and its current position is unusual: it has a proposed mechanism and a proposed biomarker, which is more than path two requires and less than path one delivers. What decides it is whether the specific measurements survive independent replication.","angles":[["Mechanism as the reliable route out of contestation","Historical cases that ended in vindication did so within roughly a decade of a reproducible mechanism being found, regardless of how long the dispute had run before."],["Recognition and resolution as separate events","A condition can be coded, funded and recognised while its biology remains unsettled, so administrative status is not evidence about mechanism."]],"world":"field","upAlt":null,"edge":["up","left","right"],"fr":null,"lon":0.0,"short":"how it resolves"},{"id":"precedent","level":2,"parent":"fate","tier":"town","ab":3,"label":"What long COVID changed","view":"No study in this field has moved the ground as much as a pandemic did.\n\nBefore 2020, the claim that an environmental or infectious exposure could leave a previously healthy person with years of fatigue, cognitive impairment, orthostatic intolerance and multisystem dysfunction — with unremarkable routine investigations — was treated in much of medicine as a claim requiring extraordinary evidence. After 2020 it described millions of people with an undisputed trigger, and the mechanisms proposed for it are precisely the ones proposed for CIRS: persistent innate activation, complement dysregulation, microclots and endothelial dysfunction, mitochondrial and metabolic shift, autonomic and small-fibre involvement.\n\nThree consequences follow for CIRS specifically. The general category became undeniable, which raises the prior on any specific instance. Enormous funding and cohort infrastructure now exists for post-exposure multisystem illness, and CIRS could in principle be studied inside it at marginal cost. And a generation of clinicians trained during the pandemic have direct experience of patients whose severe illness produced normal routine labs, which changes the reception a CIRS patient gets in a way no position statement can.\n\nThe counterweight is that long COVID has also absorbed the attention and the funding. A contested environmental diagnosis competing with an infectious one that has undeniable causation is competing badly.","angles":[["A raised prior for the whole category","Establishing that post-exposure multisystem illness definitely occurs makes any specific instance of the pattern more plausible before its own evidence is considered."],["Existing cohorts as cheap infrastructure","Adding an arm to a funded post-viral biobank costs recruitment rather than a new study, which is the most tractable route to comparative data."]],"world":"field","upAlt":null,"edge":[],"fr":null,"lon":307.2,"short":"long COVID"},{"id":"mechanism","level":2,"parent":"fate","tier":"town","ab":3,"label":"Why a mechanism, not a protocol, is what changes minds","view":"The strategic error this field has arguably made is worth stating, because it explains twenty-five years of stalemate.\n\nThe framework has invested overwhelmingly in a treatment protocol and in demonstrating that patients improve on it. That is what a clinician facing suffering patients should do, and it is also the least persuasive kind of evidence to a skeptic, because improvement over a year of avoidance and multiple interventions has too many explanations. Effort spent extending the protocol produces no movement in the recognition dispute.\n\nWhat historically ends these disputes is a mechanism that outside laboratories can reproduce with their own reagents on their own patients. Helicobacter could be cultured by anyone. Anti-transglutaminase antibodies could be measured by anyone. The specific, checkable claim is what travels; a protocol does not travel.\n\nThat points at a narrow set of high-value experiments, all of them already named on the frontier band of the subject world: the four-arm immunophenotyping study, the split-sample stability work on C4a, the independent validation cohort for the transcriptomic signature, the faecal mass balance for the binder, and the personal exposure measurement. None is expensive. All produce a result an outsider can act on.\n\nThe obstacle is not knowledge or money. It is that the network with the patients and the laboratories with the instruments have no reason to work together, and every reason not to.","angles":[["Reproducible measurements travel and protocols do not","A claim outside laboratories can test with their own reagents changes minds, while a multi-step treatment result remains attributable to too many causes."],["Choosing experiments by their persuasive value","Selecting studies for how much a skeptic would be moved by the result is a different optimisation from selecting for clinical usefulness, and this field has consistently chosen the latter."]],"world":"field","upAlt":null,"edge":[],"fr":null,"lon":7.602807272633072e-15,"short":"mechanism first"},{"id":"trial","level":2,"parent":"fate","tier":"town","ab":3,"label":"Standards, codes, and the infrastructure a diagnosis is made of","view":"It is worth being concrete about what recognition would actually change, because the answer is administrative rather than scientific and that makes it tractable.\n\nAn ICD code creates a billable entity. That in turn creates coded encounter data, which creates the possibility of population epidemiology, which is currently impossible — nobody knows the incidence or prevalence of CIRS because there is no way to count it. It creates a basis for insurance coverage and for disability determination. It permits inclusion in registries and trial recruitment through health systems rather than through advocacy networks. And it changes clinician behaviour, because a coded condition can be documented without professional risk.\n\nNone of that requires the biology to be settled — ME/CFS is the standing proof. What it requires is a case definition stable enough to code against, which loops back to the psychometric and stratification work the frontier band identifies as missing.\n\nThe building side has a parallel gap. WHO declined to set a numeric dampness guideline in 2009 for want of dose-response data, so there is no health-based exposure limit for indoor dampness anywhere. Building codes address moisture as a durability matter, not a health one. Until a number exists, remediation standards, disclosure law and landlord obligation have nothing to attach to, and every dispute stays individual.","angles":[["Codes as the precondition for epidemiology","Without a billable code there is no encounter data, so incidence and prevalence of the condition cannot be estimated by any means currently available."],["Durability standards standing in for health standards","Building codes treat moisture as a matter of material longevity, so no regulatory instrument currently attaches occupant health to dampness."]],"world":"field","upAlt":null,"edge":[],"fr":null,"lon":60.19200000000002,"short":"infrastructure"},{"id":"longcovid","level":1,"parent":"precedent","tier":"point","ab":3,"label":"Complement in long COVID, and what a borrowed finding would mean","view":"One specific convergence deserves separating out from the general long COVID point, because it bears directly on the framework's most contested marker.\n\nComplement dysregulation has emerged as a reproducible finding in long COVID, reported by independent groups using different methods, including sustained activation of the terminal pathway and altered complement profiles distinguishing patients from recovered controls. This has been established with the resources, cohort sizes and replication that CIRS research has never had access to.\n\nTwo implications run in opposite directions and both are real. It raises the plausibility of the general claim considerably: persistent complement activation after an exposure is now a documented phenomenon in a condition nobody disputes, which is the substrate the CIRS framework has asserted for two decades with much weaker evidence. And it offers a methodological template — the long COVID work uses functional pathway assays and multiplexed profiling rather than a single labile split product, which is exactly the upgrade the frontier position on C4a identifies as needed.\n\nThe other direction: if complement activation turns out to be a general feature of many post-exposure states, it stops being evidence for anything specific about damp buildings, and the framework loses a distinguishing claim while gaining a plausibility argument.\n\nWhich of those happens depends on a comparison nobody has run.","angles":[["A distinguishing marker that becomes a general one","If a finding replicates across many post-exposure illnesses it supports the category while ceasing to identify any particular condition within it."],["Borrowing methodology from a better-funded neighbour","Functional pathway assays and multiplexed profiling developed for long COVID could be applied directly to this question without new method development."]],"world":"field","upAlt":null,"edge":["down"],"fr":null,"lon":290.656,"short":"borrowed complement"},{"id":"standards","level":1,"parent":"trial","tier":"point","ab":3,"label":"Regulation: WHO 2009, ASHRAE, and codes that mention health","view":"The regulatory frontier is where this stops being a story about individual patients and becomes a building problem, and it is unusually well specified for a frontier — everyone involved knows exactly what is missing.\n\nWHO's 2009 guidelines are the governing international document and they are deliberately non-numeric: persistent dampness and microbial growth should be prevented and remediated. No concentration limit, no index threshold, because the dose-response data required to set one did not exist. ASHRAE's position document on limiting indoor mould and dampness takes the same line and its practical guidance is contained in handbook chapters on moisture management, avoiding mould in new construction, and hot-humid climate design — engineering documents, not health standards. Building codes address moisture as durability. Relative humidity recommendations in the thirty to sixty per cent band are comfort and material-preservation figures that were never linked to a health outcome.\n\nWhat follows is that no landlord, seller, employer, school district or insurer has a number to be held to. Every dispute becomes an individual argument about whether this building made this person ill, adjudicated by expert testimony — which is precisely the mechanism that produced the adversarial literature this whole terrain is built on.\n\nThe dose-response study needed to break the loop is the personal exposure measurement, and it sits on the frontier band of the subject world with a modest grant standing between it and existence.","angles":[["The absence of a number as the driver of litigation","Without a regulatory threshold, every dampness dispute is settled by competing expert testimony, which is what generated the conflicted literature in the first place."],["Comfort ranges mistaken for health limits","The thirty to sixty per cent humidity band comes from comfort and material preservation research and has never been calibrated against a health outcome."]],"world":"field","upAlt":null,"edge":["down"],"fr":null,"lon":43.648000000000025,"short":"regulation"},{"id":"equity","level":1,"parent":"trial","tier":"point","ab":3,"label":"Who gets a diagnosis: tenure, income, and the distribution of dampness","view":"Two distributions are misaligned here and the misalignment is the most predictable injustice in the terrain.\n\nDampness is concentrated in low-income and rented housing, for the well-documented reasons of overcrowding, inadequate heating and ventilation, older stock and worse envelope condition. WHO's review states this directly, and tenure emerges as a leading social predictor across datasets.\n\nThe CIRS diagnosis is concentrated somewhere else entirely. Reaching it requires a private clinician outside insurance networks, a panel of tests that are often not covered, building testing at several hundred dollars a round, and then remediation or relocation. The population able to complete that sequence is not the population most exposed. Which means the published case series describing this illness are drawn from a sample selected on the ability to pay, and the epidemiology of the actual exposure is invisible.\n\nThis has a research consequence beyond the ethical one. If susceptibility is being estimated from a cohort selected on income, education and health-system persistence, then every prevalence and haplotype-frequency estimate in the field is confounded with socioeconomic position — and the twenty-four per cent susceptibility figure in particular has never been checked against an unselected population.\n\nThe people most likely to be made ill by a damp building are the least likely to appear anywhere in this literature.","angles":[["Ability to pay as a selection filter on case series","When reaching a diagnosis requires substantial out-of-pocket spending, the described patient population is selected on income rather than on biology."],["Prevalence estimates confounded with socioeconomic position","Susceptibility figures derived from self-funded patients cannot be separated from the social characteristics that made those patients reachable."]],"world":"field","upAlt":null,"edge":["down"],"fr":null,"lon":77.89408000000003,"short":"who gets it"},{"id":"climate","level":1,"parent":"precedent","tier":"point","ab":3,"label":"Climate as an exposure-science variable, on land and at sea","view":"Both arms of the biotoxin frame have the same forward trend, which is a coincidence worth noticing because it is the one place indoor and marine exposure genuinely converge.\n\nOn land: more intense precipitation, more flooding, more post-flood reconstruction in which wet materials are sealed into assemblies. Rising ambient temperature is associated with indoor dampness in the ECRHS data. Energy retrofits proceed at scale, raising airtightness. Mycotoxin production in agricultural systems is projected to rise with temperature, CO2 and humidity, which raises dietary exposure and therefore the background against which any biomonitoring must be interpreted.\n\nAt sea: sea surface temperatures are projected to warm by 0.4 to 1.4 degrees by mid-century, and the benthic dinoflagellates that make ciguatoxins respond with higher growth rates across much of their current range and range extensions of several degrees of latitude. Coral-to-macroalgae phase shifts increase the substrate they grow on. Nutrient enrichment does too. The one countervailing trend is that in the deep tropics temperatures will exceed the species' thermal optima, where growth slows — and the expected response is migration to deeper habitats, which means monitoring programmes are pointed at the wrong depth.\n\nNeither trend is speculative and both point the same way: more exposure, in more places, measured no better than now.","angles":[["Deeper refugia as a monitoring blind spot","If warming surface waters push benthic toxin producers to greater depths, existing shallow-water monitoring will systematically under-detect them."],["Rising dietary background complicating biomonitoring","Higher agricultural mycotoxin production raises baseline human exposure, which makes any future urinary or serum measurement harder to interpret against a moving normal."]],"world":"field","upAlt":null,"edge":["down"],"fr":null,"lon":324.90208,"short":"climate"},{"id":"who2","level":1,"parent":"mechanism","tier":"point","ab":3,"label":"What it would take: the five studies, and the reason none has been done","view":"The last position on this orb is a list, because after everything above the remaining question is narrow: what would actually settle this, and why has nobody done it.\n\nFive studies, all named on the frontier band of the subject world, none expensive by the standards of the journals they would appear in. Personal breathing-zone exposure measurement by particle size in occupied damp buildings. Four-arm immunophenotyping against ME/CFS, healthy and exposed-but-well controls. Split-sample stability work bounding the preanalytic contribution to C4a. An independent validation cohort for the transcriptomic signature. Faecal mass balance under a bile-acid sequestrant. Add a sixth, cheapest of all: bounding the sampling variance of the building indices.\n\nTotal cost is perhaps two to three million dollars. Any one of them would move the dispute further than the last decade of publication on either side.\n\nThe reason none exists is structural and it is the honest closing note. The clinical network has the patients and no incentive to fund studies that could refute its panel. Academic laboratories have the instruments and no incentive to work on an unrecognised diagnosis. Funders have no programme. Insurers and building owners have an interest in the question staying open. Patients have neither the money nor the standing.\n\nNobody's interests point at the answer. That is why the terrain stops here, and it is a much more mundane reason than either side's account of the other.","angles":[["Incentive alignment as the binding constraint on knowledge","When no party with resources benefits from resolving a question, it stays open regardless of how cheap and technically straightforward the answer would be."],["Patient-funded research as a partial route around it","Advocacy organisations in other contested illnesses have funded decisive studies directly, which is the one mechanism available when institutional incentives are misaligned."]],"world":"field","upAlt":null,"edge":["down"],"fr":null,"lon":3.9705600000000074,"short":"the five studies"}],"recovery":[{"id":"recovery","level":5,"parent":null,"tier":"city","ab":1,"label":"Recovery: the four different things people mean by getting better","view":"Ask whether anyone recovers from this and you get four answers, because four different questions are being asked and nobody labels which one they are answering.\n\nThe first is symptom remission: the person functions again, works again, sleeps again. This plainly happens. Clinic series describe it, patients describe it, and the mainstream side does not dispute that people who leave damp buildings often improve. What is disputed is what did it.\n\nThe second is biomarker normalisation: C4a falls, TGF-beta-1 falls, MSH rises, the panel returns to range. Inside the framework this is the definition of recovery and the reason treatment continues after symptoms settle. Outside it, the markers themselves are contested, so their normalisation cannot certify anything.\n\nThe third is restored tolerance: the person can enter an ordinary building without reacting. This is the one patients care about most and the one the literature says least about.\n\nThe fourth is cure in the strict sense — the illness is gone and cannot return on re-exposure. There is no evidence for this, in either direction, because nobody has run the study that would show it.\n\nMost arguments about whether CIRS is treatable are two people holding different definitions and not noticing. This world separates them, and marks which claims have evidence, which have a rationale, and which have neither.","angles":[["Endpoint choice as a hidden argument","Which outcome a study measures decides in advance which treatments can look effective, so choosing an endpoint is a substantive claim rather than a methodological detail."],["Function versus normality as the goal of chronic care","In illnesses without a curative treatment, restoring what a person can do diverges from restoring what their tests show, and the two goals can pull treatment in opposite directions."]],"world":"recovery","upAlt":null,"edge":["up","left","right"],"fr":null,"lon":0.0,"short":"what recovery means"},{"id":"remission","level":4,"parent":"recovery","tier":"city","ab":1,"label":"Remission, relapse, and what would count as recovered","view":"The natural history is the part of this illness with the least written about it and the most riding on it. Whatever recovery means, it is a claim about a trajectory, and trajectories require follow-up nobody has funded.\n\nWhat is described clinically: improvement after leaving the building, often within weeks for the respiratory component and more slowly for the neurocognitive and autonomic components. Then a plateau. Then, in a substantial fraction, relapse — either on re-entering a damp environment, or after an ordinary infection, or with no identified trigger at all.\n\nThe relapse pattern is the crux, because both accounts predict it and neither is embarrassed by it. In the framework's account, relapse on re-exposure confirms a persisting susceptibility that was never corrected. In the sceptical account, relapse after infection or without trigger looks like the natural fluctuation of a post-viral-type fatiguing illness, and relapse on re-entry looks like an acquired reactivity to a place. Same observation, two readings, no design in the literature that separates them.\n\nWhat is missing is unglamorous and decisive: a cohort followed for several years with a pre-specified definition of remission, blind to which treatment the person had. Without it, \"recovered\" stays a word each clinic defines for itself, and the recovery rates quoted on either side are not comparable to each other.","angles":[["Natural history as the missing control","Without knowing how an untreated cohort changes over years, any treated cohort's improvement is uninterpretable, which makes observational follow-up a prerequisite rather than a supplement."],["Relapse as evidence both accounts absorb","An observation predicted equally well by two competing explanations discriminates between them not at all, however striking it is to the person experiencing it."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":280.8,"short":"remission"},{"id":"established","level":4,"parent":"recovery","tier":"city","ab":1,"label":"What helps regardless of which side of the dispute is right","view":"There is a floor of care that does not depend on the CIRS question at all, and it is worth mapping first, because it is the part with the strongest evidence and the part most often skipped in the argument.\n\nIt has three components. Get the person out of the exposure, or get the exposure out of the building. Treat the respiratory and allergic disease that damp-building exposure is established to cause, using ordinary guideline care. And treat every named comorbidity on its own terms, because a person with disputed multisystem symptoms can also have sleep apnoea, thyroid disease, anaemia, coeliac disease or depression, and those are all treatable now.\n\nThe reason this matters is arithmetic rather than diplomacy. The dampness-to-respiratory-harm link is graded \"sufficient evidence of association\" — the strongest tier the National Academies awards on this topic — and the Cochrane review of remediation found reductions in asthma-related outcomes in adults on the order of forty per cent. That is a larger and better-evidenced effect than anything downstream of it in this world.\n\nA patient who has done only this and improved has not proved the CIRS framework wrong. A patient who skipped it and went straight to a marker panel has, however, skipped the best-supported thing available to them.","angles":[["Confounded improvement as an inference problem","When several interventions start at once and one of them has a large established effect, later improvement cannot be attributed to the others without a design that separates them."],["The differential diagnosis that stays open","A contested syndrome label can close a workup prematurely, so treatable conditions with ordinary tests go undetected in exactly the patients least able to absorb the loss."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":312.91999999999996,"short":"what works anyway"},{"id":"protocol","level":4,"parent":"recovery","tier":"city","ab":1,"label":"The Shoemaker Protocol: a sequence of claims, described rather than recommended","view":"The framework's treatment is not a drug but an order. Roughly a dozen steps, each gated on the previous one, each aimed at a specific marker, run over months to years. The published rationale is that the illness is a cascade and that correcting downstream markers before upstream ones fails.\n\nThe sequence, in outline: remove the exposure; bind and eliminate the toxin; eradicate a nasal staphylococcal biofilm; correct antidiuretic hormone and osmolality; reduce androgen and complement abnormalities; address MMP-9 and VEGF; reduce TGF-beta-1; and finally replace the regulatory neuropeptide VIP as an endgame step.\n\nTwo things are true about it simultaneously, and holding both is the only honest position. First, the evidence thins sharply as the sequence proceeds: step one has an evidence base most of medicine would accept, step two has small controlled studies from a single group, and the later steps rest largely on marker-level rationale and open-label case series. Second, the protocol is internally coherent — each step follows from the proposed pathophysiology — and coherence is not nothing, but it is also not evidence.\n\nThis position describes the sequence and, at each rung below, states what the evidence for that rung actually is. It does not tell anyone to take any of it, and no dose appears anywhere in this file. That is a decision to make with a clinician who knows the person.","angles":[["Sequential protocols and the attribution problem","A staged treatment in which every patient receives the steps in the same order makes it structurally impossible to know which step produced any observed improvement."],["Mechanistic coherence as weak evidence","A treatment that follows logically from a proposed mechanism inherits that mechanism's uncertainty, so internal consistency and empirical support are separate properties."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":20.063999999999997,"short":"the protocol"},{"id":"symptomatic","level":4,"parent":"recovery","tier":"city","ab":1,"label":"Managing the illness while the cause stays argued about","view":"The dispute over cause has a practical consequence that gets lost: it stalls symptom management. A patient waiting for a verdict on whether they have CIRS can spend years not being treated for the things that are actually making their day hard, several of which have decent evidence in adjacent populations.\n\nThe overlap with ME/CFS and long COVID is the reason this is tractable. Around half of long COVID patients meet ME/CFS criteria, and the symptom architecture is close enough that management approaches transfer: energy management to avoid post-exertional crashes, treatment of orthostatic intolerance, sleep and pain management, and treatment of the mast-cell-type symptoms some patients have.\n\nNone of this addresses cause. All of it is reversible, cheap by comparison, and does not require anyone to win the argument first. It is also the part of care most likely to be available locally, because it does not require a clinician who has taken a position on CIRS.\n\nThe important caution runs the other way from what people expect: in this symptom picture, graded exercise is not the safe default. Where post-exertional malaise is present, escalating activity is contraindicated by current CDC, NICE and WHO guidance, and the harm is documented. Getting that one backwards costs more than most treatment decisions in this world.","angles":[["Symptom management as the neglected middle","Between a cure and doing nothing sits a large set of reversible interventions, which get skipped when a diagnostic dispute absorbs the clinical attention."],["Borrowed management across syndrome boundaries","When two illnesses share a symptom architecture, management strategies transfer more readily than causal claims do, which lets care advance while the causal question stays open."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":85.184,"short":"symptom management"},{"id":"removal2","level":3,"parent":"established","tier":"town","ab":1,"label":"Exposure removal: the intervention both sides endorse","view":"This is the strongest recommendation anywhere in this orb, and it is unusual in being the one thing the CIRS framework and its critics agree on. It is also step one of the protocol, which means every patient who improves on the protocol has already received the intervention with the best evidence before any of the contested steps begin.\n\nRemoval has two forms and they are not equivalent. Remediation fixes the building: find the water source, stop it, remove the wet material, dry the assembly, verify. Relocation moves the person. Remediation is cheaper if it works and worthless if it does not, and whether it worked is exactly the thing hardest to verify — which is why the frontier under this branch is about verification rather than about biology.\n\nThe evidence is genuinely decent by the standards of this field. The Cochrane review found moderate-quality evidence that remediating dampness and mould reduces asthma-related symptoms, with adult odds ratios around 0.6 in the meta-analysis — roughly a forty per cent reduction. That is an ordinary, replicated, unglamorous public-health finding, and it belongs to no faction.\n\nThe caveat that matters for anyone deciding: partial remediation has a worse track record than either doing it properly or leaving, and disturbing contaminated material without containment can make a building acutely worse.","angles":[["Source control as the general principle in environmental medicine","Across lead, radon, tobacco smoke and dampness, removing the source outperforms treating the exposed person, and the pattern holds where the mechanism of harm is only partly understood."],["Verification as the weak link in remediation","An intervention whose success cannot be independently confirmed will produce a mixture of successes and failures reported as one category, which flattens any real effect toward the middle."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":304.64799999999997,"short":"getting out"},{"id":"airway","level":3,"parent":"established","tier":"town","ab":1,"label":"The respiratory and allergic disease that is not in dispute","view":"Underneath the argument sits a set of conditions that damp buildings are established to cause or worsen, that have names, codes, guidelines and treatments, and that are frequently present in the same patients. Treating them is not a concession to either side.\n\nThe list is specific: asthma onset and exacerbation, wheeze, cough, upper-respiratory symptoms, allergic rhinitis, hypersensitivity pneumonitis, and eczema. Meta-analyses put dampness or visible mould as a risk factor for each, and for respiratory infections and bronchitis on top of that. Fungal sensitisation — genuine IgE-mediated allergy to Aspergillus, Alternaria, Cladosporium — is measurable with ordinary allergy testing and is associated with more severe asthma.\n\nTwo clinical points follow. First, a person with disputed multisystem symptoms may also have plain asthma that has never been spirometrically diagnosed, and guideline asthma care will help them whatever else is true. Second, fungal sensitisation testing is a real test with a real interpretation, unlike the urine mycotoxin panels sold to the same population; the two get conflated constantly, and they are not the same kind of object.\n\nThis is the most reliably useful position in the world for someone who wants something to do this month.","angles":[["Established disease hidden inside a contested one","When a patient carries a disputed label, ordinary diagnosable conditions in the same organ systems are under-investigated, because the label already appears to explain the symptom."],["Two tests, one population, opposite standing","Fungal-specific IgE and urine mycotoxin panels are marketed to the same patients and differ entirely in validation, so distinguishing them is a practical skill rather than an academic one."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":330.62208,"short":"the airway disease"},{"id":"binders2","level":3,"parent":"protocol","tier":"town","ab":1,"label":"Steps one and two: removal, then binding","view":"The first two steps of the protocol are where its evidence is thickest, and they are worth separating from the ten that follow.\n\nStep one is removal from exposure, which is dealt with elsewhere on this band and is not in dispute. Step two is oral cholestyramine, a bile-acid sequestrant licensed since the 1970s for lipid lowering, repurposed here on the argument that biotoxins are lipophilic, are excreted in bile, and are then reabsorbed in the terminal ileum — so an agent that binds bile acids in the gut lumen interrupts that loop and creates a net elimination route.\n\nThe rationale is chemically plausible and has an established precedent: cholestyramine is standard care for bile-acid diarrhoea and has documented use in eliminating certain other lipophilic compounds. What it does not have is a demonstration that it eliminates the specific compounds at issue here, in humans, at measurable rates.\n\nThe evidence in this indication is two small controlled studies from a single group in the early 2000s, in a related exposure, with visual contrast sensitivity as the primary endpoint. That is more than most of the protocol has and much less than a licensing authority would want. The positions below take those studies apart and describe the harms ledger separately, because a cheap old drug is not the same as a harmless one.","angles":[["Repurposing on mechanism versus on outcome","An old drug redeployed on a plausible mechanism carries the safety record of its original use and none of its efficacy evidence, and those two things get imported together by mistake."],["Where a treatment's evidence is thickest is not where it is used most","In staged protocols the best-supported step is usually the first, while attention and expenditure concentrate on the later ones."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":3.519999999999996,"short":"steps 1–2"},{"id":"sequence","level":3,"parent":"protocol","tier":"town","ab":2,"label":"Steps three to twelve: correcting the panel","view":"After removal and binding, the protocol becomes a sequence of marker corrections, and this is where it separates most sharply from anything a guideline body has evaluated.\n\nThe published order addresses, roughly: eradication of a multiply-antibiotic-resistant coagulase-negative staphylococcal biofilm in the nasal cavity; correction of antidiuretic hormone and serum osmolality; reduction of androgen abnormalities; complement and MMP-9 correction, often with dietary change and a lipid intervention; VEGF; angiotensin-receptor blockade aimed at TGF-beta-1; and finally VIP replacement.\n\nEach step has a marker, a stated rationale connecting that marker to a symptom set, and a described intervention. What almost none of them has is an outcome study in which that step was isolated. The published support is largely case series, before-and-after marker data, and the argument from coherence.\n\nTwo structural problems compound this. The steps are gated, so no patient receives a later step without the earlier ones, which means no dataset in existence can attribute improvement to any individual step. And the endpoint is usually the marker itself, so a step that moves its marker counts as successful whether or not the person feels different.\n\nThat is not a claim that the steps do nothing. It is a claim that the study design in use cannot tell.","angles":[["Surrogate endpoints and the gap to how a patient feels","A treatment validated on a laboratory value can move that value reliably without changing function, and the history of cardiology has several expensive examples."],["Gated sequences as an epistemic trap","Requiring earlier steps before later ones guarantees confounding by design, so the protocol's own structure prevents it from generating the evidence it is asked for."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":37.76608,"short":"steps 3–12"},{"id":"pacing","level":3,"parent":"symptomatic","tier":"town","ab":2,"label":"Energy management, and the exercise advice that is actively harmful here","view":"If there is one piece of practical information in this world worth more than the rest, it is this one, because getting it wrong is common and the harm is documented.\n\nA large fraction of these patients have post-exertional malaise: a delayed, multi-system worsening after physical, cognitive, emotional or orthostatic exertion, arriving hours to days later and lasting days to weeks. It is not deconditioning and it does not behave like ordinary fatigue. In ME/CFS it is the cardinal feature; among long COVID patients surveyed, the large majority report it.\n\nWhere PEM is present, graded exercise therapy is contraindicated. NICE withdrew its recommendation of graded exercise and CBT for ME/CFS in the 2021 guideline update and now recommends energy management only; CDC and WHO guidance align. Multiple studies document that escalating activity can trigger severe crashes and lasting functional loss.\n\nWhat replaces it is pacing: staying inside an energy envelope, stopping before the ceiling rather than at it, and treating rest as a treatment rather than a failure. Observational data associate successful pacing with fewer symptoms and better quality of life. It has no randomised trial of its own, which is a real gap and is dealt with at the frontier below.\n\nAnyone advising this patient to push through should be given the current guidelines to read.","angles":[["A guideline reversal and the lag before practice follows","When a major recommendation is withdrawn, clinical habit persists for years, so the harm continues in settings that have not read the update."],["Rest as an active intervention","Framing rest as treatment rather than as absence of treatment changes how it is prescribed, measured and adhered to, independently of the underlying pathophysiology."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":76.91199999999999,"short":"pacing"},{"id":"autonomic","level":3,"parent":"symptomatic","tier":"town","ab":2,"label":"Orthostatic intolerance, sleep, pain, and the mast-cell question","view":"The remaining symptom load clusters into four groups, each with an established approach that does not depend on the CIRS question.\n\nOrthostatic intolerance is the most under-detected and the most fixable. Postural orthostatic tachycardia syndrome and its relatives are common in this symptom picture, reduce cerebral blood flow, worsen cognitive symptoms and amplify post-exertional crashes. A ten-minute passive stand test detects it in a clinic room with a blood-pressure cuff and no equipment budget, and the first-line management — fluid and salt intake, compression, positional strategies, careful reconditioning where PEM allows — is cheap and reversible.\n\nSleep is next: unrefreshing sleep is near-universal here, sleep apnoea is common and separately treatable, and the sleep architecture problems that remain respond partially to ordinary sleep medicine.\n\nPain and headache are managed on their own terms rather than as evidence about cause.\n\nThe mast-cell question is the least settled of the four. A subset report flushing, urticaria, food and odour reactivity and gut symptoms consistent with mast cell activation. The diagnostic criteria are strict and often unmet, the mediator testing is technically demanding, and the label is applied far more often than it is confirmed — a pattern this orb has seen before.","angles":[["Cheap tests that go unordered","A diagnostic step requiring ten minutes and a blood-pressure cuff is skipped in favour of expensive panels, which says something about clinical attention rather than about the test."],["Diagnostic labels outrunning their criteria","When a condition's formal criteria are demanding and its clinical picture is recognisable, the label spreads faster than confirmation does, and the resulting population stops matching the studied one."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":94.03504,"short":"autonomic + sleep"},{"id":"relapse","level":3,"parent":"remission","tier":"town","ab":2,"label":"What relapse looks like, and why it settles nothing","view":"Relapse is the most emotionally loaded event in this illness and the least evidentially useful, and both facts deserve stating plainly.\n\nThe pattern described in clinic series and in patient accounts is consistent: improvement after leaving, weeks to months of stability, then a return of symptoms that is faster and often more severe than the original onset. Triggers reported include entering another building, an ordinary viral infection, physical exertion, surgery, and nothing identifiable.\n\nInside the framework, faster relapse on re-exposure is a signature finding — the person is said to be primed, so the second response is quicker. Outside it, the same acceleration is what a learned or conditioned response looks like, and the infection-triggered and unprovoked relapses look like the relapsing-remitting course of a post-viral fatiguing illness, which is well described and requires no biotoxin.\n\nThe reason this settles nothing is that no study has recorded relapses with a pre-specified definition, a documented exposure measurement, and an observer blind to the person's beliefs about what happened. Every dataset in existence is either self-reported by patients who hold one account or recorded by clinicians who hold the other.\n\nFor the person living it, none of that changes what to do. For the argument, it means relapse counts as evidence for whichever side is describing it.","angles":[["Conditioned physiology is not imagined physiology","A learned response produces measurable autonomic, endocrine and immune changes, so establishing that a reaction is conditioned does not establish that it is psychological in the dismissive sense."],["Uncontrolled observation of an expected event","When both parties predict the same occurrence in advance, observing it adds no discriminating information, and its emotional weight is inversely related to its evidential weight."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":282.78528,"short":"relapse"},{"id":"remedevidence","level":2,"parent":"removal2","tier":"point","ab":1,"label":"What the remediation trials actually measured","view":"The forty per cent figure quoted for remediation deserves unpacking, because it is both the strongest number in this orb and narrower than it sounds.\n\nThe Cochrane review pooled eight studies and around six and a half thousand participants: two randomised trials, one cluster-randomised trial, and five controlled before-and-after studies. It concluded that there is moderate-quality evidence that repairing dampness and mould in homes reduces asthma-related symptoms in adults, and lower-quality evidence for effects in children and in offices and schools. The adult odds ratios cluster near 0.6, including for asthma medication use, which is a harder endpoint than symptom report.\n\nThree limits matter. The outcomes measured are respiratory: asthma symptoms, medication use, respiratory infections. Nobody measured fatigue, cognition, complement markers or contrast sensitivity, so these trials say nothing at all about the multisystem illness this orb is mapping. Blinding is impossible — the occupants know their walls were opened up — so expectation effects are unquantified. And \"remediation\" covers everything from a targeted repair to a full envelope rebuild, pooled as one intervention.\n\nWhat survives all three limits: fixing wet buildings measurably improves the health of the people in them, on outcomes nobody disputes. That is a smaller claim than either faction wants and a more solid one than either has elsewhere.","angles":[["Unblindable interventions and the ceiling on their evidence","Building work cannot be concealed from occupants, so this literature has an upper bound on quality that no amount of funding removes, and the bound is a property of the intervention rather than of the researchers."],["Endpoint mismatch between a literature and the patients citing it","A body of evidence measuring respiratory outcomes is routinely cited in support of claims about cognition and fatigue, and the substitution passes unnoticed because both concern the same buildings."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":296.87232,"short":"the 40% figure"},{"id":"partial","level":2,"parent":"removal2","tier":"point","ab":2,"label":"Partial remediation, and why half a job can be worse than none","view":"The failure mode most likely to affect an individual household is not deciding wrongly between remediating and leaving. It is remediating incompletely and believing otherwise.\n\nThree mechanisms produce it. Disturbance without containment: opening a contaminated assembly releases spores and submicron fragments at rates orders of magnitude above baseline, and a job done without negative pressure and containment can leave a building measurably worse than before it started. Cosmetic repair: replacing visible finish while the wet substrate and the water source remain gives an occupant a clean-looking room and an unchanged exposure. And source failure: the moisture entry point is never found, so the assembly rewets on the next season's schedule.\n\nThe consequence for the person is worse than the exposure itself. Having remediated, they now have a reason to believe the exposure is gone, so continuing symptoms get attributed to something else — a persisting illness, a second building, their own susceptibility — and the actual cause stops being investigated. That is the specific way a household loses years.\n\nThe practical asymmetry: verification after the work costs a fraction of the work, and is skipped more often than any other step. What verification should consist of is exactly what the frontier below cannot answer.","angles":[["Interventions that remove the evidence of their own failure","When an action changes the appearance of a problem more reliably than the problem, subsequent reasoning proceeds from a false premise that is difficult to revisit."],["Containment as the difference between repair and release","The same physical work performed with and without pressure isolation produces opposite short-term exposures, which makes contractor practice a health variable rather than a quality-of-finish one."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":312.9679776,"short":"half a job"},{"id":"abpa","level":2,"parent":"airway","tier":"point","ab":2,"label":"Where fungi cause named disease, and where the map stops being contested","view":"There is a region of this subject with no dispute in it at all, and knowing where its border runs is clarifying.\n\nFungi cause several established human diseases. Invasive aspergillosis in the immunocompromised. Allergic bronchopulmonary aspergillosis, an IgE and IgG mediated hypersensitivity in asthma and cystic fibrosis with defined criteria and standard treatment. Chronic pulmonary aspergillosis in damaged lungs. Fungal sinusitis in several forms. Hypersensitivity pneumonitis from repeated inhalation of organic antigens, including from damp indoor environments. Severe asthma with fungal sensitisation. And acute mycotoxicoses from ingested contaminated food, which are well documented and occasionally lethal.\n\nEvery one of these has a mechan
