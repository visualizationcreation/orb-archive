verturning it.\n\nFirst, fungal fragments. Submicron fragments detach from colonies at rates hundreds of times higher than intact spores, penetrate deeper into the airway, carry mycotoxin and glucan, and are not counted by spore-based air sampling. The exposure denominator in the original arithmetic may simply be wrong. Second, the agents may not be the toxins. Beta-glucans, endotoxin from co-occurring Gram-negative bacteria, and actinobacterial products signal through pattern-recognition receptors at concentrations far below any classical toxicological threshold — inflammation is not toxicity and does not obey the same dose-response. Third, the animal models used to set thresholds measured lethality and organ damage, not chronic low-grade innate activation.\n\nThe dose argument remains the strongest thing critics have. It is an argument against mycotoxin poisoning, and the framework has been moving away from claiming that.","angles":[["Signalling versus poisoning as distinct dose-response regimes","Receptor-mediated inflammation is triggered at concentrations far below those needed for direct toxicity, so a calculation ruling out poisoning does not rule out an inflammatory response."],["Wrong denominators in exposure arithmetic","If airborne fragments carry most of the relevant material and are not counted by the sampling method, every dose estimate built on spore counts is understated by an unknown factor."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":48.148569456000004,"short":"inhaled dose"},{"id":"excretion","level":2,"parent":"urine","tier":"point","ab":3,"label":"Mycotoxin excretion kinetics, and the reference range nobody has established","view":"The technical core of the urine-testing dispute is pharmacokinetic, and it is not really contested by anyone who works on it.\n\nMycotoxins are small molecules with fast clearance. Ochratoxin A is the slow one, with a plasma half-life measured in weeks in humans owing to albumin binding and enterohepatic recycling; most of the others — deoxynivalenol, zearalenone, fumonisins, aflatoxin metabolites — clear in hours to a couple of days. They are not stored in fat and they do not accumulate the way a persistent organic pollutant does. A urine measurement is therefore a snapshot of recent intake.\n\nRecent intake, for essentially everyone, is food. European and Asian biomonitoring studies find detectable mycotoxins in the large majority of urine samples from ordinary populations with no unusual building exposure. That is the missing reference distribution, and its absence from the commercial panels is the decisive objection: without it, \"detected\" and \"elevated\" are marketing terms.\n\nThe one published observation that resists this is worth stating fairly. A 2024 case series reported ochratoxin A and mycophenolic acid still detectable in urine roughly eighteen months and two years after subjects left mould-infested homes, with apparent elimination far slower than published kinetics predict, in subjects carrying particular HLA-DR alleles. Four cases is four cases. But the finding is a specific, checkable anomaly rather than a vague claim, and it is the kind of observation that would matter if it replicated.","angles":[["The missing normal distribution","General-population biomonitoring shows detectable mycotoxins in most people, so a commercial panel without that comparison cannot support any claim about abnormality."],["Anomalously slow elimination as a testable claim","A report of clearance far slower than established kinetics is specific enough to be confirmed or refuted by a larger biomonitoring study, unlike most claims in this area."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":79.425358656,"short":"excretion kinetics"},{"id":"masp2","level":2,"parent":"c4a","tier":"point","ab":3,"label":"MASP2, the lectin pathway, and why C4a is preanalytically fragile","view":"The lectin pathway is the least famous of complement's three routes and the most relevant to this claim. Mannose-binding lectin and the ficolins recognise carbohydrate patterns on microbial surfaces — mannose, N-acetylglucosamine, beta-glucan motifs — and the associated serine proteases MASP1 and MASP2 then cleave C4 and C2 to assemble the C3 convertase. C4a is the small fragment discarded by that cleavage.\n\nThis is a genuinely well-chosen mechanism for the framework's purposes. Fungal cell walls are made of exactly the carbohydrates the lectin pathway is built to detect, chitin and beta-glucans. Activation requires no antibody, which fits the claim that this is innate rather than adaptive and explains why allergy testing is uninformative. And it operates on fragments as readily as on whole spores.\n\nThe measurement problem is intrinsic to the same chemistry. Complement proteases remain active in a drawn tube. C4 continues to be cleaved after collection, so measured C4a is a function of temperature, time to centrifugation, tube additive and handling. Reported values can differ severalfold on split samples handled differently. Sample stability studies for C4a exist and are unflattering.\n\nThis is why the framework specifies collection protocol and laboratory. It is also why a null replication elsewhere is never accepted as a refutation, and why a positive result inside the network is never accepted as a confirmation. The analyte itself sustains the stalemate.","angles":[["Carbohydrate recognition as an antibody-free route to inflammation","The lectin pathway responds to fungal cell wall sugars without prior sensitisation, which is why negative allergy testing is uninformative about this mechanism."],["An analyte whose properties protect a hypothesis","When a marker's instability lets both positive and null results be attributed to handling, the measurement itself blocks resolution of the dispute."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":114.797936256,"short":"MASP2 / lectin"},{"id":"treg","level":2,"parent":"tgf","tier":"point","ab":3,"label":"Regulatory T cells and the CD4+CD25++CD127lo assay","view":"The framework's most technically current piece of immunology is its use of regulatory T-cell phenotyping, and it is worth understanding what the assay does and does not deliver.\n\nRegulatory T cells suppress effector responses and are the immune system's brake. Identifying them by flow cytometry is not straightforward: FOXP3 is the definitive marker but is intracellular, requiring permeabilisation and killing the cells. The workaround the field standardised on is a surface signature — high CD25, the IL-2 receptor alpha chain, combined with low CD127, the IL-7 receptor alpha chain — which correlates well with FOXP3 positivity and can be run on live cells. That is the assay in the CIRS panel, and specifying it is a mark of someone reading current immunology rather than a textbook.\n\nTGF-beta-1 is required for the peripheral induction of these cells. So the framework's picture — elevated TGF-beta-1 with an abnormal regulatory T-cell compartment — is internally coherent: the signal is present, the brake is not working, and the response neither resolves nor escalates. That is a plausible chronicity mechanism and it is not the sort of thing an uninformed framework invents.\n\nWhat is missing is the boring, essential part. Regulatory T-cell frequencies vary substantially with age, sex, infection, stress, time of day and cytometer calibration. No published case-control study with adequate numbers and standardised gating establishes that this compartment differs in CIRS from ME/CFS or from healthy people.","angles":[["Surface-marker proxies for intracellular truth","Identifying a cell type by proxy markers because the definitive one cannot be measured on live cells introduces a known and quantifiable error into every downstream claim."],["Flow cytometry variance as a replication barrier","Regulatory T-cell frequencies shift with age, circadian timing and instrument setup, so any case-control claim requires standardised gating that this field has not published."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":140.587569456,"short":"Tregs"},{"id":"svm","level":2,"parent":"ciguatera","tier":"point","ab":3,"label":"Eleven cases, eleven controls, and a perfect classifier","view":"The ciguatera transcriptome study reports that a support-vector machine classified patients and controls with complete accuracy. That sentence is quoted often, and understanding what it can mean is the most transferable piece of statistical literacy in this whole terrain.\n\nA support-vector machine finds the hyperplane that best separates two labelled groups in feature space. With twenty-two samples and roughly twenty thousand measured genes, the feature space has a thousand times more dimensions than data points. In that regime a separating hyperplane always exists — for the real labels, and equally for randomly shuffled ones. Perfect separation is therefore not evidence about biology; it is a geometric consequence of the dimensions.\n\nWhat would make it evidence: nested cross-validation, where feature selection happens inside each fold rather than on the full dataset before splitting. Permutation testing, to show the real labels separate better than shuffled ones. And above all an independent validation cohort, where the gene set fixed in study one is tested blind on new samples. The paper's PCR confirmation of seven genes is a step toward this — a different platform on the same samples — but same-sample confirmation addresses technical reproducibility, not generalisation.\n\nNone of this makes the study bad. It was an exploratory 2015 microarray study and it was reported as one. It makes the classifier claim, as it now circulates, a much weaker thing than it sounds — and it means the field's headline biological result still awaits its validation cohort.","angles":[["Why high-dimensional data always separates","When measured variables vastly outnumber samples, a perfect separating boundary exists for random labels too, so perfect classification carries no information without cross-validation."],["Same-sample confirmation versus independent validation","Confirming genes by a second method on the original samples tests the measurement, while testing a fixed gene set on new samples tests the finding."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":171.864358656,"short":"11 vs 11"},{"id":"enterohepatic","level":2,"parent":"csm","tier":"point","ab":3,"label":"Enterohepatic recirculation: the mechanism a binder would have to exploit","view":"The binder step rests on one physiological claim, and the claim is checkable in principle for any given molecule.\n\nEnterohepatic recirculation is real and well characterised. Hepatocytes conjugate lipophilic compounds and secrete them in bile; gut bacterial glucuronidases and sulfatases deconjugate them in the distal small intestine and colon; the freed lipophilic parent is reabsorbed and returns to the liver. A molecule in this loop has a much longer effective residence time than its intrinsic clearance predicts. Bile-acid sequestrants — cholestyramine, colestipol, colesevelam — are non-absorbed anion-exchange resins that bind bile acids in the lumen; a compound that partitions into bile-acid micelles or binds the resin directly is carried out in faeces instead of returning.\n\nFor which compounds is this established? Bile acids themselves, obviously. Digoxin, thyroxine, warfarin, ezetimibe, mycophenolic acid, several perfluoroalkyl substances and dioxins, where cholestyramine's enhanced elimination is documented. Ochratoxin A undergoes enterohepatic recycling, which is part of why its half-life is weeks.\n\nFor ciguatoxin, or for the mixed inflammagens of a damp building, it is asserted rather than demonstrated. Nobody has published mass-balance data showing a specific biotoxin appearing in faeces at increased rates under cholestyramine. That measurement is not conceptually hard — it is a labelled-compound or LC-MS/MS faecal recovery study — and its absence is the single most surprising gap in this literature, because it would convert the field's best-supported treatment step from plausible to demonstrated.","angles":[["Mass balance as the missing measurement","Demonstrating enhanced faecal recovery of a specific compound under a binder is a standard toxicokinetic study that would directly test the mechanism and has not been published."],["Gut bacterial deconjugation as a drug-behaviour variable","Because reabsorption depends on microbial enzymes, the same compound recirculates differently in different people, which would predict variable binder response."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":202.35893625600002,"short":"recirculation"},{"id":"msqpcr","level":2,"parent":"ermi","tier":"point","ab":3,"label":"MSQPCR, a thirty-six species index, and unbounded sampling variance","view":"The technical foundation of building clearance in this framework is mould-specific quantitative PCR, and it is a genuinely good assay embedded in a poorly characterised sampling procedure.\n\nThe assay itself is solid. TaqMan primer-probe sets target species-specific ribosomal ITS sequences; a settled-dust sample is extracted, amplified, and cell equivalents per milligram computed against calibration standards. It detects dead cells, hyphal fragments and spores indifferently, which is the right property when fragments are the likely exposure. EPA developed it and published the thirty-six species panel and the national housing distribution against which ERMI percentiles are computed.\n\nThe problem is everything upstream of the tube. Dust is not homogeneous. Concentrations vary by room, by height, by carpet versus hard floor, by how recently the space was cleaned, by vacuum design and by how long the dust has been accumulating. No published study establishes the coefficient of variation for repeat ERMI sampling in the same home on the same day, let alone across seasons. Without that, the difference between an ERMI of 3 and an ERMI of 6 is uninterpretable — it may be a real difference in contamination or it may be which corner was vacuumed.\n\nThis is a solvable problem, and cheaply. Ten homes, five samples each, one afternoon, one paper. That it has not been done is the clearest example in this field of a foundational measurement question left open while the measurement is used to make irreversible decisions about where people live.","angles":[["Assay precision versus sampling precision","A laboratory method can be highly reproducible while the overall measurement is dominated by variance in how the sample was collected."],["Percentile rank as a substitute for a dose threshold","Scoring a building against national housing distributions locates it socially rather than toxicologically, and no exposure level follows from a percentile."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":228.148569456,"short":"MSQPCR variance"},{"id":"biofilm","level":2,"parent":"vipstep","tier":"point","ab":3,"label":"Coagulase-negative staphylococcal biofilm, and the commensal objection","view":"The MARCoNS claim is the framework's most vulnerable link, and setting out why is useful because the vulnerability is a specific missing study rather than a general implausibility.\n\nThe claim: coagulase-negative staphylococci colonise the deep nasal space in biofilm, are frequently resistant to multiple antibiotics, produce exoenzymes that cleave alpha-MSH, and thereby maintain the illness after exposure ends. Nasal biofilm is real, and Staphylococcus epidermidis and its relatives do form it. Biofilm does confer phenotypic antibiotic tolerance and does resist host clearance. Staphylococcal proteases cleaving host peptides is a documented phenomenon in principle.\n\nThe objection is prevalence. Coagulase-negative staphylococci are among the most abundant commensals of the human anterior nares and nasopharynx — present in the large majority of healthy people. Methicillin resistance among them is common in the community and much commoner after any antibiotic exposure, which most of these patients have had. So finding MARCoNS in a CIRS patient establishes almost nothing without a matched control group, and the case-control prevalence study has not been published.\n\nThe eradication step compounds it. Prolonged compounded antibiotic regimens directed at nasal commensals carry real costs — resistance selection, microbiome disruption — for a target whose pathogenic role rests on mechanism plus clinician observation. This is the step where the risk-to-evidence ratio is worst.","angles":[["Prevalence data as the precondition for calling something a reservoir","An organism present in most healthy people cannot be implicated in disease without matched control sampling, which is a cheap study that has not been done."],["Treating a target whose pathogenic role is unestablished","Prolonged antibiotics carry resistance and microbiome costs, so the evidential bar for the target should rise with the intervention's harm rather than staying fixed."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":259.42535865599996,"short":"biofilm commensal"},{"id":"f_phenotype","level":1,"parent":"roster","tier":"point","ab":2,"label":"FRONTIER — Whether CIRS is one illness or several phenotypes wearing one name","view":"This is the floor under the case definition, and the map stops here. Nobody knows whether the patients gathered by these criteria have one condition.\n\nThe reason to suspect they do not is that the entry criteria are deliberately broad — a symptom count across thirteen clusters, a panel in which different patients have different markers out of range, and an exposure history that admits buildings, cyanobacterial blooms, reef fish and post-treatment Lyme disease. That is a recipe for a mixed population. Clinicians in the field describe recognisable subtypes informally: the neurocognitive-dominant patient, the dysautonomic patient, the respiratory-dominant patient, the one whose picture is mostly gut. Whether those are stages of one illness, severity gradations, or biologically distinct conditions has never been tested.\n\nIt matters more than it sounds, because heterogeneity is the standard explanation for why treatments that work in a clinic fail in a trial. If this label covers three conditions and the protocol reverses one, every randomised trial of the whole population dilutes toward null, and both sides of the dispute get to keep their position. That failure mode has played out in ME/CFS, in fibromyalgia, and in irritable bowel syndrome, and it is the single most likely reason the CIRS argument has not resolved by now.\n\nBelow this there is no established terrain — only the study that would create it.","angles":[["Heterogeneity as the reason trials fail","A population containing biologically distinct subgroups dilutes any treatment effect toward null, which lets both a real effect and no effect produce the same trial result."],["Stratification before efficacy testing","Identifying subgroups is a prerequisite for a meaningful trial rather than a refinement afterwards, which reverses the usual research order."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":null,"condition":"A large, consecutively enrolled cohort characterised on symptoms, markers and exposure without pre-selection by a clinician who already believes the diagnosis.","experiment":"Unsupervised clustering on 300–500 consecutively assessed patients using the existing panel — no new assay required, and the data largely exists in clinic records already.","matters":"Population heterogeneity is the leading explanation for unresolved treatment disputes across every contested fatiguing illness, so this blocker holds up more than CIRS.","rivals":["One illness with variable expression, driven by exposure dose and duration","Several illnesses sharing an exposure and a symptom vocabulary","One final common pathway reached from many triggers, of which damp buildings are one door"],"unlocks":"Stratified trials, in which a protocol can be tested in the subgroup it plausibly treats rather than in everyone."},"lon":297.43999073664,"short":"▸ one illness?"},{"id":"f_unified","level":1,"parent":"mecfs","tier":"point","ab":3,"label":"FRONTIER — Whether post-exposure fatiguing illnesses share one final common pathway","view":"The edge here is a question that has become respectable very recently, and it may dissolve the CIRS dispute rather than settle it.\n\nME/CFS after Epstein-Barr or enterovirus, long COVID after SARS-CoV-2, post-treatment Lyme disease, Gulf War illness, chronic ciguatera, and CIRS after a damp building all produce a strikingly similar illness: post-exertional worsening, cognitive slowing, orthostatic intolerance, unrefreshing sleep, thermoregulatory instability. The mechanisms proposed for each independently converge — persistent innate activation, mitochondrial and metabolic shift toward hypometabolism, microclot and endothelial dysfunction, small-fibre neuropathy, and disrupted hypothalamic regulation.\n\nIf there is one downstream state that many upstream insults can lock a person into, then the argument over whether CIRS is real has been the wrong argument. The exposure would be a trigger, not the disease; the biomarker panel would index the shared state rather than a building-specific one; and the treatment question would become which parts of a common pathway are reversible.\n\nWhat stops this from being answered is not conceptual. It is that these patient populations are studied by separate research communities, funded through separate mechanisms, published in separate journals, and gathered by mutually incompatible case definitions. Nobody has assembled the cross-condition cohort, and the money to do it has never existed in one place.\n\nLong COVID changed that arithmetic more than any single finding, because for the first time the funding and the cohorts are large enough that the comparison could actually be run.","angles":[["Long COVID as the funding event that makes comparison possible","A post-exposure illness at population scale created cohorts and budgets large enough to compare against older contested syndromes, which no prior condition could support."],["Trigger versus disease in post-exposure illness","If many insults converge on one persistent state, the identity of the trigger stops determining the treatment, which reframes disputes about aetiology as secondary."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":"information gap","condition":"A single protocol applied to several post-exposure illness cohorts at once — same assays, same day, same laboratory, same analysis.","experiment":"Add a CIRS-criteria arm to an existing long COVID or ME/CFS biobank study. Marginal cost is recruitment only; the assay pipeline is already funded and running.","matters":"It determines whether a dozen separate research programmes are studying one disease, which would redirect a very large amount of currently parallel effort.","rivals":["Distinct illnesses with coincidentally similar symptoms","One final common pathway with many entry points","A shared vulnerability trait that different insults unmask"],"unlocks":"Treatment transfer — an intervention validated in one post-exposure illness becomes testable in all of them."},"lon":323.22962393664,"short":"▸ one pathway?"},{"id":"f_objective","level":1,"parent":"retina","tier":"point","ab":3,"label":"FRONTIER — Whether any test can separate exposure-driven illness from illness-driven exposure attribution","view":"This is the hardest edge in the terrain, and it is where the most heat is generated with the least evidence.\n\nTwo accounts explain the same patient. In the first, exposure produced an inflammatory state, that state produced symptoms, and increasing reactivity to small re-exposures reflects continuing immune sensitisation. In the second, an initial illness of any origin was attributed to the building, and the attribution then drove a learned threat-response in which anticipation of exposure produces real symptoms via well-characterised neural pathways.\n\nThe second account is regularly heard as an accusation and it should not be. Conditioned and expectancy-driven symptoms are not imagined — they are produced by measurable changes in autonomic tone, cortical pain processing and interoceptive prediction, and they can be as disabling as anything. The accounts are also not mutually exclusive: an inflammatory illness is an excellent thing to become conditioned to.\n\nWhat would separate them is a blinded provocation: exposure under conditions where the participant cannot know whether they were exposed, with objective outcomes. Studies of this design in multiple chemical sensitivity have generally found that symptom onset tracked belief about exposure rather than actual exposure — a finding advocates contest on grounds of dose, agent choice, and the exclusion of the most reactive patients, who cannot consent to a provocation study without risking serious relapse.\n\nThat last point is not a dodge. It is a genuine ethical constraint, and it may mean this particular question cannot be settled cleanly in the population that matters most.","angles":[["Conditioned symptoms as real physiology","Expectancy-driven symptoms arise through measurable autonomic and cortical mechanisms, so identifying them as conditioned does not imply they are fabricated or minor."],["Ethical exclusion of the most informative participants","The patients whose reactivity would best test a provocation design are the ones most harmed by relapse, so the study systematically cannot include the cases it needs."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"untested assumption","blocker2":"hard limit","condition":"A blinded provocation design the most reactive patients could safely enter — low-dose, rapidly reversible, with a pre-agreed stopping rule and objective rather than symptom endpoints.","experiment":"A single-subject randomised design: repeated blinded exposure and sham days in one consenting patient, with continuous heart-rate variability and inflammatory markers. Cheap, ethical, and n-of-1 designs are now methodologically respectable.","matters":"Every treatment claim in this illness is unfalsifiable until this is addressed, because both accounts predict improvement on avoidance and relapse on return.","rivals":["Immune sensitisation to a real agent","Conditioned threat-response to a learned cue","Both, sequentially — inflammation first, conditioning layered on top","Central sensitisation, in which the distinction stops being meaningful"],"unlocks":"An honest treatment map, in which avoidance, immune intervention and exposure-based therapy can be assigned to the patients each actually helps."},"lon":354.50641313664,"short":"▸ objective test?"},{"id":"f_review","level":1,"parent":"nam2004","tier":"point","ab":3,"label":"FRONTIER — The systematic review that would replace a twenty-two-year-old consensus","view":"The map here ends at an absence rather than a mystery, and the absence is administrative.\n\nThe documents governing mainstream opinion on dampness and multisystem illness date from 2004 and 2009, with a 2023 German update and a 2025 reaffirmation that did not re-review from scratch. In the intervening two decades the literature has produced: the submicron fragment work that changes the exposure denominator; controlled animal exposures showing innate activation and, in some models, olfactory neuron loss from Stachybotrys toxins; the entire innate-immunology framework of pattern-recognition receptors; transcriptomic methods that did not exist in 2004; and an epidemiological review of 2011–2018 studies specifically addressing multisystem rather than respiratory outcomes.\n\nNone of that has been through a formal, independent, conflict-declared systematic review with GRADE assessment by a body with no stake in the outcome. That is what is missing. It is not a scientific problem. It is a commissioning problem: such reviews cost money, require an institution willing to own the answer, and in this area every plausible institution has already taken a position or has litigation exposure.\n\nThe honest thing to say about the current state is therefore uncomfortable for everyone. The mainstream position rests on a review that predates most of the relevant evidence. The advocacy position rests on evidence that has never been independently assessed. Both sides are citing the absence of the same document.","angles":[["Commissioning as the bottleneck in contested evidence","A systematic review requires an institution willing to own an unpopular answer, so questions with litigation exposure go unreviewed regardless of how much evidence accumulates."],["Reviews as the actual unit of scientific settlement","Individual studies rarely change practice; the synthesis document does, which makes the decision to commission one a more consequential act than most experiments."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"information gap","blocker2":"authority gap","condition":"An institution with no litigation exposure and no prior position commissioning a GRADE-assessed review with declared conflicts — a Cochrane group, or a national health-technology assessment body.","experiment":"A scoping review, which is a fraction of the cost, mapping what evidence exists on dampness and non-respiratory outcomes since 2004 and whether a full systematic review is warranted.","matters":"This blocker holds up the entire recognition question, and recognition determines insurance, disability and research funding for every patient in this terrain.","rivals":["Evidence is now sufficient and the consensus is simply stale","Evidence has grown but remains too heterogeneous to synthesise","The 2023 AWMF update already is the current review and its negative finding stands"],"unlocks":"A defensible answer on recognition, which unblocks coding, coverage and funded trials."},"lon":25.000990736640006,"short":"▸ missing review"},{"id":"f_measure","level":1,"parent":"dose","tier":"point","ab":3,"label":"FRONTIER — What a person in a damp room actually inhales, per hour, measured","view":"Every dose argument on both sides of this dispute is a calculation. Nobody has the measurement.\n\nWhat would be needed is not exotic. Personal breathing-zone sampling on occupants of characterised water-damaged buildings, over ordinary daily activity, with size-resolved particle collection down into the submicron range, and analytical chemistry for mycotoxins, beta-glucans, endotoxin and actinobacterial markers on each size fraction. Report micrograms or endotoxin units inhaled per hour, by size band, by activity. That is a well-established occupational-hygiene methodology. It has been done for silica, for diesel particulate, for flour dust, for endotoxin in agriculture.\n\nIt has not been done properly for water-damaged residential interiors. What exists instead is stationary air sampling for culturable spores — a method now known to miss the fragments that probably carry most of the relevant material — plus chamber experiments on aerosolisation from pure cultures on agar, which resemble a wall cavity very little.\n\nUntil that measurement exists, the mainstream dose argument rests on an estimated denominator and the advocacy position rests on the claim that the denominator is wrong. Both are guessing, and one afternoon's worth of instrumentation on ten occupied buildings would move this further than another decade of position statements.\n\nThis is a capability-and-funding edge rather than a conceptual one, which makes it the most frustrating point on the whole orb: the thing standing in the way is a grant.","angles":[["Personal sampling versus stationary sampling","Measuring what a person breathes during normal activity gives systematically different results from a fixed monitor in the same room, and only the former estimates dose."],["Size fractionation as the decisive variable","Because respirable penetration and toxin loading both depend on particle size, an unfractionated measurement cannot settle a dose question."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"information gap","blocker2":"capability gap","condition":"Funding and access — occupied damp buildings whose owners will admit an instrumented researcher, which is precisely what litigation exposure discourages.","experiment":"Ten occupied buildings, personal cascade impactors on residents for eight hours, LC-MS/MS and LAL endotoxin assay by size fraction. A single modest grant.","matters":"It is the shared premise of both sides' central argument, so resolving it moves the entire dispute rather than one branch of it.","rivals":["Inhaled doses are orders of magnitude below toxicological thresholds and the mainstream calculation stands","Fragment-borne exposure is far higher than spore counts imply and the calculation is wrong","Doses are low but irrelevant, because the operative mechanism is receptor signalling rather than toxicity"],"unlocks":"A real dose axis, which turns every subsequent question — susceptibility, latency, response — from argument into measurement."},"lon":50.79062393664,"short":"▸ what is inhaled"},{"id":"f_biomonitor","level":1,"parent":"excretion","tier":"point","ab":3,"label":"FRONTIER — A validated human biomarker of biotoxin exposure, and what building one would take","view":"The deepest structural weakness in this entire field is that there is no way to tell, from a person, whether they were exposed. Every argument downstream inherits that gap.\n\nThe CIRS case definition works around it by requiring exposure history plus host response, which is a reasonable adaptation and also the reason the framework cannot close its own loop: without an exposure biomarker, the association between building and illness can never be established at the level of the individual patient, only argued from history.\n\nWhat a real biomarker would require is well understood, because it has been built for other exposures. A stable adduct or metabolite specific to the agent class; population reference distributions in unexposed people; demonstrated dose-response against measured environmental concentrations; and known kinetics so a measurement maps to a time window. Aflatoxin-albumin adducts meet this standard. Cotinine for tobacco meets it. Perfluoroalkyl substances in serum meet it. Urinary mycotoxins do not, for the reasons one level up.\n\nThe most promising direction is probably not the toxin at all. It is a host-response signature — a transcriptomic or epigenetic mark specific to this exposure class rather than to inflammation generally. Methylation marks are attractive because they persist long after the exposure ends, which is exactly the property this illness needs and which no metabolite can offer.\n\nNobody has run that study. It is not conceptually blocked; it needs a well-characterised exposed cohort, matched controls, and a platform that already exists.","angles":[["Epigenetic marks as durable exposure records","Methylation changes persist after an exposure ends, which suits an illness whose sufferers are typically assessed long after leaving the building."],["What validation means for a biomarker","Specificity, population reference ranges, dose-response against measured environment, and known kinetics are the four requirements, and this field has none of them."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"capability gap","blocker2":null,"condition":"A cohort with independently measured building exposure at the time of exposure, rather than reconstructed afterwards — which effectively means finding a cohort prospectively.","experiment":"Epigenome-wide methylation on stored samples from an already-characterised damp-building cohort, against matched controls. The exposure data problem is the constraint; the assay is routine.","matters":"Without it, exposure attribution in the individual patient is permanently a matter of history-taking, which is why the recognition dispute cannot be closed by better clinical work alone.","rivals":["A toxin-specific adduct or metabolite is achievable with better analytical chemistry","A host-response signature is the only realistic route because the agents are a mixture","No exposure-specific biomarker exists to be found, because the response is generic innate activation"],"unlocks":"Individual-level causal attribution, which is what a diagnosis actually requires and what this field has never had."},"lon":82.06741313664,"short":"▸ real biomarker"},{"id":"f_complement","level":1,"parent":"masp2","tier":"point","ab":3,"label":"FRONTIER — Whether complement activation here is cause, consequence, or artefact","view":"The terrain runs out under C4a, and it runs out in an unusually clean way: three explanations remain, each fully consistent with everything published.\n\nCause. Fungal cell-wall carbohydrates activate the lectin pathway directly through MASP2, complement activation is the initiating event, and the downstream inflammatory state follows from it. This is the framework's account.\n\nConsequence. Complement activation is a downstream marker of any ongoing inflammatory process, present here as it is present in dozens of conditions, carrying no aetiological information about the building.\n\nArtefact. The elevations are substantially preanalytic — a function of tube handling, time to spin, and the specific laboratory — and the reported case-control differences partly reflect that cases and controls are not sampled identically.\n\nWhat would distinguish them is not hard to specify. Blinded split-sample handling studies would bound the artefact contribution. Longitudinal sampling across a documented re-exposure, with samples handled identically, would test the temporal claim — does C4a rise before symptoms rather than with them. And functional pathway assays, which measure lectin-pathway activity rather than a fragment concentration, would sidestep the instability entirely.\n\nThe last of those is the interesting one and it barely appears in this literature. Functional complement assays are standard in immunology laboratories. Nobody in this field appears to have run one against a fragile fragment measurement, and doing so would either rescue the marker or retire it.","angles":[["Functional assays versus fragment concentrations","Measuring pathway activity rather than a labile split product avoids the sample-handling problem entirely and is standard practice in clinical immunology."],["Temporal ordering as the test for causation","Showing a marker rises before symptoms rather than alongside them distinguishes an initiating event from a downstream consequence, and requires only repeated sampling."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":null,"condition":"Blinded, identically handled sampling of cases and controls — which means the same phlebotomist, the same tubes, the same interval to centrifugation, and analysts who do not know which is which.","experiment":"A split-sample stability study: one draw, aliquots handled six ways, C4a on each. Twenty subjects. It would bound the artefact contribution in a week.","matters":"C4a is the framework's most-cited marker, so its status determines how much of the published panel survives.","rivals":["Lectin-pathway activation is the initiating event","Complement activation is a generic downstream consequence","Reported elevations are substantially preanalytic artefact","All three contribute in proportions nobody has estimated"],"unlocks":"Either a defensible exposure-responsive marker, or the removal of the field's most contested measurement from the panel."},"lon":117.43999073664,"short":"▸ cause or echo?"},{"id":"f_provocation","level":1,"parent":"treg","tier":"point","ab":3,"label":"FRONTIER — The immunological case-control study nobody has run, and why not","view":"This is the least glamorous edge on the orb and possibly the most consequential, because the missing study is routine.\n\nWhat is missing: a properly powered immunophenotyping study comparing patients meeting CIRS criteria against three groups — healthy controls, patients meeting ME/CFS criteria, and occupants of damp buildings who are not ill. Standardised flow panels, centralised gating, blinded analysis, age and sex matched, samples drawn at a controlled time of day. Regulatory T-cell frequencies, Th17 fraction, cytokine profile, complement function.\n\nThis design settles a great deal at once. If the CIRS group is indistinguishable from ME/CFS, the label is a relabelling. If it is indistinguishable from healthy controls, the panel is not measuring what it claims. If it differs from both and the well exposed occupants sit with the controls, the susceptibility claim gains real support. Every outcome is informative, which is the signature of a study worth running.\n\nWhy has nobody run it? Not cost — this is a modest study by immunology standards. The obstacles are structural. Academic immunology laboratories have little incentive to work on an unrecognised diagnosis; the clinical network that has the patients does not have the cytometry infrastructure or the incentive to fund a study that could refute its panel; and no funder has an obvious programme for it. The blocker is not knowledge. It is that nobody's interests point at the answer.\n\nBelow this the map is blank, and it is blank for institutional reasons rather than scientific ones.","angles":[["Studies whose every outcome is informative","A design in which each possible result changes what should be believed is the strongest kind, and its absence usually indicates an incentive problem rather than a technical one."],["Exposed-but-well controls as the decisive arm","Including occupants of the same damp buildings who are not ill is what tests the susceptibility claim, and it is the arm most often omitted."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"authority gap","blocker2":"information gap","condition":"A funder and an academic laboratory willing to collaborate with a clinical network whose diagnosis they may not accept — an institutional arrangement, not a scientific advance.","experiment":"The four-arm immunophenotyping study described above. Roughly two hundred participants, one cytometry core, one year. Ordinary by the standards of the field it would be published in.","matters":"It is the load-bearing empirical question for the whole framework, and it is answerable now with existing methods.","rivals":["The panel identifies a distinct immunophenotype","The panel identifies the shared post-exposure phenotype, not a specific one","The panel reflects generic inflammation and chronic illness","Variance in the assays is too large for any of the above to be resolvable at feasible sample sizes"],"unlocks":"The recognition question, decided empirically instead of politically."},"lon":143.22962393664002,"short":"▸ the case-control"},{"id":"f_seafloor","level":1,"parent":"svm","tier":"point","ab":3,"label":"FRONTIER — The seafloor: Gambierdiscus, dead coral, and where the biotoxin idea is strongest","view":"Follow the biotoxin frame down far enough and it leaves buildings entirely and arrives on the benthos, and this is where it is on its firmest ground.\n\nCiguatoxins are made by dinoflagellates of the genera Gambierdiscus and Fukuyoa — at least eighteen Gambierdiscus species now described, plus three Fukuyoa. They are benthic, not planktonic: flattened cells forty to a hundred and forty micrometres across that secrete mucus to tether themselves to macroalgae, seagrass, sand and dead coral. Herbivorous fish grazing seaweed ingest them incidentally; the polyether toxins biotransform to more potent forms and concentrate up the reef food web, reaching their highest levels in large predatory fish that people prefer to eat. In humans the toxins activate voltage-gated sodium channels; maitotoxins from the same organisms mobilise calcium, apparently in part through TRPA1. Roughly five hundred thousand acute poisonings occur worldwide each year, and a minority go on to a multisystem illness lasting years.\n\nThis is the reference case for the entire biotoxin-illness framework, and it is not contested. The organism is named, the molecule is characterised, the receptor is known, the acute syndrome is textbook, and the chronic sequel is documented. Everything CIRS asserts about water-damaged buildings is already true of reef fish.\n\nWhich is precisely the frontier. Nobody can currently explain why the mechanism transfers, or whether it does — because ciguatoxin is one identified molecule at a known receptor, and a damp wall is a mixture nobody has characterised. The strongest arm of this framework may be the least generalisable one.","angles":[["Ciguatera as the framework's only fully specified case","A single biotoxin with known source organism, structure, receptor and syndrome allows the persistence question to be studied without arguing about the agent, which no indoor exposure permits."],["Reef trophic transfer as an exposure pathway","Toxins made by benthic microalgae reach humans only after concentration through several trophic levels, so exposure depends on fish choice and size rather than proximity to the source."],["Six polyether families and one named toxin","Gambierdiscus produces several classes of cyclic polyether compounds beyond the ciguatoxins, and their contribution to the human syndrome is unmeasured."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":null,"condition":"A demonstration that the persistent inflammatory state after a characterised single-molecule exposure is the same state as the one after an uncharacterised mixed exposure.","experiment":"Run the same immune and transcriptomic panel, in one laboratory, on a chronic ciguatera cohort and a water-damaged-building cohort. The ciguatera cohorts exist in the Pacific and Caribbean and are well characterised.","matters":"If the states are the same, the buildings claim inherits the ciguatera evidence base. If they differ, the framework has been generalising from its one clean case.","rivals":["One shared post-biotoxin state, agent-independent","Ciguatoxin-specific channelopathy that does not generalise to fungal exposure at all","Several distinct persistent states that current panels cannot tell apart"],"unlocks":"Either a firm evidential foundation for the indoor claim, or a clear statement that its foundation was always a different illness."},"lon":174.50641313664002,"short":"▸ the seafloor"},{"id":"f_rct","level":1,"parent":"enterohepatic","tier":"point","ab":3,"label":"FRONTIER — The randomised trial of removal-plus-binder, and the reason it has not happened","view":"The floor under the treatment framework is a trial that has been technically feasible for twenty years.\n\nIts design is not difficult. Adults meeting CIRS criteria, all removed from verified exposure, randomised to cholestyramine or matched placebo for a fixed period. Primary outcomes chosen to resist expectation: visual contrast sensitivity, actigraphy-measured sleep, cardiopulmonary exercise testing with a two-day protocol, and the marker panel. Blinding is achievable — a bile-acid sequestrant is unpleasant and gritty, which is a problem for placebo matching but a solvable one, and colesevelam tablets are easier still.\n\nThere is one precedent to build on: the 2001 estuary work, which had genuine control arms and reported effect sizes usable for a power calculation. Nothing has replicated it in the building population where the drug is now mainly used.\n\nThe obstacles are worth naming precisely, because none of them is scientific. Nobody owns cholestyramine — it went generic decades ago, so no commercial sponsor exists. The clinical network with the patients would be risking its central treatment claim. Academic centres do not recognise the diagnosis, so a trial is hard to get through review committees who question the enrolment criteria. Patients, having improved on the protocol, are reluctant to be randomised to placebo. And the illness's own logic supplies an escape: a null result can be attributed to incomplete removal from exposure.\n\nThat last feature is the real edge. A treatment framework in which failure is always attributable to step one is a framework that cannot be tested at step two.","angles":[["Off-patent drugs and the sponsorship gap","Generic medicines have no commercial party with an interest in funding trials, which leaves effective and ineffective generic treatments equally untested."],["Escape clauses that block falsification","When a protocol can attribute any failure to incomplete completion of an earlier step, no result can count against it, which is a design feature rather than an accident."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"untested assumption","blocker2":"capability gap","condition":"A pre-registered protocol with exposure verification agreed in advance by both parties, so that a null result cannot be re-attributed to inadequate removal afterwards.","experiment":"Before any trial: the faecal mass-balance study one level up. If a binder does not measurably increase elimination of anything, a clinical trial is premature.","matters":"Step two is where the framework's evidence is thickest, so it is the step whose failure or confirmation would move opinion furthest.","rivals":["Binding works by interrupting enterohepatic recirculation as claimed","Binding works, but by an unrelated mechanism — bile acid sequestration itself, or gut microbial change","Apparent benefit is time out of the building, and the binder contributes nothing"],"unlocks":"The first genuinely decisive result in this field, in either direction."},"lon":205.00099073664003,"short":"▸ the trial"},{"id":"f_buildings","level":1,"parent":"msqpcr","tier":"point","ab":3,"label":"FRONTIER — A building stock getting tighter, older and wetter, and exposure science that has not kept up","view":"This is the frontier that concerns the future rather than the past, and it is the one where the trend lines are least ambiguous.\n\nRoughly half of American homes show evidence of dampness or mould, and the estimate holds across climates — Lawrence Berkeley's surveys put arid-state housing in much the same range as humid-state housing, because the driver is building condition rather than outdoor weather. European inspection data run similar: thirty-one per cent of ten thousand Norwegian dwellings had verified moisture damage, concentrated in crawl spaces, basements, uninsulated attics and bathrooms. The ECRHS survey found older buildings had more dampness, and that ambient relative humidity was not associated with indoor dampness at all — temperature and precipitation were.\n\nThree trends push the same direction. Energy-efficiency retrofits increase insulation and airtightness, which improves thermal performance and, without commensurate ventilation, accumulates interior moisture — a well-documented and now widely acknowledged trade-off. The housing stock is ageing, and envelope condition is the strongest predictor of dampness in the data. And a warming climate brings more intense precipitation, more flooding, and more post-flood reconstruction, which is when wet materials get sealed inside walls.\n\nMeanwhile no health-based exposure threshold exists for indoor dampness or mould. Current standards specify relative humidity bands that are not linked to health risk. WHO declined to set a numeric guideline in 2009 and instead recommended prevention, precisely because the dose-response needed for a number did not exist. It still does not.\n\nWe are heading into more exposure with less capacity to measure it.","angles":[["Airtightness as a moisture trade-off","Improving a building envelope's thermal performance without matching ventilation increases interior moisture accumulation, which is a documented consequence of energy retrofits."],["Guidelines without numbers","WHO recommended preventing dampness rather than setting an exposure limit because the dose-response data required for a limit did not exist, and that gap persists."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":"capability gap","condition":"A health-based dampness exposure metric — some measurable building property with a demonstrated dose-response to a health outcome. It does not currently exist for any outcome.","experiment":"Bound the sampling variance of the existing indices first. Ten homes, five dust samples each, one day. Without that, no dose-response study built on those indices can succeed.","matters":"Building codes, insurance, disclosure law and remediation standards all need a number, and in its absence each has invented its own.","rivals":["A dampness metric with a health dose-response is achievable and simply unfunded","Exposure is too heterogeneous for any single metric, and observational scoring is the ceiling","The relevant agent is not dampness itself but a specific microbial product yet to be identified"],"unlocks":"Enforceable standards — the point at which this stops being a matter of individual patients relocating and becomes a building-code question."},"lon":230.79062393664,"short":"▸ tighter, wetter"},{"id":"f_pfiesteria","level":1,"parent":"biofilm","tier":"point","ab":3,"label":"FRONTIER — Pocomoke, 1997: what happens to a clinical framework when its founding exposure dissolves","view":"The deepest point on this orb is a historical one, and it is uncomfortable in a way the field has never fully addressed.\n\nIn 1997 fish kills in the Pocomoke River and Chesapeake tributaries were attributed to Pfiesteria piscicida, the dinoflagellate the press called the cell from hell. Watermen exposed to the affected water reported cognitive and memory problems; a 1998 Lancet study documented learning and memory difficulties in exposed workers; the CDC created a surveillance category, possible estuary-associated syndrome; and Shoemaker's 2001 papers reported reduced visual contrast sensitivity in exposed cohorts and its recovery on cholestyramine. Visual contrast sensitivity as a biotoxin screen, cholestyramine as a biotoxin binder, and the general model of a persistent post-biotoxin inflammatory illness were all born in that estuary. They are the load-bearing components of the CIRS framework to this day.\n\nThe exposure model did not survive. The putative Pfiesteria toxin was never isolated or chemically characterised. A 2002 PNAS study presented evidence that Pfiesteria does not produce ichthyotoxins at all, that centrifugation alone detoxified fish-killing cultures, and that the expected polyketide synthase genes were absent. The organism's elaborate life cycle turned out to be ordinary. The menhaden ulcers attributed to its toxin were later traced to a fungal pathogen. CDC surveillance across six states in 1998–99 found no persons meeting the syndrome's own criteria. NOAA's 2020 review concluded Pfiesteria is a common estuarine dinoflagellate and not the threat to human or animal health it was originally portrayed as.\n\nTwo things then have to be held together, and the field has mostly held only one. The clinical observations were not retracted — something did lower contrast sensitivity in those estuary workers, and something did improve with cholestyramine. But the agent was wrong, and a framework whose instruments were calibrated against an exposure that dissolved has never gone back and recalibrated them.","angles":[["Instruments outliving the exposure they were calibrated on","A test validated against an exposure later shown not to exist retains whatever sensitivity it had to something, but its meaning is no longer known, which requires recalibration rather than continued use."],["Sound observations under a wrong cause","A documented deficit and a documented treatment response remain facts when the proposed agent is refuted, which makes the episode a measurement problem rather than a fabrication."],["Harmful algal bloom research after Pfiesteria","The controversy drove rapid adoption of molecular detection methods across bloom science, so a collapsed hypothesis left a permanent methodological improvement behind it."]],"world":"cirs","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":null,"condition":"A reckoning with provenance: identifying what the estuary cohorts were actually exposed to — hypoxia, a co-occurring raphidophyte producing brevetoxin, another organism entirely — and recalibrating the derived instruments against a real agent.","experiment":"Retrospective analysis of archived samples and environmental data from the 1997–99 events with modern molecular and analytical methods. The samples and the surveillance records exist.","matters":"The two instruments the CIRS protocol most depends on — visual contrast sensitivity and cholestyramine — derive their evidential warrant from this episode, so their status is downstream of it.","rivals":["A different organism's toxin was responsible and the framework's instruments are validly calibrated against a real biotoxin","Non-toxic causes — hypoxia, exertion, or the documented public alarm of that period — explain the cohort findings","Multiple concurrent causes, in proportions that archived data can no longer resolve"],"unlocks":"Either honest provenance for the framework's two central tools, or a clear statement that they need revalidating from scratch."},"lon":262.06741313663997,"short":"▸ Pocomoke 1997"}],"building":[{"id":"builtstock","level":3,"parent":null,"tier":"city","ab":3,"label":"The building stock as a moisture-management problem","view":"Before anyone is ill there is a building that is wetter than it was designed to be, and the striking thing about that population of buildings is how large it is. Lawrence Berkeley's surveys put roughly half of US homes as showing evidence of a dampness problem or mould. WHO's estimate for indoor environments across Europe, North America, Australia, India and Japan is ten to fifty per cent. Norwegian inspection data on ten thousand dwellings found verified moisture damage in thirty-one per cent, with four per cent at the most severe grade.\n\nThis is not a story about neglect. A building is a moisture machine by design: it holds a temperature difference across a thin assembly, and everywhere there is a temperature difference there is a place for water vapour to condense. Add rainfall, plumbing, groundwater, cooking, showering and breathing, and dryness is an active achievement rather than a default state.\n\nThe population-level consequence is that dampness is normal. Whatever illness follows from it cannot be rare on the exposure side.","angles":[["Dryness as an achievement rather than a default","A building envelope holding a temperature difference will condense water somewhere unless design and ventilation actively prevent it, so dampness is the passive outcome."],["A common exposure with an uncommon illness","If half of homes are damp and the associated illness is rare, susceptibility rather than exposure is doing most of the explanatory work."]],"world":"building","upAlt":null,"edge":["up","left","right"],"fr":null,"lon":0.0,"short":"built stock"},{"id":"water","level":2,"parent":"builtstock","tier":"town","ab":3,"label":"How water gets in, and why it stays","view":"The routes are boringly finite: roof and wall leaks, plumbing failures, groundwater entry through foundations and crawl spaces, condensation on cold surfaces, damp construction materials sealed in before drying, humid outdoor air admitted without dehumidification, and floods.\n\nWhat matters more than entry is drying. A one-off soaking that dries within forty-eight hours generally does not establish growth. A slow, small, repeated wetting inside an assembly that cannot dry — behind vinyl wallpaper, under a shower pan, in a wall cavity with an interior vapour barrier on the wrong side — does. This is why leak history is a poor predictor and why the worst buildings often look immaculate.\n\nNorwegian inspection data ranks the vulnerable locations, and the ranking is consistent internationally: crawl spaces first, then basements, uninsulated attics, cooling rooms, bathrooms. These are also the spaces least often looked at, most often used for storage, and connected to the rest of the house by stack-driven airflow that carries whatever grows there upward.","angles":[["Drying time rather than water volume","Whether an assembly can dry within about two days determines whether wetting establishes growth, which makes drying capacity more predictive than leak size."],["Stack effect as a distribution system","Air moving upward through a building carries material from crawl spaces and basements into occupied rooms, so the growth location and the exposure location differ."]],"world":"building","upAlt":null,"edge":[],"fr":null,"lon":307.2,"short":"water in"},{"id":"assembly","level":2,"parent":"builtstock","tier":"town","ab":3,"label":"The wall assembly: airtightness, insulation, and where the dew point lands","view":"The physics is unforgiving and it explains why newer buildings are not automatically safer.\n\nWater vapour moves from warm to cold and condenses where the temperature falls below the dew point. Where that plane sits inside a wall depends on insulation position, vapour permeability of each layer, and the interior-exterior temperature and humidity difference. Get the layer order wrong for the climate — a vapour barrier on the cold side in a heating climate, an impermeable interior finish in a cooling one — and condensation occurs inside the cavity, invisibly, every winter or every summer.\n\nEnergy retrofits interact with this directly, and the interaction is now well documented rather than speculative. More insulation and more airtightness improve thermal performance and simultaneously reduce the assembly's capacity to dry and the building's air exchange. Without commensurate mechanical ventilation, interior moisture accumulates. This is one of the few places in this whole terrain where a well-intentioned policy has a documented adverse side effect.","angles":[["Layer order as the decisive design variable","The same materials assembled in a different sequence produce a dry wall or a wet one depending on climate, which makes assembly detailing more important than material choice."],["Retrofit programmes as an exposure intervention","Insulation and airtightness upgrades change interior moisture balance, so an energy policy is also, unintentionally, an indoor-air policy."]],"world":"building","upAlt":null,"edge":[],"fr":null,"lon":18.83200000000001,"short":"wall assembly"},{"id":"who","level":2,"parent":"builtstock","tier":"point","ab":3,"label":"Who bears the cost of a wet building","view":"The distribution of dampness is not random and this is the part of the story most often left out.\n\nWHO's review found the prevalence of damp in low-income communities substantially above national averages, and the mechanisms are unmysterious: overcrowding raises interior moisture generation, and inadequate heating, ventilation and insulation reduce the capacity to remove it. Tenure is the strongest single social predictor in several datasets — a UK study of nearly two thousand young mothers found damp reported by fifty-two per cent in owner-occupied housing against a substantially higher figure in rented and council accommodation, and a Canadian student survey found dampness exposure at forty per cent among tenants versus twenty-six per cent among owners.\n\nTenure matters for a second reason beyond building quality: a tenant cannot open a wall. The person best placed to detect a moisture problem is structurally the person least able to remediate it, and the person who can remediate it bears the cost of discovering it. That asymmetry is why so much of this illness lands on people who could not have prevented it.","angles":[["Detection and remediation held by different parties","Tenants observe the problem and landlords control the repair, so the incentive to investigate sits with the party who cannot act."],["Overcrowding as a moisture load","Occupant density raises interior humidity through respiration, cooking and washing, which means the same building performs differently depending on how many people live in it."]],"world":"building","upAlt":null,"edge":[],"fr":null,"lon":80.25600000000001,"short":"who pays"},{"id":"growth","level":1,"parent":"water","tier":"point","ab":3,"label":"What actually grows: the genera and what they need","view":"Water activity — the availability of water rather than its quantity — determines the community. Above roughly 0.80, Aspergillus and Penicillium species colonise; these are the ubiquitous ones, present outdoors everywhere, and their indoor dominance is a matter of ratio rather than presence. Above about 0.90, the wetter specialists arrive: Stachybotrys chartarum on cellulose that has been continuously wet, Chaetomium, Fusarium, Trichoderma. Cladosporium and Alternaria are largely outdoor organisms tracked in.\n\nThis water-activity gradient is why species identity carries information about building condition. Finding Penicillium indoors says little; finding Stachybotrys and Chaetomium says a cellulose surface has been wet for weeks. That inference — species as a proxy for wetness history — is the logic behind the mould-specific PCR indices used to decide whether a building is safe.\n\nStachybotrys attracts most attention and produces the macrocyclic trichothecenes, including satratoxins. It is also poorly aerosolised as intact spores, which is why the fragment literature matters so much to the exposure question.","angles":[["Species identity as a record of wetness history","Because different fungi require different water availability, the community present indicates how wet a surface has been and for how long."],["The gap between growth and aerosolisation","An organism can dominate a wet surface while contributing little to air concentrations, so contamination and exposure are not the same measurement."]],"world":"building","upAlt":null,"edge":["down"],"fr":null,"lon":290.656,"short":"what grows"},{"id":"actino","level":1,"parent":"water","tier":"point","ab":3,"label":"Actinobacteria and endotoxin — the non-fungal half nobody markets tests for","view":"Damp buildings are not only fungal, and the bacterial half may matter more than the marketing suggests.\n\nActinobacteria — Streptomyces and relatives — colonise damp mineral materials, concrete, plaster and mineral wool where fungi struggle. They are the dominant source of the earthy, cellar smell that people describe as musty, and they produce a substantial repertoire of bioactive secondary metabolites; this is the phylum that gave medicine most of its antibiotics. Alongside them, Gram-negative bacteria contribute lipopolysaccharide endotoxin, which is among the most potent innate-immune stimulants known and is quantified routinely by the limulus amoebocyte lysate assay in occupational hygiene.\n\nThis half of the exposure fits the innate-signalling account considerably better than mycotoxins do, because endotoxin and actinobacterial products act through pattern-recognition receptors at concentrations far below any classical toxic threshold. It is also, notably, the half that consumer mould testing does not measure and that the mainstream dose argument against mycotoxicosis does not address.\n\nThe CIRS framework's own building-clearance guidance does include LAL endotoxin assay, which is one of the more scientifically current things in it.","angles":[["Endotoxin as the best-characterised indoor immunostimulant","Lipopolysaccharide activates innate receptors at very low concentrations and is measurable by a standard assay, making it the strongest candidate agent in damp buildings."],["Mineral surfaces as a bacterial rather than fungal niche","Concrete, plaster and mineral wool support actinobacteria where fungi grow poorly, so a building can be microbially contaminated with little visible mould."]],"world":"building","upAlt":null,"edge":["down"],"fr":null,"lon":324.90208,"short":"actinobacteria"},{"id":"fragments","level":1,"parent":"assembly","tier":"point","ab":3,"label":"Submicron fragments, and why spore counts miss most of the exposure","view":"This is probably the single most consequential finding in indoor exposure science over the past twenty years, and it is why the dose arguments of the early 2000s need redoing.\n\nFungal colonies release not only intact spores but hyphal and spore fragments, and the fragment release rate has been measured at hundreds of times the spore release rate for some species and substrates. Fragments are submicron, which has three consequences. They stay airborne far longer than spores. They penetrate deeper into the respiratory tract, past the upper airway defences that capture particles above a few micrometres. And they carry both mycotoxins and cell-wall glucans while being invisible to spore counting, whether by culture plate or by microscopy — the standard methods measure the wrong particles.\n\nStachybotrys is the clearest example: notoriously difficult to aerosolise as spores, which was long taken as reassuring, and a substantial fragment producer, which reverses the conclusion.\n\nEvery calculation of the form \"spores per cubic metre times mycotoxin per spore times minute volume\" has an unknown multiplier missing. Nobody has measured what that multiplier is in occupied buildings.","angles":[["Measuring the wrong particle size class","Culture and microscopy count particles above a micrometre while most released material is smaller, so standard sampling systematically understates exposure by an unmeasured factor."],["Poor aerosolisation as false reassurance","An organism that releases few intact spores may still release many fragments, so difficulty aerosolising says little about airborne exposure."]],"world":"building","upAlt":null,"edge":["down"],"fr":null,"lon":2.288000000000011,"short":"fragments"},{"id":"vocs","level":1,"parent":"assembly","tier":"point","ab":3,"label":"Microbial VOCs, and the smell as a crude but real instrument","view":"The musty smell is dismissed as subjective and it is one of the better-validated exposure indicators available.\n\nMicrobial volatile organic compounds — geosmin, 2-methylisoborneol, various alcohols, ketones and terpenes — are metabolic products of active microbial growth. The human nose detects geosmin at parts per trillion, which is a detection limit that embarrasses most instrumentation. Crucially, MVOCs indicate metabolically active growth rather than accumulated dead material, and they diffuse through assemblies, so they can report a colony inside a wall that no surface inspection would find.\n\nBoth WHO and NAM include mould odour among the dampness indicators associated with health effects, and NIOSH's Dampness and Mould Assessment Tool scores odour alongside visible mould, water staining and wetness. In several epidemiological studies odour performs as well as or better than visible mould as a predictor of respiratory outcomes.\n\nThe limitation is that a nose cannot be calibrated, adapts within minutes to a persistent smell, and cannot locate the source. It answers whether, not where or how much.","angles":[["Olfaction outperforming instrumentation on detection limit","Human sensitivity to certain microbial volatiles exceeds routine analytical methods, which makes reported odour a legitimate exposure indicator rather than an impression."],["Active growth versus accumulated material","Volatile metabolites indicate that organisms are currently metabolising, which is different information from a count of accumulated spores or DNA."]],"world":"building","upAlt":null,"edge":["down"],"fr":null,"lon":36.53408000000002,"short":"the smell"},{"id":"dmat","level":1,"parent":"who","tier":"point","ab":3,"label":"Scoring a building by looking at it: the NIOSH assessment tool","view":"The most defensible building assessment in this whole area involves no laboratory at all, which is worth knowing before spending money on tests.\n\nNIOSH's Dampness and Mould Assessment Tool is a semi-quantitative observational instrument. An assessor scores four dampness indicators — mould odour, water damage or staining, visible mould, and current wetness — by intensity or extent, for each component of each room: ceiling, walls, windows, floor, furnishings, ventilation system, pipes, stored materials. Room and component scores aggregate to a building score.\n\nWhy this outperforms sampling in practice: it is reproducible between trained assessors, it costs nothing but time, it integrates history rather than sampling one moment, and it produces a spatial map identifying which rooms and which components are the problem — which is what remediation actually requires. Visual and olfactory assessment has been repeatedly validated as an effective method for evaluating indoor dampness, and dampness scored this way is what the epidemiological associations with respiratory outcomes were established against.\n\nAir and dust sampling answers a narrower question than most people buying it believe. The observational assessment answers the question they actually have.","angles":[["Observation validated against the epidemiology itself","Health associations were established using visually and olfactorily assessed dampness, so observational scoring measures the same exposure the evidence base is built on."],["Spatially resolved output as the remediation requirement","A component-by-component score identifies what to fix, which a single whole-building index cannot do regardless of its analytical sophistication."]],"world":"building","upAlt":null,"edge":["down"],"fr":null,"lon":84.22656000000002,"short":"NIOSH score"}],"exposure":[{"id":"route","level":3,"parent":null,"tier":"city","ab":2,"label":"Exposure as a route and a susceptibility, not a concentration","view":"Between a contaminated building and an ill person sits the step this whole dispute keeps stumbling over. Contamination is a property of a building; exposure is a property of a person in it; illness is a property of a person's response. Conflating any two of these produces most of the bad arguments on both sides.\n\nThe framing that survives scrutiny has three factors rather than one. Route determines which agents reach which tissue — inhalation for fragments and volatiles, dermal contact, ingestion of settled dust, each with different deposition and different immunology. Duration and pattern matter more than peak concentration for a chronic inflammatory response, because innate signalling integrates. And host factors determine what a given deposition does, which is the only way to explain the observation everyone agrees on: four people share a house and one becomes disabled.\n\nThat last observation is the hinge. It is equally compatible with a genetic susceptibility claim, with differing actual exposures within one building, and with differing pre-existing health. Distinguishing those is the work.","angles":[["Contamination, exposure and response as three measurements","Each is a property of a different thing, and most disagreement in this field involves treating a measurement of one as evidence about another."],["Same house, different exposures","Occupants of one building differ in room use, hours at home and activity, so unequal illness does not require unequal susceptibility to explain it."]],"world":"exposure","upAlt":null,"edge":["up","left","right"],"fr":null,"lon":0.0,"short":"route + host"},{"id":"inhale","level":2,"parent":"route","tier":"town","ab":2,"label":"Inhalation: what a respirable particle carries and where it lands","view":"Deposition is governed by aerodynamic diameter and it partitions the airway sharply. Particles above about ten micrometres are captured in the nose and upper airway. Between roughly two and a half and ten they deposit in the conducting airways. Below two and a half they reach the alveoli, and below one they behave almost like a gas, with substantial deposition and long residence.\n\nIntact fungal spores are typically two to ten micrometres, which places them in the upper and conducting airways — consistent with the well-established dampness findings of rhinitis, sinusitis, cough, wheeze and asthma exacerbation. Fragments are submicron, which places them alveolar and systemic-adjacent. That difference in landing site is the mechanistic reason the fragment literature bears on the multisystem claim specifically: an agent that reaches alveoli sits across a membrane two cells thick from the circulation, whereas an agent captured in the nose does not.\n\nThe nasal deposition is not irrelevant, though. It is the sinonasal route, and sinus involvement is among the most consistently reported features of this illness — and the proposed nasal reservoir depends on it.","angles":[["Particle size determining which illness is plausible","Upper-airway deposition predicts respiratory symptoms while alveolar deposition permits systemic exposure, so the size distribution constrains which claims are mechanistically available."],["The sinonasal route as its own compartment","Material captured in the nose contacts a mucosa continuous with the sinuses, which is the anatomical basis for the nasal-reservoir hypothesis."]],"world":"exposure","upAlt":null,"edge":[],"fr":null,"lon":307.2,"short":"inhalation"},{"id":"dose","level":2,"parent":"route","tier":"town","ab":3,"label":"The dose question that decides the whole dispute","view":"Everything turns on one number nobody has, and it is worth being explicit about why the absence is decisive rather than merely inconvenient.\n\nIf the relevant mechanism is toxicity — a molecule interfering with cellular machinery in proportion to its concentration — then dose-response is monotonic and thresholds apply, and the mainstream calculation showing indoor mycotoxin intake orders of magnitude below toxic thresholds is close to dispositive. If the relevant mechanism is receptor signalling, the arithmetic changes character entirely. Pattern-recognition receptors are amplifiers: picogram quantities of endotoxin produce measurable systemic responses, and dose-response can be non-monotonic, can sensitise with repetition, and does not have a no-effect threshold in the toxicological sense.\n\nSo the two sides are not disagreeing about a number. They are disagreeing about which dose-response regime applies, and each has assumed their own answer. The mainstream reviews evaluate mycotoxin toxicity because that was the claim being made when they were written. The framework increasingly argues signalling. Neither has measured actual inhaled quantities by size fraction in occupied buildings.\n\nThis is the single most tractable unresolved question in the terrain, and it has been unresolved for twenty years for want of a modest grant.","angles":[["Two dose-response regimes, one argument","Toxicity and receptor signalling have different mathematics, so a calculation ruling out one says nothing about the other and both sides have assumed their own regime."],["Non-monotonic and sensitising responses","Immune responses can strengthen with repeated low exposure rather than scaling with concentration, which breaks the threshold logic borrowed from toxicology."]],"world":"exposure","upAlt":null,"edge":[],"fr":null,"lon":7.602807272633072e-15,"short":"dose question"},{"id":"susceptible","level":2,"parent":"route","tier":"town","ab":3,"label":"Why two people in one house get two different illnesses","view":"This
