<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orb — CIRS / biotoxin illness</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#16150f; --fg:#f6f3ec; --amber:oklch(.78 .13 70); --teal:oklch(.78 .13 165);
  --rust:oklch(.82 .13 30); --violet:oklch(.80 .13 310);
  --line:rgba(var(--tone),.10); --line2:rgba(var(--tone),.16);
  --dim:rgba(var(--tone),.42); --dim2:rgba(var(--tone),.62);
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans)}
body{padding:0 0 60px}
a{color:var(--amber)}
.lbl{font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.mono{font-family:var(--mono)}

/* ---------- face ---------- */
header{padding:14px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.brand{font:600 10.5px/1 var(--mono);letter-spacing:.18em;color:var(--amber)}
.snap{font:400 10px/1.5 var(--mono);color:var(--dim)}
.snap b{color:rgba(var(--tone),0.72);font-weight:500}
.subj{flex:1 1 100%;font:500 15px/1.35 var(--serif);margin-top:2px;text-wrap:pretty}
.subj span{color:rgba(var(--tone),0.72)}

.wrap{display:grid;grid-template-columns:minmax(0,530px) minmax(0,1fr);gap:26px;
  padding:20px 18px 0;align-items:start;max-width:1360px;margin:0 auto}
@media(max-width:980px){.wrap{grid-template-columns:1fr;gap:20px}}

/* ---------- orb ---------- */
.stage{position:sticky;top:14px}
@media(max-width:980px){.stage{position:static}}
svg.orb{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.plate{fill:rgba(var(--tone),.022);stroke:var(--line);stroke-width:1}
.grid{fill:none;stroke:rgba(var(--tone),.07);stroke-width:1}
.axis{stroke:rgba(var(--tone),.12);stroke-width:1;stroke-dasharray:2 4}
g.node{cursor:pointer}
g.node .dot{fill:rgba(var(--tone),.42);stroke:none}
g.node .hit{fill:transparent}
g.node .halo{fill:none;stroke:none}
g.node .ring{fill:none;stroke:none}
g.node.city .dot{r:4.4}
g.node.town .dot{r:3.4}
g.node.point .dot{r:2.6}
g.node.seen .dot{fill:var(--teal)}
g.node.pinned .ring{fill:none;stroke:var(--violet);stroke-width:1.4}
g.node.hidden{opacity:0 !important;pointer-events:none}
g.node.here .dot{fill:var(--amber);stroke:var(--bg);stroke-width:1.5}
g.node.here .halo{fill:none;stroke:var(--amber);stroke-width:1.2;opacity:.55}
g.node.frontier .dot{stroke:var(--rust);stroke-width:1.2}
g.node text.lb{font:500 10px/1 var(--sans);fill:rgba(var(--tone),.66);paint-order:stroke;
  stroke:var(--bg);stroke-width:3px;pointer-events:none}
g.node.here text.lb{fill:var(--fg);font-weight:600}
g.node:focus{outline:none}
g.node:focus .dot{stroke:var(--fg);stroke-width:2}
g.node .vc{font:500 7.5px/1 var(--mono);fill:var(--bg);pointer-events:none}
.pathln{fill:none;stroke:var(--amber);stroke-linecap:round}
.pathln.back{stroke:rgba(var(--tone),.30)}
.brk{font:600 8px/1 var(--mono);fill:var(--teal)}

.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sc{padding:5px 9px;border-radius:99px;border:1px solid var(--line2);
  background:rgba(var(--tone),.04);font:400 9.5px/1 var(--mono);color:rgba(var(--tone),0.72);
  cursor:pointer;white-space:nowrap}
.sc b{font-weight:600;color:var(--amber)}
.sc:hover{background:rgba(var(--tone),.09)}
.route{margin-top:10px;font:400 10.5px/1.7 var(--mono);color:var(--dim2);
  border-top:1px solid var(--line);padding-top:9px;text-wrap:pretty}
.route i{color:var(--teal);font-style:normal}
.route .cu{color:var(--amber)}
.pins{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pinchip{padding:4px 8px;border-radius:99px;border:1px solid oklch(.80 .13 310 / .45);
  font:400 9.5px/1 var(--mono);color:var(--violet);cursor:pointer}
.hint{margin-top:9px;font:400 10px/1.6 var(--mono);color:rgba(var(--tone),0.72);text-wrap:pretty}

/* ---------- panel ---------- */
.panel{min-width:0}
.pos{font:500 21px/1.28 var(--serif);margin:2px 0 0;text-wrap:pretty}
.pos span{color:rgba(var(--tone),0.72)}
.meta{font:400 10px/1.5 var(--mono);color:var(--dim);margin-top:7px}
.scene{font:400 12.5px/1.55 var(--sans);color:var(--dim2);margin-top:12px;text-wrap:pretty}
.read{font:400 15px/1.62 var(--serif);margin-top:12px;text-wrap:pretty}
.read p{margin:0 0 .82em}
.gauges{margin-top:15px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
  background:rgba(var(--tone),.03);display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
@media(max-width:560px){.gauges{grid-template-columns:repeat(2,1fr)}}
.g{display:flex;flex-direction:column;gap:5px}
.gl{font:400 8px/1 var(--mono);letter-spacing:.09em;color:rgba(var(--tone),0.72);text-transform:uppercase}
.gv{font:500 11px/1.2 var(--sans);white-space:nowrap}
.gb{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--f),rgba(var(--tone),.13) var(--f))}
.gb.thread{background:linear-gradient(90deg,var(--teal) var(--f),rgba(var(--tone),.13) var(--f))}
.gb.grain{background:repeating-linear-gradient(90deg,var(--teal) 0 2px,transparent 2px 4px)}
.gb.anchor{background:linear-gradient(90deg,rgba(var(--tone),.13) var(--f),var(--rust) var(--f))}
.rt{margin-top:9px;padding:9px 12px;border:1px dashed var(--line2);border-radius:8px;
  font:400 10.5px/1.7 var(--mono);color:rgba(var(--tone),0.72)}
.rt b{color:rgba(var(--tone),0.78);font-weight:500}
.rt .bar{height:3px;margin-top:6px;border-radius:2px;
  background:linear-gradient(90deg,var(--teal) var(--f),rgba(var(--tone),.13) var(--f))}

/* ---- listen (speech synthesis) ---- */
#listenbar{margin-top:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#listenbar .conote{margin-top:0}
.read p.speaking{color:var(--fg);border-left:2px solid var(--teal);padding-left:10px;margin-left:-12px}

/* ---- course mode ---- */
#course{margin:0 0 14px}
.co{border:1px solid oklch(.78 .13 165 / .4);border-radius:9px;background:oklch(.78 .13 165 / .06);
  padding:11px 13px}
.co.idle{border-style:dashed;background:none;border-color:var(--line2)}
.co.done{border-color:oklch(.78 .13 70 / .5);background:oklch(.78 .13 70 / .07)}
.coh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.coh .lbl{color:var(--teal)}
.cot{font:500 12.5px/1.4 var(--sans)}
.cog{font:400 10.5px/1.5 var(--mono);color:rgba(var(--tone),0.72);flex:1 1 100%;margin-top:2px}
.cobar{height:3px;border-radius:2px;margin-top:8px;
  background:linear-gradient(90deg,var(--teal) var(--f),rgba(var(--tone),.13) var(--f))}
.cowhy{margin-top:8px;font:400 11.5px/1.5 var(--sans);color:rgba(var(--tone),0.72);text-wrap:pretty}
.cowhy b{color:var(--teal);font:600 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  display:block;margin-bottom:3px}
.cobtns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.cb{font:500 11px/1 var(--sans);padding:7px 13px;border-radius:7px;border:1px solid var(--line2);
  background:rgba(var(--tone),.06);color:var(--fg);cursor:pointer}
.cb.main{background:oklch(.78 .13 165 / .2);border-color:oklch(.78 .13 165 / .55)}
.cb.main:hover{background:oklch(.78 .13 165 / .3)}
.cb:disabled{opacity:.35;cursor:default}
.cb.ghost{background:none;color:rgba(var(--tone),0.72)}
.conote{font:400 10px/1.5 var(--mono);color:rgba(var(--tone),0.72);margin-top:7px}

.fr{margin-top:15px;padding:12px 13px;border:1px solid oklch(.82 .13 30 / .38);
  border-radius:8px;background:oklch(.82 .13 30 / .05)}
.frh{display:flex;align-items:center;gap:8px;font:600 9.5px/1 var(--mono);
  letter-spacing:.14em;color:var(--rust);text-transform:uppercase}
.frb{margin-top:4px;font:400 11px/1.5 var(--mono);color:rgba(var(--tone),0.72)}
.frrow{margin-top:10px;font:400 12.5px/1.55 var(--sans);color:rgba(var(--tone),0.8)}
.frrow b{display:block;font:600 8.5px/1 var(--mono);letter-spacing:.12em;
  color:var(--rust);text-transform:uppercase;margin-bottom:3px}
.frrow ul{margin:3px 0 0;padding-left:17px}
.frrow li{margin:2px 0}

.moves{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.pad{padding:9px 11px;border:1px solid var(--line2);border-radius:8px;
  background:rgba(var(--tone),.05);cursor:pointer;text-align:left;width:100%;color:inherit;
  font-family:inherit;display:block}
.pad:hover{background:rgba(var(--tone),.10)}
.pad .pd{display:block;font:400 8.5px/1 var(--mono);letter-spacing:.13em;color:rgba(var(--tone),0.72);
  text-transform:uppercase}
.pad .pd.thread{color:var(--teal)}
.pad .pt{display:block;font:500 13px/1.35 var(--sans);margin-top:5px;text-wrap:pretty}
.pad .sub{display:block;font:400 11px/1.45 var(--sans);color:rgba(var(--tone),0.72);margin-top:4px;text-wrap:pretty}
.pad.primary{border-color:oklch(.78 .13 70 / .5);background:oklch(.78 .13 70 / .09)}
.pad.home{border-color:oklch(.82 .13 30 / .5);background:oklch(.82 .13 30 / .10)}
.pad.dead{cursor:default;border-style:dashed;border-color:var(--line);background:none;opacity:.78}
.pad.dead .pt{font-weight:400;color:rgba(var(--tone),0.72)}
.fan{margin:7px 0 0 15px;border-left:1px solid var(--line2);padding-left:12px;
  display:flex;flex-direction:column;gap:6px}
.fan .pad{background:none;padding:7px 10px}
.fan .pad .pt{font-size:11.5px;color:rgba(var(--tone),0.82)}
.shed{display:block;margin-top:5px;font:600 8px/1 var(--mono);letter-spacing:.1em;
  color:var(--violet);text-transform:uppercase}

.ws{margin-top:20px;padding:14px;border:1px solid var(--line2);border-radius:9px;
  background:rgba(var(--tone),.028)}
.wsh{font:600 10px/1 var(--mono);letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
.wsn{font:400 11.5px/1.55 var(--sans);color:rgba(var(--tone),0.72);margin-top:7px;text-wrap:pretty}
.wsg{margin-top:12px}
.wsg > .lbl{display:block;margin-bottom:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:7px;
  border:1px solid transparent;cursor:pointer;font:400 12px/1.45 var(--sans)}
.opt:hover{background:rgba(var(--tone),.05)}
.opt.on{border-color:oklch(.78 .13 70 / .45);background:oklch(.78 .13 70 / .08)}
.opt input{margin:2px 0 0;accent-color:oklch(.78 .13 70)}
.opt .fl{display:block;font:400 10.5px/1.45 var(--mono);color:rgba(var(--tone),0.72);margin-top:3px}
.opt.dis{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.box{margin-top:12px;width:100%;min-height:190px;background:rgba(0,0,0,.28);color:rgba(var(--tone),0.86);
  border:1px solid var(--line);border-radius:7px;padding:11px;font:400 11px/1.6 var(--mono);
  resize:vertical}
.btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:7px;background:var(--amber);color:#16150f;border:0;
  font:600 11.5px/1 var(--sans);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--fg);font-weight:500}
.ok{font:400 10px/1 var(--mono);color:var(--teal);align-self:center}

details.red{margin:26px auto 0;max-width:1360px;padding:0 18px}
details.red summary{cursor:pointer;font:600 10px/1 var(--mono);letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase;padding:12px 0;border-top:1px solid var(--line)}
table.rd{width:100%;border-collapse:collapse;font:400 12px/1.5 var(--sans);margin-bottom:14px}
table.rd th{text-align:left;font:600 9px/1 var(--mono);letter-spacing:.12em;color:var(--dim);
  text-transform:uppercase;padding:7px 10px 7px 0;border-bottom:1px solid var(--line)}
table.rd td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);
  color:rgba(var(--tone),0.74);vertical-align:top}
table.rd td.out{color:rgba(var(--tone),0.72)}
.note{font:400 11.5px/1.6 var(--sans);color:rgba(var(--tone),0.72);margin:10px 0 0;text-wrap:pretty}
@media(prefers-reduced-motion:reduce){.pathln{transition:none}}
</style>
<style id="orb-shared-theme">

header,.stage,.gauges{--bg:#101914;--fg:#e8eee7;--amber:#c7dca1;--teal:#a6c69a;--rust:#e7aa8d;--violet:#b7c9d1;--tone:232,238,231;--line:#34483a;--line2:#526958;--dim:#b2c2b3;--dim2:#ccd7c9;background:#101914;color:#e8eee7}
header{padding:18px 24px}.stage{padding:16px;border-radius:6px}.gauges{border-radius:5px}
.panel{padding:2px 0 20px}.pos{font-family:var(--sans);font-weight:600}.read{font-size:16px;line-height:1.72}
.sc,.pinchip,.cb,.pad,.ws,.box,.co,.rt,.fr{border-radius:4px}.sc{font-size:11px;padding:7px 10px}.hint,.route{font-size:11px}
.pad.primary,.opt.on{border-color:#78976d;background:#eff5e9}.pad.primary:hover{background:#e3edd9}.opt input{accent-color:#365c42}
.co,.co.done{border-color:#91ab82;background:#f0f5eb}.cb.main{background:#365c42;color:#fff;border-color:#365c42}.cb.main:hover{background:#284a33}
.box{background:#f4f6f3;color:#18201b}.btn{background:#365c42;color:#fff}.btn.ghost{background:transparent;color:#365c42}
.ws{background:#f4f6f3}.fr,.pad.home{border-color:#be907c;background:#fbf5ef}.pinchip{border-color:var(--violet)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #5f8755;outline-offset:3px}
@media(max-width:560px){.stage{padding:10px}.wrap{padding:14px 12px 0}.sc{font-size:10px}}

</style>

<script>
/* ===================================================================== data */
var D = {"worlds":{"cirs":[{"id":"eai","level":6,"parent":null,"tier":"city","ab":3,"label":"Environmentally acquired illness as a contested clinical category","view":"This is the shelf CIRS is filed on, and the shelf has a history. Environmentally acquired illness names a family of conditions in which patients report multisystem symptoms they attribute to a specific exterior exposure — a building, a chemical, an implant, a pesticide, a body of water — and in which the attribution is disputed by parts of organised medicine. Sick building syndrome, multiple chemical sensitivity, Gulf War illness, chronic Lyme, and CIRS all live here.\n\nWhat the members share is structural rather than biological. Each has a symptom-defined case description rather than a lesion or an organism. Each has a patient population that is unusually well informed and unusually poorly served. Each has a clinician community operating largely outside academic medicine, and a set of tests that community regards as validated and mainstream bodies regard as not. Each has a litigation shadow: buildings, employers and insurers are defendants, which means research funding and expert testimony arrive tangled together.\n\nThat structure matters because it predicts the shape of the dispute better than the biology does. Two people can agree on every published finding about CIRS and still disagree about whether it is a disease, because they disagree about what a symptom-defined syndrome is entitled to claim before a mechanism is nailed down.","angles":[["Diagnostic categories as infrastructure","A diagnosis determines insurance coverage, disability eligibility and research funding, so whether a condition is 'real' is partly an administrative question with administrative consequences."],["The litigation shadow over exposure science","When building owners and insurers are potential defendants, funding and expert testimony in indoor-air research arrive with financial interests attached on both sides."]],"world":"cirs","upAlt":null,"edge":["up"],"fr":null,"lon":0.0,"short":"contested category"},{"id":"innate","level":6,"parent":null,"tier":"city","ab":3,"label":"Chronic innate-immune activation as a general account of multisystem illness","view":"The other whole CIRS belongs to is a mechanism rather than a category. Over the past two decades a broad research programme has argued that a great deal of chronic, medically unexplained, multi-organ illness is innate-immune rather than adaptive-immune: not antibody-mediated allergy or autoimmunity, but persistent activation of complement, pattern-recognition receptors, cytokine networks and the neuroendocrine circuits they talk to.\n\nThe appeal is that it explains the shape of the complaints. Innate signalling is systemic by design and is routed through the hypothalamus, so a single upstream trigger can plausibly produce fatigue, thermoregulatory instability, cognitive slowing, sleep disruption, capillary and barrier changes, and pain — the exact grab-bag that defeats organ-by-organ workup. It also explains why standard allergy testing comes back normal: IgE and IgG assays interrogate a different immune system than the one being proposed.\n\nThe weakness is that the same appeal makes the account hard to falsify. Almost any chronic illness will show some inflammatory marker moving. Turning \"innate activation\" into a diagnosis requires a signature specific enough to exclude the alternatives, and that specificity is exactly what remains argued over. This altitude is where CIRS is most respectable and least distinctive.","angles":[["Neuroinflammation as the common road","Fatigue, cognitive slowing and sleep disruption across several unrelated illnesses converge on the same hypothalamic and glial circuits, which is why unrelated diseases produce similar complaints."],["Falsifiability as a design problem in syndrome research","A mechanism broad enough to explain many symptoms is, for that reason, harder to test against a specific illness, so breadth and evidential strength trade off against each other."]],"world":"cirs","upAlt":null,"edge":["up"],"fr":null,"lon":180.0,"short":"innate activation"},{"id":"syndrome","level":5,"parent":"eai","tier":"city","ab":0,"label":"CIRS as a proposed multisystem illness following biotoxin exposure in a water-damaged building","view":"Chronic Inflammatory Response Syndrome is a proposed acquired illness in which exposure to the interior of a water-damaged building leaves a genetically susceptible person with persistent innate-immune dysregulation and symptoms across many organ systems at once. It was named and worked out by Ritchie Shoemaker, a Maryland family physician, from the late 1990s onward, and the framework has since been extended by a network of clinicians and a small research literature.\n\nThe picture drawn is specific. A wet building grows a mixed community — fungi, actinobacteria, their fragments and metabolites, endotoxin. Some fraction of occupants, in the framework's account those carrying particular HLA-DR haplotypes, fail to clear or correctly present the resulting antigens. Instead of resolving, the innate response persists: complement split products rise, regulatory neuropeptides fall, the hypothalamic-pituitary axis loses its set points, and the illness becomes self-sustaining even after the person leaves the building. Hence the clinical signature clinicians in this field report: twenty or more symptoms, spanning fatigue, cognitive impairment, headache, light sensitivity, static shocks, thermoregulatory failure, breathlessness, joint pain, gut disturbance.\n\nThe framework is genuinely contested — not on whether these patients are ill, which nobody serious disputes, but on whether this is one illness with these markers and this treatment. That dispute is a facet on this ring, not a footnote.","angles":[["The friend's actual question: does leaving work","Removal from the damp building is the single intervention that both the CIRS framework and its mainstream critics endorse, which makes it the most defensible thing anyone does in this illness."],["Naming as a clinical intervention","Receiving a specific diagnostic label changes a patient's access to care, disability support and self-understanding, independently of whether the label is later validated."],["Illness scripts and the twenty-symptom patient","A clinical system built around single-organ specialties handles a patient reporting twenty simultaneous symptoms poorly, regardless of what is causing them."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":317.7,"short":"CIRS"},{"id":"contest","level":5,"parent":"eai","tier":"city","ab":1,"label":"The recognition dispute: why CIRS has a literature but not a code","view":"CIRS is not in ICD-10. It is not on the CDC's list of recognised conditions and it is not endorsed by the American Academy of Allergy, Asthma and Immunology, the American College of Medical Toxicology, or the German AWMF consortium. It does, at the same time, have a published case definition, a US patent covering its proteogenomic diagnosis, randomised data on one treatment step, and a 2024 review in Annals of Medicine and Surgery arguing that the treatment literature for CIRS is thicker than the treatment literature for ME/CFS — which the CDC does recognise.\n\nBoth of those sentences are true, and holding them together is the honest position here. The mainstream objection is not that damp buildings are harmless. NAM in 2004, WHO in 2009 and AWMF in 2023 all concluded that dampness and mould are associated with real respiratory harm and should be remediated as a priority. The objection is narrower and sharper: that the specific claim of a mycotoxin-mediated multisystem illness, diagnosed by this panel and reversed by this protocol, has not been demonstrated to the standard a new disease entity requires.\n\nAdvocates answer that the reviews being cited are twenty years old, that the ACOEM statement underpinning much of the skepticism was itself the subject of a published conflict-of-interest critique, and that recognition lags evidence for every environmentally acquired illness. That is the argument. It has not been settled.","angles":[["How ICD entry actually happens","Codes are added through committee processes driven by administrative need and organised advocacy, not by evidentiary thresholds alone, so absence of a code is weak evidence about biology."],["Comparing evidence bases across two syndromes","ME/CFS is recognised without a validated biomarker while CIRS is unrecognised with a proposed one, so recognition and biomarker availability are not tracking each other."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":45.261,"short":"recognition fight"},{"id":"biology","level":5,"parent":"innate","tier":"city","ab":1,"label":"The proposed pathophysiology: how an exposure is said to become a self-sustaining state","view":"The mechanism CIRS proposes has four moves, and each is separately arguable.\n\nFirst, antigen handling fails. Low-molecular-weight biotoxins and inflammagens are said not to be cleared, in the framework's account because particular HLA class II haplotypes present them poorly, leaving persistent antigenic stimulation rather than resolution.\n\nSecond, innate effectors stay on. Complement split products C4a and C3a rise; matrix metalloproteinase-9 rises, implicating barrier and vascular permeability; transforming growth factor beta-1 rises, pulling toward a Th17 and fibrotic profile; von Willebrand factor and VEGF move, implicating coagulation and hypoxia-response pathways.\n\nThird, regulation is lost. Alpha-melanocyte-stimulating hormone and vasoactive intestinal polypeptide fall. Because both are hypothalamic regulators, their loss is offered as the bridge from a peripheral inflammatory state to sleep architecture, osmoregulation, thermoregulation, ACTH-cortisol coupling and cognition — the specifically neurological texture of the illness.\n\nFourth, the state becomes self-maintaining. Once regulation is gone, the argument runs, secondary problems (nasal biofilm, enterohepatic recycling of the original toxin, sustained low-grade complement activity) hold the loop closed, which is why removal from the building alone does not always resolve the illness.\n\nIt is a coherent chain. Every link has published support of some kind, and no link has the sort of independent replication that would let a skeptic concede it without argument.","angles":[["Feed-forward loops in chronic disease","Illnesses that persist after their trigger is removed require a self-sustaining loop, and identifying that loop is a general problem shared by post-infectious and post-exposure conditions."],["Neuropeptides as the bridge between periphery and brain","MSH and VIP act in the hypothalamus, so peripheral inflammation that lowers them offers a concrete route from an immune event to cognitive and autonomic symptoms."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":137.7,"short":"proposed mechanism"},{"id":"treatment","level":5,"parent":"innate","tier":"city","ab":1,"label":"The Shoemaker Protocol as a sequential, staged intervention","view":"The treatment framework is a numbered sequence, usually described as twelve steps, and its structure is the most rhetorically effective thing about it: each step is meant to be pointless until the one before it is done. That converts a heterogeneous set of interventions into something falsifiable in principle, because doing them out of order is predicted to fail.\n\nStep one is removal from exposure, verified by building testing rather than by how the building smells. Step two is binding: high-dose EPA/DHA to prime, then a bile-acid sequestrant — cholestyramine, or colesevelam for tolerance — on the argument that these toxins recirculate enterohepatically and can be intercepted in the gut. Later steps address antigliadin antibodies, the nasal reservoir of coagulase-negative staphylococci, androgen and ADH dysregulation, MMP-9, VEGF, C4a, TGF-beta-1, and finally VIP replacement as the step said to reset regulation and permit re-entry into ordinary environments.\n\nThe published evidence is uneven across the sequence and thickest at the start. Cholestyramine's effect on visual contrast sensitivity in estuary-exposed patients was reported with controls in 2001. Later steps rest largely on case series, single-arm data and clinician report. A 2024 review found the protocol was the only treatment in this space with documented clinical efficacy in its inclusion set — a finding whose weight depends heavily on what that inclusion set excluded.\n\nNothing here is a recommendation. It is a description of what the protocol claims and where its support is thin.","angles":[["Sequential protocols as a research design","Ordering interventions so each is predicted to fail without its predecessor makes a multi-part treatment testable in a way an unordered bundle is not."],["Removal-first as the uncontroversial core","Every party to this dispute agrees that occupants of a damp building benefit from remediation or relocation, so step one is supported even by parties who reject steps two through twelve."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":225.261,"short":"the protocol"},{"id":"casedef","level":4,"parent":"syndrome","tier":"city","ab":0,"label":"The case definition, and what it asks a clinician to establish","view":"The published case definition has four requirements, and reading them in order shows what kind of object CIRS is.\n\nOne: potential exposure to a biotoxin-producing source. In practice a water-damaged building, established by history plus building testing, but the definition also admits blooms of cyanobacteria, ciguatoxic fish and post-treatment Lyme disease. Two: a multisystem, multi-symptom presentation, scored against thirteen symptom clusters. Three: laboratory abnormalities in the proposed panel — depressed MSH and VIP, elevated C4a, TGF-beta-1, MMP-9, and abnormalities in ADH/osmolality and ACTH/cortisol coupling. Four: response to therapy, and specifically to the sequenced protocol.\n\nThe fourth criterion is the one that draws fire, and the objection is a real one. A definition that includes response to a particular treatment is partly circular: patients who do not respond can be reclassified as not having had the illness, which insulates the treatment from disconfirmation. Defenders reply that treatment response is a legitimate part of definitions elsewhere in medicine — dopamine responsiveness in parkinsonism, gluten withdrawal in coeliac disease — and that the alternative is worse when no single test is diagnostic.\n\nWhat the definition does not require is a measured toxin in the patient. That absence is not an oversight. No validated human biomarker of biotoxin exposure exists, which is why the definition is built from host response instead.","angles":[["Circularity in treatment-response criteria","Including response to therapy in a case definition makes non-responders reclassifiable as misdiagnosed, which weakens the definition's ability to be shown wrong."],["Definitions built from host response rather than agent","When an exposure cannot be measured in the patient, a syndrome must be defined by the body's reaction, a constraint shared with several accepted conditions."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":304.446,"short":"case definition"},{"id":"natural","level":4,"parent":"syndrome","tier":"city","ab":0,"label":"The natural history: onset, plateau, relapse, and what remission looks like","view":"The time-course is the part of CIRS most legible to someone living it and least represented in the literature. Clinicians in the field describe a fairly consistent arc, though it is an arc drawn from case series rather than cohort follow-up.\n\nOnset is usually not dramatic. Occupants report months of drift — sinus congestion, unrefreshing sleep, a slowly narrowing tolerance for effort — before anything reads as illness. The often-reported inflection is a second event: a flood, a renovation that opens a wall, a move into a worse building, or an unrelated infection, after which the picture consolidates fast. Latency is part of why the exposure is so often missed; the building is frequently identified in retrospect, sometimes after the person has already left it.\n\nLeaving produces partial improvement in a substantial fraction and complete resolution in a minority. What clinicians describe after that is a plateau: better than in the building, not well, and now unusually reactive to small re-exposures — a hotel room, a friend's basement, a damp office. Whether that reactivity is continuing immune sensitisation, learned threat-response, or both is genuinely unsettled and is one of the more consequential open questions here.\n\nRelapse on re-exposure, and the shrinking of the world that follows from trying to prevent it, is often the disabling part rather than the original illness.","angles":[["Latency and the retrospective exposure","An illness that starts slowly and consolidates after a second event is systematically likely to have its original cause identified only in hindsight."],["Reactivity as its own disease course","In many chronic environmental illnesses the increasing intolerance of small exposures becomes more disabling than the initial episode, which makes it a treatment target in its own right."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":346.06356,"short":"natural history"},{"id":"bodies","level":4,"parent":"contest","tier":"city","ab":1,"label":"What the professional bodies actually say — and the large area where they agree","view":"It is worth reading the mainstream statements rather than the summaries of them, because the disagreement is narrower than either side's rhetoric suggests.\n\nThe National Academy of Medicine's 2004 Damp Indoor Spaces and Health found sufficient evidence of association between indoor dampness and upper-respiratory symptoms, cough, wheeze and asthma exacerbation. WHO's 2009 indoor-air guidelines went further on policy: persistent dampness and microbial growth should be prevented and remediated as a priority, and remediation reduces adverse outcomes. The AWMF consortium's 2023 update — twelve German medical societies — reached the same place, and added explicitly that evidence is inadequate for a link between dampness and sick building syndrome, multiple chemical sensitivity or chronic fatigue syndrome, and that newly coined terms suggesting a specific nosological entity lack support to date. ACMT reaffirmed the 2004 position in August 2025.\n\nSo the agreed ground is large: damp buildings harm occupants, the harm is real, remediation is warranted, and this is a public-health matter rather than a fringe complaint. The disputed ground is specific: whether inhaled mycotoxins cause a distinct multisystem illness, and whether the tests marketed to diagnose it measure what they claim.\n\nAdvocates make a fair point that these documents concentrate on mycotoxin toxicity while the CIRS framework increasingly rests on innate signalling by fragments, glucans and endotoxin — which the statements address much more thinly.","angles":[["What a position statement is for","Society statements are written partly to guide clinicians away from unvalidated tests, which makes them conservative about new entities regardless of the underlying biology."],["The moving target problem in a contested field","When a framework shifts its proposed mechanism, critiques aimed at the earlier version stop engaging the current claim, and both sides can accuse the other of bad faith."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":32.007000000000005,"short":"what bodies say"},{"id":"commerce","level":4,"parent":"contest","tier":"town","ab":1,"label":"The economy around the diagnosis: labs, remediators, clinics and the wellness market","view":"Any honest map of this terrain has to include the money, because it shapes what patients encounter first and it shapes the skepticism they meet.\n\nAround the clinical framework sits a real infrastructure: certified practitioners, proprietary interpretive platforms, specified reference labs — the framework insists on particular labs for particular analytes and warns that others produce invalid results — building inspectors trained in specific indices, and remediation contractors. Some of it is careful. Some of it is a market in fear. Direct-to-consumer urine mycotoxin panels, home test plates, functional-medicine practices offering long courses of binders and antifungals, and influencer-driven mould diagnosis all trade on the same anxiety and are, by a wide margin, the weakest-evidenced part of the field.\n\nThis creates a genuine confusion in the dispute that is worth naming precisely. Critics frequently attack the wellness-industry version — the unvalidated urine test, the $9,000 detox package — and treat the attack as disposing of the clinical framework, which uses different tests and makes narrower claims. Framework advocates then read that as bad-faith refusal to engage. Both complaints have some justice.\n\nFor a patient the practical consequence is harsh: the cheapest, most heavily advertised entry points into this space are the least defensible ones, and there is no neutral gatekeeper.","angles":[["Conflating a clinical framework with its market","A field's least rigorous commercial edge is easier to criticise than its research core, so critiques often land on the edge and are then read as disposing of the core."],["Patients as the paying party in unsettled science","When neither insurance nor guidelines cover a condition, patients fund their own diagnosis, which selects for whichever tests are cheapest to sell rather than best validated."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":73.62456,"short":"the economy"},{"id":"markers","level":4,"parent":"biology","tier":"city","ab":1,"label":"The blood panel: C4a, TGF-beta-1, MMP-9, MSH, VIP, VEGF, von Willebrand","view":"The panel is the framework's load-bearing empirical claim, so it deserves to be described exactly.\n\nTwo complement split products, C4a and C3a, are read as innate activation, with C4a treated as the more responsive to recent exposure. Transforming growth factor beta-1 is read as the chronic and fibrotic axis, tied to Th17 skewing and to regulatory T-cell dysfunction assessed by the CD4+CD25++CD127lo assay. Matrix metalloproteinase-9 is read as barrier and endothelial involvement — the marker offered as the route into brain and lung. Alpha-MSH and VIP, both low, are the regulatory failure. VEGF and erythropoietin index hypoxia-inducible-factor activity. The von Willebrand profile indexes coagulation. Alongside these sit paired ratios rather than single values: ADH against osmolality, ACTH against cortisol, because the framework's claim is about lost coupling rather than absolute deficiency.\n\nThe strengths are that these are conventional analytes at conventional laboratories, not proprietary assays, and that the paired-ratio logic is a genuinely more sophisticated read than a single out-of-range number.\n\nThe weaknesses are three and they are serious. Most of these markers are non-specific and move in many inflammatory states. Reference intervals used in this field are not always the labs' own. And C4a in particular is preanalytically fragile — it activates in the tube — which is why the framework specifies collection and one laboratory over another, and which is exactly the property that makes independent replication hard.","angles":[["Paired ratios as a stronger claim than single values","Testing whether two hormones stay coupled is harder to satisfy by chance than testing whether one is out of range, so ratio-based criteria carry more information."],["Preanalytic fragility as an obstacle to replication","An analyte that changes during sample handling produces results that depend on the laboratory's procedure, which limits how far any finding can travel."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":124.446,"short":"blood panel"},{"id":"genie","level":4,"parent":"biology","tier":"town","ab":1,"label":"Transcriptomics: from a marker panel to a gene-expression signature","view":"The most interesting recent move in this field is the shift from measuring proteins in blood to measuring what blood cells are transcribing. Rather than asking whether C4a is high, the transcriptomic approach asks which of roughly twenty thousand genes are up and down in whole blood, and whether the pattern is characteristic.\n\nThis is a real methodological upgrade and it deserves credit. A differential-expression signature is harder to explain away as a preanalytic artefact than a single fragile protein. It can, in principle, distinguish illnesses that look identical clinically. And it produces a falsifiable object: publish the gene set, and an independent group can test whether it separates cases from controls in their own hands.\n\nThe framework's platform for this is marketed as GENIE — Gene Expression: Inflammation Explained — and its claims include staging illness and distinguishing CIRS from ME/CFS. The foundational published dataset is not the water-damaged-building cohort but the ciguatera one: eleven patients with chronic illness after ciguatoxin exposure against eleven controls, on whole-genome microarrays, from which a support-vector classifier separated the groups.\n\nThat study is the strongest single piece of biological evidence the field has, and it is also a study with eleven cases. Both of those things need saying in the same breath, and which one you emphasise is the whole controversy in miniature.","angles":[["Expression signatures versus single analytes","A pattern across thousands of transcripts is less vulnerable to sample-handling artefacts than one fragile protein, which is why transcriptomics is a genuine methodological advance here."],["Commercial platforms and independent replication","When a diagnostic signature is delivered through a proprietary platform, outside groups have less access to the pipeline needed to reproduce or refute it."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":166.06356,"short":"transcriptomics"},{"id":"binders","level":4,"parent":"treatment","tier":"city","ab":1,"label":"Removal first, then binding: the two steps with the most support","view":"The front of the protocol is where an argument-from-evidence can actually be had, so it is worth separating the two moves.\n\nRemoval is step one and it is not really contested. Everyone in this dispute — NAM, WHO, AWMF, ACMT, and every clinician in the CIRS field — agrees that occupants of a persistently damp building should stop being occupants of a persistently damp building. Where the framework goes further is in insisting that removal be verified by building measurement rather than by appearance or smell, on the grounds that the reservoir is often inside assemblies and that a person who feels better on holiday and worse at home has already run the informative experiment.\n\nBinding is step two and here the claim is specific: that these low-molecular-weight toxins are recycled through bile, and that a bile-acid sequestrant in the gut interrupts the loop. Cholestyramine is the original agent; colesevelam is used when cholestyramine is intolerable, which it often is. High-dose EPA/DHA precedes it in the protocol, described as priming.\n\nThe supporting evidence is the 2001 estuary work: visual contrast sensitivity improved and symptoms abated over two weeks of cholestyramine, with control arms showing that repeat testing alone and cholestyramine in hyperlipidaemic patients did not produce the effect. That is a real result with real controls, in a small unblinded cohort, twenty-five years old, and never replicated in the water-damaged-building population it is now mainly used for.","angles":[["Verified removal versus perceived removal","Requiring a building measurement before declaring exposure ended makes the first treatment step checkable rather than self-reported, which matters more than the choice of binder."],["Repurposed drugs and inherited evidence","A drug validated for one exposure and one endpoint carries no automatic warrant in a different exposure, even when the proposed mechanism is the same."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":212.007,"short":"removal + binder"},{"id":"endgame","level":4,"parent":"treatment","tier":"town","ab":2,"label":"The late steps, and the problem of declaring recovery","view":"The far end of the protocol is where evidence thins fastest and where the framework makes its boldest claim: that a person can be returned not just to comfort but to normal environmental tolerance.\n\nThe sequence addresses, roughly in order, antigliadin antibodies, the nasal reservoir of multiply-antibiotic-resistant coagulase-negative staphylococci, androgen and ADH dysregulation, then the inflammatory markers one at a time — MMP-9 by diet and fish oil, VEGF, C4a, TGF-beta-1 by losartan, which is where the protocol's literature borrows heavily from cardiovascular trials of the drug. The final step is vasoactive intestinal polypeptide by nasal spray, presented as the move that restores regulation, with normalisation of resting pulmonary artery pressure on exercise offered as the objective endpoint.\n\nTwo things should be held together here. The endpoint choice is genuinely thoughtful: a pressure measurement on exertion is harder to fake and harder to attribute to expectation than a symptom score. And the evidence supporting these steps is mostly case series, single-arm reports and clinician experience, with the confounder that a patient reaching step eleven has by then been out of the building for a year or more.\n\n\"Done\" is the hardest word in this illness. A framework that promises full re-entry sets a bar that most patients in its own literature do not clear.","angles":[["Objective endpoints in expectation-sensitive illness","A physiological measurement taken under exertion is less influenced by a patient's expectations than a questionnaire, which makes it more useful for judging a treatment that patients want to work."],["Time as the untracked confounder in staged protocols","In a sequence taking a year or more, spontaneous improvement and continued avoidance accumulate alongside the interventions and cannot be separated without a control arm."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":253.62456,"short":"late steps"},{"id":"clusters","level":3,"parent":"casedef","tier":"town","ab":0,"label":"The thirteen symptom clusters and the eight-cluster threshold","view":"The scoring instrument is a roster of roughly thirty-seven symptoms sorted into thirteen clusters, with a threshold — commonly eight of thirteen clusters endorsed — used as the symptom criterion. Reading the clusters is instructive because they are chosen to be difficult to satisfy by ordinary malaise.\n\nCluster one is fatigue. Then weakness and aching and post-exertional worsening. Then headache, light sensitivity and memory difficulty. Then difficulty concentrating and word-finding. Then joint pain and morning stiffness. Then cramping and unusual sharp pains. Then shortness of breath and sinus congestion. Then cough and thirst and confusion. Then appetite swings, sweats, mood swings, ice-pick pains. Then abdominal pain, diarrhoea, numbness. Then tearing, metallic taste, disorientation. Then static shocks and vertigo. Then temperature regulation failure, excessive urination, and increased thirst.\n\nTwo features do real work. The threshold requires breadth across body systems, not severity — which is the point, because breadth is what distinguishes this presentation from depression or deconditioning. And several items are peculiar enough to be unlikely to be volunteered by suggestion: static shocks, metallic taste, ice-pick pains, temperature reversal.\n\nThe objection is that any patient who has already read about the illness knows the list, and that a roster with a count threshold is a screening instrument masquerading as a case criterion.","angles":[["Breadth versus severity as diagnostic signal","Requiring symptoms across many body systems rather than intense symptoms in one selects for systemic rather than organ-specific disease."],["Odd symptoms as discriminating items","Unusual complaints that patients rarely think to report unprompted carry more diagnostic information than common ones, a principle used in structured interviews across medicine."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":291.98724000000004,"short":"13 clusters"},{"id":"overlap","level":3,"parent":"casedef","tier":"town","ab":1,"label":"The overlap with ME/CFS, fibromyalgia and long COVID","view":"Set the case definitions side by side and the overlap is not partial, it is near-total. Fatigue, post-exertional worsening, cognitive impairment, unrefreshing sleep, orthostatic and thermoregulatory instability, pain, gut disturbance: this describes CIRS, ME/CFS, fibromyalgia and a large fraction of long COVID. The proposed biology overlaps too — immune dysregulation, mitochondrial and metabolic impairment, vascular and barrier dysfunction turn up in every one of these literatures.\n\nThree readings of that overlap are live, and they lead to different research programmes.\n\nThe framework's reading is that CIRS is the specific, exposure-identified, biomarker-positive subset, and that many patients labelled ME/CFS are unrecognised CIRS cases — the 2025 biomarker review makes exactly this argument. The mainstream reading is the inverse: that the overlap is evidence CIRS has not distinguished itself from an existing recognised condition, and that a new label without a distinguishing test is a relabelling. The third reading, gaining ground, is that these are all one final common pathway reached by different doors — viral, bacterial, environmental — in which case both prior positions are half-right and the argument over labels is a distraction.\n\nLong COVID has changed the temperature of this debate more than any study, because it made post-exposure multisystem illness undeniable at population scale.","angles":[["Long COVID as an argument-shifting natural experiment","A post-exposure multisystem illness affecting millions with an undisputed trigger made the general category harder to dismiss, which changed the reception of older contested syndromes."],["Splitting versus lumping in syndrome research","Whether to treat overlapping conditions as one entity or several determines which studies get funded, and the choice is usually made before the biology can settle it."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":317.7768732,"short":"ME/CFS overlap"},{"id":"vcsmech","level":3,"parent":"natural","tier":"town","ab":1,"label":"Visual contrast sensitivity: what the test measures, and what else lowers a score","view":"Visual contrast sensitivity is the framework's cheapest and most distinctive test. The subject views sinusoidal gratings at several spatial frequencies and reports the faintest they can resolve. It costs almost nothing, takes minutes, is repeatable, and has a long prior history in neurotoxicology — solvent, mercury and pesticide exposures all depress it.\n\nIts role here dates to the Pfiesteria work: estuary-exposed workers showed roughly a thirty per cent reduction in contrast sensitivity relative to matched offshore workers, with age, education, smoking, alcohol and total water time analysed and not accounting for the gap. Scores then improved with cholestyramine and did not improve with repeat testing alone. That is a coherent evidential package and it is why VCS entered the protocol as a monitoring instrument as well as a screen.\n\nThe problem is specificity, and it is not a small problem. Contrast sensitivity is depressed by uncorrected refractive error, cataract, dry eye, glaucoma, diabetic retinopathy, multiple sclerosis, migraine, poor sleep, several medications, and simply being tired. It has no clinical claim to identify a cause. Used as the framework uses it — as a cheap serial monitor within a patient whose optics are stable — it is defensible. Used as an entry criterion, it will pull in a great many people whose problem is ophthalmological.","angles":[["Serial testing within a person versus between people","A test too non-specific to identify disease across a population can still be informative when tracked over time in one individual whose other variables are held fixed."],["Borrowed instruments and inherited validity","A measure validated for solvent neurotoxicity carries no automatic validity for a different exposure, though its sensitivity to central visual processing is real either way."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":349.0536624,"short":"VCS test"},{"id":"nam","level":3,"parent":"bodies","tier":"town","ab":1,"label":"The mainstream consensus line: dampness yes, mycotoxicosis not established","view":"The consensus documents draw one line repeatedly, and it is worth stating precisely because both sides paraphrase it badly.\n\nWhat the documents affirm: dampness in buildings is common — WHO estimates it affects ten to fifty per cent of indoor environments across Europe, North America, Australia, India and Japan, and Lawrence Berkeley's US surveys put roughly half of American homes as showing evidence of dampness or mould. Occupants of damp buildings are at increased risk of respiratory symptoms, respiratory infection and asthma exacerbation, with meta-analytic odds ratios generally in the 1.3 to 1.8 range, meaning thirty to seventy per cent increases in prevalence. Remediation reduces those outcomes, in adult studies by roughly forty per cent. Dampness should be prevented and remediated as a matter of policy.\n\nWhat the documents decline to affirm: that inhaled mycotoxins in homes, schools or offices reach doses causing systemic toxicity; that mycotoxin antibody or urinary mycotoxin testing assesses exposure; that fungal IgG or IgE tells you anything about source or magnitude; and that dampness has been shown to cause sick building syndrome, multiple chemical sensitivity or chronic fatigue syndrome.\n\nNote what this line permits. It is entirely consistent with the consensus documents that a person is genuinely disabled by a damp building through an inflammatory mechanism nobody has characterised. The documents say the specific mycotoxin story is unproven, not that the patient is well.","angles":[["What 'insufficient evidence' means in a systematic review","The phrase reports the state of the literature rather than the state of the world, so a finding of insufficient evidence is compatible with the effect existing and being unstudied."],["Policy conclusions that outrun mechanistic ones","The same reviews that decline to endorse a mechanism recommend remediation anyway, showing that action thresholds and causal thresholds are set differently."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":19.548240000000007,"short":"consensus line"},{"id":"acoem","level":3,"parent":"bodies","tier":"point","ab":2,"label":"The ACOEM statement, the litigation context, and the conflict-of-interest critique","view":"One document does more work in this dispute than any other, and it is worth knowing its history because both sides invoke it.\n\nIn 2002 the American College of Occupational and Environmental Medicine published an evidence-based statement concluding that current scientific evidence did not support the proposition that human health had been adversely affected by inhaled mycotoxins in home, school or office environments. It was revised in 2011. For two decades it has been the sentence most often quoted by defence experts in mould litigation, and it is quoted on state health department pages to this day.\n\nIn 2008 a peer-reviewed critique argued that the statement's authorship, review and publication involved undisclosed conflicts of interest, that its lead authors had industry and litigation-defence ties, that internal peer reviewers' objections were not resolved, and that the document read as a defence report rather than a systematic review. The critique also attacked the dose-response modelling underlying the mycotoxin conclusion. Framework advocates additionally point out that later work on submicron fungal fragments — which are far more readily aerosolised than intact spores and carry toxins — undercuts the exposure assumptions the calculation rested on.\n\nNone of this establishes that CIRS is real. It does establish that the central mainstream citation in this area is contested on methodological and conflict grounds, and that a reader who treats it as a neutral settlement is not being careful.","angles":[["Position statements as artefacts with provenance","A society statement is written by identifiable people under identifiable pressures, so its authorship and review history are legitimate evidence about how much weight it should carry."],["Adversarial science in litigated exposures","When a scientific question determines liability, both plaintiff and defence fund research and expert opinion, which distorts the literature in both directions rather than one."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":45.337873200000004,"short":"ACOEM + courts"},{"id":"urine","level":3,"parent":"commerce","tier":"point","ab":2,"label":"Direct-to-consumer urine mycotoxin panels — the test almost everyone criticises","view":"This is the weakest-evidenced widely sold thing in the field, and it is usually a patient's first purchase. Being clear about it is a service.\n\nThe panels measure mycotoxins — ochratoxin A, aflatoxins, trichothecenes, gliotoxin, zearalenone, mycophenolic acid — in urine, and results are interpreted as evidence of body burden from a building. The problems are stacked. There is no FDA-cleared test. No reference ranges exist for healthy unexposed populations, so \"elevated\" has no denominator. Most mycotoxins have half-lives of hours to days and are not cumulative, so a urine level reflects roughly the last few days rather than years in a house. And the dominant real-world route of mycotoxin exposure is dietary — coffee, grains, dried fruit, cheese, nuts — which means a positive panel is more parsimoniously explained by breakfast than by drywall. CDC does not recommend biologic testing of people who live or work in water-damaged buildings, and ACMT specifically rules out mycotoxin antibody testing as an exposure assessment.\n\nTwo honest complications. Some patients do show detectable mycotoxins two years after leaving a building, with very slow apparent elimination, and that observation is published and unexplained. And this criticism does not transfer to the framework's blood panel, which measures host response at conventional labs — a distinction critics often skip and advocates often over-claim.","angles":[["Reference ranges as the precondition for a lab test","A measurement without a distribution in healthy people cannot support the word 'elevated', which is a logical rather than a technical limitation."],["Diet as the dominant confounder in mycotoxin biomonitoring","Because most human mycotoxin intake is dietary, any urinary finding must exclude food before it can implicate a building."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":76.6146624,"short":"urine panels"},{"id":"c4a","level":3,"parent":"markers","tier":"town","ab":1,"label":"Complement C4a: the framework's signature marker and its measurement problem","view":"C4a carries more argumentative weight than any other analyte here, and it is the one with the largest technical vulnerability. Both facts follow from the same chemistry.\n\nC4a is a split product released when C4 is cleaved during complement activation. Its attraction as a marker is that the cleavage is upstream and fast: it indexes the lectin and classical pathways rather than a downstream consequence, and it is proposed to rise within hours of re-exposure, which makes it the framework's candidate for an acute-exposure signal rather than a chronic state marker. The lectin pathway route runs through MASP2, and the framework's account has biotoxins activating it directly.\n\nThe vulnerability is that complement continues to activate in a drawn tube. C4a concentrations rise with time at temperature and with handling, which means a measured value is a joint function of the patient and the phlebotomy. This is why the framework's own physician guidance specifies collection conditions and names one reference laboratory as valid and another as not — a striking instruction that is simultaneously good preanalytic practice and a serious obstacle to independent verification.\n\nThe consequence is that C4a findings in this field are hard to adjudicate from outside. A skeptic can attribute elevations to handling; an advocate can attribute null results to the wrong laboratory; and neither has to concede.","angles":[["When a protocol names one valid laboratory","Specifying a single lab is defensible preanalytic control and simultaneously removes the independence that makes replication meaningful, and both readings are correct at once."],["Upstream versus downstream markers of activation","Measuring an early cleavage product rather than a late effector gives faster temporal resolution but demands far tighter sample handling."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":111.98724,"short":"C4a"},{"id":"tgf","level":3,"parent":"markers","tier":"town","ab":1,"label":"TGF-beta-1 and MMP-9: the chronic axis and the barrier axis","view":"If C4a is the framework's acute signal, these two are its chronic ones, and they are on firmer general ground because both are well-characterised in mainstream immunology.\n\nTransforming growth factor beta-1 is a master regulatory cytokine: it drives fibrosis, suppresses effector responses, and is required for the differentiation of both regulatory T cells and Th17 cells. Elevated TGF-beta-1 with concurrent regulatory T-cell dysfunction is a coherent picture — an immune system in a suppressive-and-inflammatory posture at once, which is exactly the profile that would explain chronicity rather than resolution. The framework assesses the T-cell side with the CD4+CD25++CD127lo phenotype.\n\nMatrix metalloproteinase-9 degrades basement membrane and tight-junction proteins. Its elevation is offered as the mechanism by which a peripheral inflammatory state reaches the brain and lung — increased permeability at the blood-brain and alveolar barriers — and it is the marker the protocol targets with diet and high-dose omega-3.\n\nBoth are plausible and both are non-specific. TGF-beta-1 is elevated in asthma, fibrotic lung disease, and many cancers; MMP-9 in almost any inflammatory or ischaemic condition. Their presence supports the claim that something inflammatory is happening. It does not support the claim that this particular something is a distinct disease.","angles":[["Non-specific markers can still carry information in combination","Individually unremarkable markers may form a pattern that is unusual, which is the statistical argument for panels over single tests."],["The Treg-Th17 axis as a chronicity mechanism","A cytokine that drives both suppressive and inflammatory T-cell lineages offers a route by which an immune response fails to resolve rather than escalating or ending."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":137.7768732,"short":"TGF-β1, MMP-9"},{"id":"ciguatera","level":3,"parent":"genie","tier":"town","ab":2,"label":"The ciguatera transcriptome — the strongest single dataset in the field","view":"In 2015 Ryan, Wu and Shoemaker published whole-blood transcriptional profiles from eleven patients with chronic illness following ciguatoxin exposure against eleven healthy controls, run in duplicate on whole-genome microarrays, with seven significant genes confirmed by PCR and a support-vector classifier separating the groups. The work came out of ProteoGenomics, NOAA's Hollings Marine Laboratory and the Pocomoke biotoxin centre — a collaboration worth noting, because it is the field's clearest institutional link to mainstream ocean-and-health science.\n\nWhy this dataset matters more than the water-damaged-building work: the exposure is unambiguous. Ciguatoxin is a known molecule with a known source organism, a known receptor — it activates voltage-gated sodium channels — and a known acute syndrome. Roughly five hundred thousand people a year experience acute ciguatera poisoning and a small percentage go on to a chronic multisystem illness lasting years. There is no dispute that this happens. So a transcriptomic signature in that population tests the framework's core hypothesis — that a defined biotoxin can leave a persistent, measurable inflammatory state — under conditions where the exposure itself cannot be denied.\n\nAnd it is eleven patients. Two things are true simultaneously: this is the best evidence the field has for its central claim, and it is a sample size at which a classifier's perfect performance tells you almost nothing about a new patient.","angles":[["Clean exposures as leverage in contested aetiology","Studying a population whose exposure nobody disputes isolates the question of whether persistent illness follows, separating it from the argument about whether exposure occurred."],["Ciguatoxin as the reference case for the whole framework","A biotoxin with a known source, structure and receptor provides the one instance where the biotoxin-illness model can be tested without arguing about the toxin's existence."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":169.0536624,"short":"ciguatera cohort"},{"id":"csm","level":3,"parent":"binders","tier":"town","ab":2,"label":"Cholestyramine: where the protocol's evidence is actually thickest","view":"Two papers from 2001 in Environmental Health Perspectives are load-bearing for the entire treatment framework, so they are worth reading rather than citing.\n\nThe first described five cases of possible estuary-associated syndrome in detail — cough, secretory diarrhoea, headache, fatigue, memory impairment, rash, concentration difficulty, light sensitivity, burning skin on water contact — and reported that visual contrast sensitivity was sharply reduced and recovered on cholestyramine alongside symptom abatement. The second was the stronger design: seventy-seven people with residential or recreational exposure to affected estuaries, against eighty-seven controls in two arms, one with no water exposure and one with marine water exposure. Age-adjusted contrast sensitivity was significantly lower in the estuary cohort; thirty-seven met the CDC case definition and had significantly lower scores than the non-cases. Symptoms abated and scores improved after two weeks of cholestyramine. Crucially, two control studies were run: repeat contrast testing alone did not improve scores, and cholestyramine in hyperlipidaemic patients did not change them.\n\nThose controls are the reason this result deserves respect. They address the two obvious alternative explanations.\n\nWhat it does not do: it is unblinded, it is twenty-five years old, its exposure was estuarine rather than a building, and the toxin it presumed has never been isolated. Every subsequent use of cholestyramine in water-damaged-building illness is an extrapolation from it.","angles":[["Well-chosen controls in a small unblinded study","Ruling out practice effects and drug effects in unexposed patients addresses the two leading alternative explanations, which raises a small study's value considerably."],["The distance between an estuary and a building","A treatment result obtained after waterborne exposure is applied here to indoor exposure, and the two differ in agent, route and dose in ways the original study cannot speak to."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":199.54824000000002,"short":"cholestyramine"},{"id":"ermi","level":3,"parent":"binders","tier":"town","ab":2,"label":"ERMI and HERTSMI-2: deciding when a building is safe to occupy","view":"The protocol's insistence on measured rather than perceived removal creates a technical requirement: a number that says a building is clear. The framework's answers are ERMI and its condensed successor.\n\nThe Environmental Relative Moldiness Index was developed at the US EPA. A settled-dust sample is analysed by mould-specific quantitative PCR for thirty-six species, split into a group associated with water damage and a group found in ordinary homes, and the log ratio is scaled against a national housing survey — so an ERMI score is a percentile position in the American housing stock rather than a health threshold. HERTSMI-2 reduces this to five organisms weighted for the framework's clinical purposes and is offered as a cheaper repeat screen for deciding whether to move back in.\n\nThe strengths are genuine. DNA-based counting detects fragments and dead spores that culture and air sampling miss, which matters because submicron fragments are far more readily aerosolised than intact spores. Settled dust integrates over time rather than sampling one afternoon's air.\n\nThe weaknesses are equally genuine. EPA developed ERMI as a research tool and has not endorsed clinical thresholds for it. Sampling variance across rooms, vacuum technique and dust age has never been properly bounded in the published literature. And a percentile in the housing stock is not a dose. A patient making a life-altering decision on an ERMI number is using a research instrument as a clinical one.","angles":[["Research instruments recruited into clinical decisions","A measure built to rank buildings for study purposes acquires action thresholds it was never calibrated for once patients start using it to decide where to live."],["DNA counts versus viable counts in exposure assessment","Measuring genetic material captures dead and fragmented material that culture-based sampling misses, which changes what an exposure estimate includes."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":225.3378732,"short":"ERMI"},{"id":"vipstep","level":3,"parent":"endgame","tier":"point","ab":2,"label":"VIP, MARCoNS and the problem of declaring recovery","view":"The last stretch of the protocol contains its most interesting testable claim and its most fragile one.\n\nVasoactive intestinal polypeptide is a real neuropeptide with real functions: circadian regulation in the suprachiasmatic nucleus, pulmonary vasodilation, immune modulation, gut motility. The framework holds that VIP is depressed in CIRS, that its loss explains the residual dysregulation surviving after inflammation is controlled, and that intranasal replacement restores it. The endpoint offered is not a symptom score but resting and exercise pulmonary artery pressure — a physiological measurement that is difficult to influence by expectation, which is a genuinely good choice of outcome for an illness where expectation is a live confounder.\n\nThe fragile claim sits beside it. MARCoNS — multiply-antibiotic-resistant coagulase-negative staphylococci in the deep nasal space — are proposed as a reservoir that maintains illness by cleaving MSH, and their eradication is a prerequisite step. The objection is that coagulase-negative staphylococci are ordinary nasal commensals in most people, that resistance genes among them are common, and that no controlled work establishes that their presence differs meaningfully between cases and controls or that clearing them changes outcomes.\n\n\"Recovery\" here means restored environmental tolerance, not merely comfort. That is a high bar honestly stated, and the field's own case series suggest most patients do not reach it.","angles":[["Commensals reclassified as pathogens","Naming an organism found in most healthy noses as a disease reservoir requires case-control data on prevalence, which is the specific evidence missing here."],["Choosing an outcome measure that resists expectation","Pulmonary artery pressure on exertion is hard for a hopeful patient to move voluntarily, making it a stronger endpoint than a questionnaire in a field where belief effects are contested."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":256.6146624,"short":"VIP + MARCoNS"},{"id":"roster","level":2,"parent":"clusters","tier":"point","ab":1,"label":"Why a symptom roster is not a case definition, and what would make it one","view":"The technical question underneath the thirteen clusters is one that psychometrics answered decades ago for other conditions and has never been asked properly here: does this instrument have measurement properties?\n\nA roster becomes a case definition when four things are established. Reliability: two clinicians scoring the same patient agree, and the same patient scored twice a week apart gets the same result. Structure: factor analysis confirms that the thirteen clusters are actually thirteen dimensions rather than one general distress factor wearing thirteen hats. Discriminant validity: the threshold separates this condition from the conditions it most resembles, which here means ME/CFS and major depression, not healthy controls. And operating characteristics: sensitivity, specificity, and predictive values at the chosen cut-point in a population with a realistic prevalence.\n\nNone of this has been published for the CIRS roster. That is a bigger gap than it sounds, because the eight-of-thirteen threshold is doing real work — it is what admits or excludes a patient — and a threshold without operating characteristics is a number somebody chose.\n\nThere is a further problem specific to this field. Patients typically arrive having read the roster. Endorsement rates in an informed population are not comparable to endorsement rates in a naive one, and no published study in this area has controlled for prior exposure to the instrument.","angles":[["Psychometric validation as the missing step","Establishing inter-rater reliability, factor structure and cut-point operating characteristics is routine for symptom instruments and has not been done for this one."],["Instrument contamination in informed patient populations","When patients read the diagnostic criteria before being assessed, symptom endorsement rates stop being independent of the instrument."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":294.797936256,"short":"roster ≠ definition"},{"id":"mecfs","level":2,"parent":"overlap","tier":"point","ab":2,"label":"The ME/CFS boundary: two labels, one patient, and an asymmetry worth noticing","view":"Put a CIRS patient and an ME/CFS patient in adjacent chairs and no examination distinguishes them. Both have post-exertional malaise, cognitive impairment, unrefreshing sleep, orthostatic intolerance and pain. Both have immune, metabolic and vascular abnormalities reported in their respective literatures. The difference is which door they came through and which clinician they found.\n\nThere is a real asymmetry in how the two are treated, and it cuts against the simple story that recognition follows evidence. ME/CFS is recognised by the CDC, has an ICD code, has NIH funding lines, and has no validated diagnostic biomarker and no treatment protocol that reverses the underlying condition. CIRS is unrecognised, has a proposed biomarker panel, a proposed mechanism, an identified exposure, and a treatment protocol with more published efficacy claims than ME/CFS has. The 2024 review that made this comparison is not wrong about the arithmetic.\n\nTwo counters are fair. First, ME/CFS was recognised through decades of patient advocacy and a formal Institute of Medicine review, not by clearing an evidentiary bar CIRS has also cleared — recognition processes are political. Second, CIRS's extra evidence is largely from within one clinical network, which is precisely the property that stops it counting for a skeptic.\n\nFor a patient, this asymmetry is not academic. The label determines disability paperwork, insurance coverage and whether a specialist takes the appointment.","angles":[["One patient, two doors, two administrative fates","Identical presentations receive different labels depending on which clinician is consulted first, and the label then determines access to care and benefits."],["Evidence generated inside a single clinical network","Findings produced predominantly by one group of collaborators are discounted regardless of quality, which is a structural obstacle no amount of additional work by that group can overcome."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":320.587569456,"short":"ME/CFS boundary"},{"id":"retina","level":2,"parent":"vcsmech","tier":"point","ab":2,"label":"The magnocellular hypothesis, and the specificity problem VCS cannot escape","view":"Why would a grating test detect systemic inflammation at all? The mechanistic proposal points at the magnocellular pathway: retinal ganglion cells and their central projections that carry low-spatial-frequency, high-temporal-frequency, low-contrast information. This pathway is metabolically demanding, is thinly myelinated in places, and is known to be selectively vulnerable in conditions affecting microvasculature and white matter. It is the pathway implicated in the contrast losses of multiple sclerosis, glaucoma, diabetes and several neurotoxic exposures.\n\nIf a peripheral inflammatory state raises capillary permeability and perturbs small-vessel perfusion, a magnocellular deficit is a reasonable thing to predict, and the pattern of loss across spatial frequencies should be characteristic rather than uniform. The Pfiesteria studies did report a frequency-specific pattern rather than a flat reduction, which is a stronger observation than a single number.\n\nBut the specificity problem is structural and cannot be engineered away. Every one of the conditions listed above produces magnocellular loss. A depressed contrast score licenses the inference that this pathway is affected. It licenses no inference whatever about why. Framework practice partly acknowledges this by using VCS longitudinally rather than diagnostically, and by requiring refraction be corrected first.\n\nThe honest summary: a real physiological measurement, a plausible mechanism, and zero causal specificity. Useful as a monitor, indefensible as a diagnosis.","angles":[["Pattern across frequencies versus a single threshold","A frequency-specific profile of contrast loss carries more information than one score, because different diseases affect different spatial frequency bands."],["Sensitive tests with no causal specificity","A measurement can reliably detect that a pathway is impaired while remaining silent about the cause, which limits it to monitoring rather than diagnosis."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":351.864358656,"short":"magnocellular"},{"id":"nam2004","level":2,"parent":"nam","tier":"point","ab":2,"label":"What 'sufficient evidence of association' actually licensed in 2004","view":"The 2004 National Academies report is quoted by both sides, usually without its own evidential vocabulary, which is where the argument goes wrong.\n\nThe report graded findings on a standard ladder: sufficient evidence of a causal relationship, sufficient evidence of an association, limited or suggestive evidence of an association, inadequate or insufficient evidence to determine whether an association exists, and limited evidence of no association. Dampness and mould reached sufficient evidence of an association for upper respiratory tract symptoms, cough, wheeze and asthma exacerbation in sensitised persons. Almost nothing reached the causal tier, and the multisystem and neurological outcomes landed in the inadequate-or-insufficient category.\n\nTwo misreadings follow, both common. Advocates read \"sufficient evidence of an association\" as causal endorsement, which the ladder specifically distinguishes. Critics read \"inadequate or insufficient evidence\" as evidence of absence, which the report explicitly defines as meaning studies are too few, too small or too methodologically limited to decide — a statement about the literature, not the world.\n\nThe report is now twenty-two years old. It predates the fragment literature, essentially all the innate-signalling work, the transcriptomic era, and long COVID. ACMT reaffirmed its position in 2025, which is a considered choice rather than an oversight, but reaffirmation is not the same as re-review of new evidence.","angles":[["Evidence ladders as the source of talking past each other","Formal grading categories are routinely collapsed into 'proven' or 'disproven' in citation, which manufactures disagreement that the original documents do not contain."],["Reaffirmation versus re-review","A society restating a prior position signals continued endorsement without necessarily having re-evaluated evidence published in the interim."]],"world":"cirs","upAlt":null,"edge":[],"fr":null,"lon":22.358936256000007,"short":"NAM 2004"},{"id":"dose","level":2,"parent":"acoem","tier":"point","ab":3,"label":"The inhaled-dose calculation, and the fragment findings that complicate it","view":"The mainstream argument against indoor mycotoxicosis is fundamentally arithmetic, and it is a good argument. Take the mycotoxin content of a spore, the concentration of spores achievable in indoor air, the respiratory minute volume of an adult, and a toxicological threshold from animal work, and the intake falls orders of magnitude short of a toxic dose. The Concentration of No Toxicologic Concern literature formalised exactly this. Ingestion of contaminated food, or occupational exposure in a grain silo or waste-processing plant, reaches doses that matter. A bedroom does not.\n\nThree findings complicate the calculation without o
