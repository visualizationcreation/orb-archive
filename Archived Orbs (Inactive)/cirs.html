ism, a diagnostic pathway and a treatment that no professional body disputes. None of them is CIRS.\n\nThe border runs along a specific line: established fungal disease is either invasive, IgE- or IgG-mediated, or ingestion-dose toxic. What is contested is a fourth category — chronic multisystem illness from inhaled mycotoxin doses in buildings, in a person with no invasive infection and no measured sensitisation.\n\nTwo practical consequences. A patient with these symptoms should have that established list excluded before anything else, because those diagnoses are treatable now. And the frequent argument that \"mycotoxins are known to harm people\" is true of the ingestion literature and does not transfer across the border without doing the dose work.","angles":[["The uncontested core inside a contested subject","Most disputed illnesses sit adjacent to a set of established diagnoses that share their organ system, and locating that border prevents an argument about the periphery from consuming the centre."],["Route of exposure as the hinge of a toxicological claim","A compound's documented harm by ingestion does not license claims about inhalation without an independent dose calculation, and the substitution is the single most common error in this field."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":332.4882432,"short":"real fungal disease"},{"id":"csmevidence","level":2,"parent":"binders2","tier":"point","ab":2,"label":"What the cholestyramine studies show, and what they cannot","view":"The binder step rests on two papers published in 2001 and 2003 from a single group, and they are better than their reputation among critics and weaker than their reputation among advocates.\n\nThe design was unusual for this field and to its credit. Patients with an estuary-associated illness were treated with cholestyramine, with visual contrast sensitivity and symptom scores as endpoints, and the reports include comparison arms rather than a single-arm before-and-after. Improvement in contrast sensitivity and symptoms was reported, and re-exposure produced deterioration described as faster than the original episode.\n\nThe limits are structural rather than a matter of quality. The exposure being treated was Pfiesteria-associated illness, and that attribution subsequently collapsed — the toxin was never isolated and the organism was later found not to produce ichthyotoxins — so the studies demonstrate a response to a treatment in an illness whose cause is now unknown. The primary endpoint, contrast sensitivity, detects a change without attributing it. Sample sizes were small, the group was single, and no independent replication has followed in more than twenty years.\n\nThe honest summary is narrow and worth holding precisely: something improved on this treatment in that cohort, measurably, against a comparison. What improved, in whom, and because of what, are all open.","angles":[["Replication as the load-bearing step nobody funded","A finding from one group with no independent repetition after two decades occupies a specific epistemic position, neither refuted nor established, and the field's structure explains the gap better than the finding's quality does."],["A treatment outliving its indication","When the exposure a therapy was validated against is later disputed, the therapy's evidence does not disappear but changes meaning, and it needs revalidating against whatever the illness turns out to be."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":355.74432,"short":"the CSM studies"},{"id":"binderharm","level":2,"parent":"binders2","tier":"point","ab":2,"label":"The harms side of a cheap old drug","view":"Cholestyramine's safety record is often summarised as reassuring because the drug is old, non-absorbed and off-patent. Each of those is true and none of them means harmless, and the harms ledger is the part of the protocol discussion that goes thinnest.\n\nThe mechanism that makes it useful makes it indiscriminate. A resin binding bile acids in the gut lumen also binds fat-soluble vitamins A, D, E and K, folate, and a long list of drugs — thyroid hormone, warfarin, digoxin, thiazides, some antibiotics — which is why its labelling carries timing separations from other medication. Taken for months, the vitamin and mineral consequences are real and monitorable. In a patient already on other treatment, the interaction list is the more immediate issue.\n\nThe tolerability problems are ordinary and common: constipation, bloating, reflux, and an unpalatable formulation that drives discontinuation. In a population with existing gut symptoms, that matters more than it would elsewhere.\n\nNone of this is an argument against the step. It is an argument that the step is a medical decision with monitoring requirements, taken with a prescriber who knows the person's other medications — not a supplement-shelf choice. The framework's own literature treats it that way; the surrounding online discussion often does not.","angles":[["Non-absorbed does not mean without systemic effect","A drug acting entirely in the gut lumen alters what is absorbed there, so its systemic consequences arrive through what it prevents rather than through what it delivers."],["Long-duration use of a drug studied short-term","Safety data gathered over weeks are routinely extended to courses lasting months or years, and the extrapolation is rarely stated as one."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":11.839977599999996,"short":"binder harms"},{"id":"panelsteps","level":2,"parent":"sequence","tier":"point","ab":2,"label":"The marker-correction steps, and what each would need to prove itself","view":"The middle of the protocol is a series of interventions each aimed at a laboratory value. Taking them as a group rather than individually is the only way to see what is common to them.\n\nThe pattern repeats: a marker is described as out of range in the illness; a symptom set is attributed to that marker; an intervention with an established effect on that marker in some other condition is deployed; and the endpoint is the marker returning to range. The interventions themselves are mostly not exotic — dietary change, a fish-oil intervention, an antiresorptive, an angiotensin-receptor blocker, hormone correction, an antibiotic regimen for the nasal biofilm.\n\nWhat each step would need in order to stand up is the same in every case and absent in every case: a demonstration that correcting the marker changes how the person functions, tested against a group in whom the marker was left alone. Marker movement alone is not sufficient, because the marker's role in the illness is precisely what is in dispute. Correcting a value that turns out to be a bystander produces a chart that improves and a person who does not.\n\nThe steps are also individually unremarkable in ordinary medicine, which cuts both ways: the safety profiles are known, and none of them is doing anything novel enough to explain a novel illness on its own.","angles":[["Treating the number versus treating the person","Interventions selected for their effect on a measurement can succeed on that measurement and fail on function, and distinguishing the two requires an outcome the measurement does not supply."],["Familiar drugs in an unfamiliar indication","Deploying well-characterised agents in a new syndrome imports their safety data and none of their efficacy data, which makes the resulting protocol look better evidenced than it is."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":29.9904,"short":"marker steps"},{"id":"vipevidence","level":2,"parent":"sequence","tier":"point","ab":2,"label":"The VIP endgame: twenty patients, no control arm, eighteen months","view":"The final step of the protocol is replacement of vasoactive intestinal polypeptide, a regulatory neuropeptide with genuine immunomodulatory credentials, and it is the step where the gap between rationale and evidence is widest.\n\nThe background biology is not fringe. VIP suppresses proinflammatory cytokine release, promotes regulatory T cells, and has been investigated in COPD, arthritis models and critical COVID-19 with results interesting enough to sustain a research programme. The rationale for using it here — that these patients are deficient in regulatory neuropeptides and that restoring one closes the loop — follows from the framework's own pathophysiology.\n\nThe evidence in this indication is one open-label trial of twenty patients who had completed the preceding steps and remained symptomatic, treated for at least eighteen months. Reported outcomes include a large fall in mean symptom score and changes across several hundred genes on transcriptomic testing.\n\nThe design cannot support the claim being made of it. Twenty patients, no control arm, no blinding, no randomisation, and a population selected for having already completed eleven steps — which means the only patients studied are those who stayed, could afford to, and believed in the framework enough to reach step twelve. Under those conditions a seventy per cent symptom reduction is what an open-label study of a hopeful patient group looks like whether or not the drug works.","angles":[["Attrition-selected populations in late-protocol studies","Studying only those who completed a long sequence samples the responders and the persistent, so the study population differs systematically from the one the treatment is offered to."],["A plausible molecule in an implausible study","The quality of a compound's underlying biology and the quality of the trial testing it are independent, and confidence in one is routinely transferred to the other."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":46.086057600000004,"short":"VIP: 20 patients"},{"id":"pem","level":2,"parent":"pacing","tier":"point","ab":2,"label":"Post-exertional malaise: recognising it, and the two-day test","view":"Pacing depends on identifying post-exertional malaise correctly, and the identification is where it usually goes wrong, because PEM is delayed and therefore does not feel connected to what caused it.\n\nThe features that distinguish it from ordinary fatigue: onset hours to days after the exertion rather than during it; multi-system worsening rather than tiredness alone, including cognitive, immune-type and autonomic symptoms; disproportion to the trigger, so that a shower or a phone conversation counts as exertion; and a recovery measured in days to weeks rather than in a night's sleep. Cognitive, emotional and orthostatic exertion trigger it as readily as physical, which patients discover before clinicians do.\n\nClinical history is the primary diagnostic route. Where objective confirmation is wanted, the two-day cardiopulmonary exercise test — a maximal test repeated twenty-four hours later — shows a reduction in workload at the ventilatory threshold on day two that healthy controls and most other fatiguing conditions do not show. It is the most specific objective finding available in this symptom cluster and it is also, by design, a procedure that can cause a prolonged crash in the person taking it.\n\nThat tension is the honest state of the tool: the most informative test here is one whose administration is itself a risk, and there is no cheap substitute.","angles":[["Delayed onset defeats intuitive causal learning","When a consequence arrives two days after its cause, ordinary trial-and-error learning fails, so patients and clinicians both attribute crashes to the wrong triggers for years."],["A diagnostic test that costs the patient a relapse","Where confirmation requires provoking the illness, the value of certainty has to be weighed against a known harm, which is an unusual position for a diagnostic decision."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":78.7781632,"short":"PEM + 2-day CPET"},{"id":"oi","level":2,"parent":"autonomic","tier":"point","ab":2,"label":"Orthostatic intolerance: the ten-minute test almost nobody runs","view":"Of everything in this world, this is the item with the best ratio of benefit to cost, and its neglect is the clearest evidence that these patients are being assessed inattentively.\n\nOrthostatic intolerance is highly prevalent in ME/CFS and long COVID and, by symptom overlap, in this population. It reduces cerebral blood flow, which directly produces the cognitive symptoms patients describe as brain fog, and it worsens post-exertional malaise by adding an unrecognised exertion to every hour spent upright.\n\nThe ten-minute passive stand test — the NASA lean test — detects it with a blood-pressure cuff, a wall and a timer. Heart rate and blood pressure are recorded each minute while the person stands leaning against the wall. A sustained heart-rate rise of thirty beats per minute or more within ten minutes with stable blood pressure identifies postural orthostatic tachycardia syndrome; a blood-pressure fall identifies orthostatic hypotension; and blood pooling is often visible before either threshold is met.\n\nManagement is correspondingly cheap: increased fluid and salt where not contraindicated, compression garments, positional strategies, and avoidance of prolonged standing. Several drug options exist for cases that do not respond, prescribed on ordinary cardiological grounds.\n\nNone of this requires anyone to have an opinion about CIRS, which is exactly why it is the first thing to ask a sceptical physician for.","angles":[["Cheap diagnostics displaced by expensive ones","Where a costly panel is available and culturally salient, a free bedside test with better yield is passed over, and the pattern is a property of clinical attention rather than of the tests."],["Cerebral hypoperfusion as a mechanical account of cognitive symptoms","A measurable reduction in blood delivered to the brain while upright supplies an explanation for cognitive complaints that requires no immune hypothesis at all."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":95.9012032,"short":"the lean test"},{"id":"durable","level":2,"parent":"relapse","tier":"point","ab":2,"label":"Durable remission: what would have to be documented, and by whom","view":"Both sides of this dispute quote recovery rates, and neither set of numbers is comparable to the other, because there is no agreed definition of what is being counted.\n\nInside the framework, recovery is generally marker-defined: completion of the sequence with the panel returned to range and symptom scores below a threshold. Outside it, the mainstream literature on damp-building health effects reports respiratory outcome improvement after remediation and does not track a multisystem endpoint at all. A patient asking \"how many people get better\" is therefore asking a question that has two answers measuring two different things.\n\nWhat a defensible remission definition would need is unremarkable and absent: a pre-specified symptom and function threshold, a minimum duration — twelve months is the usual convention in fatiguing illness — assessment by someone blind to the treatment received, and follow-up long enough to catch relapse.\n\nThe reason nobody has one is structural rather than negligent. The framework's clinicians are practising, not running cohorts; academic groups that could run cohorts do not accept the case definition that would let them enrol; and no funder has an interest in an outcome study for a diagnosis that is not in the ICD. That is a fundable problem, and it is what sits directly below this position.","angles":[["Incommensurable outcome measures across a dispute","When two communities count different endpoints, their statistics cannot be compared even when both are honestly gathered, and the appearance of disagreement outruns the actual one."],["Cohort follow-up as the cheapest unrun study","Longitudinal observation requires no intervention, no randomisation and no ethical complexity, and its absence in a contested illness reflects funding structure rather than difficulty."]],"world":"recovery","upAlt":null,"edge":[],"fr":null,"lon":284.6514432,"short":"durable remission"},{"id":"f_remedstd","level":1,"parent":"remedevidence","tier":"point","ab":2,"label":"FRONTIER — What counts as successfully remediated, and who gets to say","view":"The map stops here on the most practical question any household in this situation asks, and the reason it stops is administrative rather than scientific.\n\nThere is no health-based clearance standard for a remediated building. No number, no agency, no threshold. The EPA guidance describes practice and explicitly declines to set numerical limits. The New York City guidelines, long the de facto reference, are guidance from a municipal health department, not a standard. ERMI was developed by the EPA as a research tool and its own developers have said it was not designed for individual building assessment, which has not stopped an industry using it that way. So a contractor, an occupant and an assessor can all inspect the same finished job and reach different verdicts, each defensibly.\n\nThe consequence is that the single strongest intervention in this illness — get out of the exposure — is delivered without any way to confirm it was delivered. Remediation trials pool successes and failures because they cannot tell them apart. Households believe they are clear when they are not. And the frontier below every question about whether treatment works runs through this one, because you cannot evaluate step two while step one's completion is unverifiable.\n\nBelow this there is no established terrain, only the standard nobody has written.","angles":[["Clearance criteria as the precondition for outcome research","An intervention whose completion cannot be verified generates outcome data that mixes delivered and undelivered treatment, which biases every estimate toward null."],["Research tools escaping into commercial practice","An index built to compare populations gets sold as an individual verdict, and the developers' objections carry less weight than the market's demand for a number."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"authority","blocker2":"information","condition":"A national body — a health agency, a standards organisation, or a professional society with reach — would have to accept ownership of a numerical or procedural clearance criterion and publish it, accepting the liability that comes with a threshold.","experiment":"Cheapest first move is not a standard but a comparison: take fifty remediated homes, assess each by every existing method in parallel — visual and moisture inspection, spore trap, ERMI, HERTSMI-2, and occupant symptom report — and publish how often the methods disagree. Disagreement rates are the argument for a standard, and nobody has measured them.","matters":"Every downstream claim about treatment efficacy assumes exposure removal happened. If that assumption fails silently in a third of cases, the entire treatment literature is contaminated at step one and no later result can be trusted.","rivals":["A standard is impossible because acceptable exposure varies by individual susceptibility, so any number harms someone.","A standard exists in practice as professional judgement, and formalising it would reduce quality rather than raise it.","The absence is deliberate: a threshold creates liability for landlords, insurers and school districts, and the parties who would have to set it are the parties it would bind."],"unlocks":"A verifiable step one. With it, remediation trials can separate delivered from undelivered treatment, households can know where they stand, and the binder and sequence questions become answerable because their baseline is finally fixed."},"lon":298.626513408,"short":"▸ what counts as clean"},{"id":"f_partialdose","level":1,"parent":"partial","tier":"point","ab":3,"label":"FRONTIER — Whether reducing exposure part-way helps part-way","view":"This is the question most households actually face and the literature is silent on it, which is a strange gap given how common the situation is.\n\nFull removal is not available to most people. Renters cannot rebuild an envelope. Owners often cannot afford it. Many end up living with a partly remediated building, or spending less time in it, or sealing one room. Whether that produces a proportionate share of the benefit, no benefit at all, or a worsening, is unknown.\n\nThree shapes are possible and they have very different implications. If the response is linear, partial measures are worth doing and worth funding. If there is a threshold below which nothing helps, then partial remediation wastes money and time that relocation would have used better. And if the reactivity account is right, partial exposure may sustain a sensitised state that full removal would let settle — in which case half a job really is worse than none.\n\nNothing distinguishes these. The remediation trials studied completed interventions. The observational data records dampness as present or absent, which erases the middle. And the exposure metrics available cannot express a fifty per cent reduction in any case.\n\nThe map stops here, and the household is left making an expensive decision with no dose-response curve to consult.","angles":[["Dose-response shape as a policy variable","Whether a harm falls proportionately with exposure or only past a threshold decides whether incremental spending is worthwhile, and the two shapes recommend opposite strategies."],["Binary exposure coding erasing the situation most people are in","Recording an exposure as present or absent discards the intermediate states that describe the majority of affected households, so the data cannot answer their question."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"information","blocker2":null,"condition":"A graded exposure measure would have to exist and be affordable — something that can express partial reduction rather than presence and absence. That depends on the measurement frontier elsewhere in this orb, which is why this blocker is downstream of one already declared.","experiment":"A stepped-wedge study in social housing with staged remediation: measure occupant respiratory outcomes at each stage of a multi-phase repair programme that is happening anyway for other reasons. The intervention is already funded; only the measurement is added.","matters":"The advice given to a family that cannot afford full remediation currently rests on nothing. If the response is threshold-shaped, current advice to do what you can afford is actively wasting their money.","rivals":["Response is roughly linear, so any reduction helps proportionately and partial measures are worthwhile.","A threshold governs, so only complete source elimination changes outcomes and partial work is spending without benefit.","Partial reduction sustains reactivity that complete removal would allow to settle, making half-measures worse than either extreme."],"unlocks":"Honest advice for the majority of affected households, and a rational basis for allocating limited remediation funding across many buildings rather than fully fixing a few."},"lon":314.722171008,"short":"▸ does half help?"},{"id":"f_spectrum","level":1,"parent":"abpa","tier":"point","ab":3,"label":"FRONTIER — Where established fungal disease ends and the disputed illness begins","view":"The border between uncontested fungal disease and contested biotoxin illness is drawn by exclusion rather than by measurement, and that is the frontier.\n\nOn the established side, every diagnosis is defined by something detectable: invasion visible on imaging or culture, specific IgE, specific IgG, a defined antigen exposure with a matching lung picture, or an ingested dose. On the disputed side, the patient has none of those, which is precisely why the diagnosis is disputed.\n\nNobody has asked the obvious question: are these populations continuous or separate? If patients who meet CIRS criteria were tested systematically for fungal sensitisation, hypersensitivity pneumonitis and the rest, three outcomes are possible. A substantial fraction might turn out to have an established diagnosis that was never looked for, which would resolve part of the dispute by absorbing it. They might cluster at subclinical levels of the established markers, suggesting a spectrum. Or they might be genuinely distinct, which would strengthen the case that something else is happening.\n\nNo study has done this. It is unglamorous, requires no new technology, and would tell both sides something they claim to want to know. Its absence is one of the clearest illustrations in this orb that the two communities are not actually running each other's experiments.","angles":[["Diagnosis by exclusion as an unstable boundary","A category defined by the absence of other findings shifts whenever the excluded tests improve, so its membership changes without anything about the patients changing."],["Adjacent populations that have never been compared","Two clinical groups seen by different specialties with overlapping symptoms often go decades without a study measuring both, because no single specialty owns the comparison."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":null,"condition":"Someone with access to both populations would have to run the same panel across both. That requires a clinician or centre trusted by the CIRS patient community and credible to academic pulmonology and allergy, and very few people occupy both positions.","experiment":"A cross-sectional study: consecutive patients meeting CIRS criteria receive the standard fungal disease workup — specific IgE and IgG panels, imaging, spirometry, and hypersensitivity pneumonitis assessment — and the yield is reported. No new assay, no new technology, no control group strictly required for the first pass.","matters":"If even fifteen per cent of this population has an established, treatable, missed diagnosis, that is a large clinical harm happening now and it is fixable now, independently of who wins the larger argument.","rivals":["The populations are largely continuous, and the disputed group sits at subclinical levels of established markers.","They are distinct, and the absence of established findings is the substantive fact rather than an artefact of not looking.","The disputed group is heterogeneous and contains a missed-diagnosis subgroup alongside a genuinely unexplained one."],"unlocks":"An immediate clinical yield for a subset of patients, a sharper case definition for whoever remains, and the first dataset in which both communities are measuring the same thing."},"lon":334.242436608,"short":"▸ where the border runs"},{"id":"f_binderrct","level":1,"parent":"csmevidence","tier":"point","ab":3,"label":"FRONTIER — The placebo-controlled binder trial, and why twenty years produced none","view":"This is the single study most often demanded and least often attempted, and its absence has an explanation that is not scientific.\n\nThe design is not hard. Adults meeting a stated case definition, all removed from exposure, randomised to a bile-acid sequestrant or an identical-looking placebo, with a pre-specified functional endpoint rather than a marker, followed for enough months to see whether any separation holds. Cholestyramine is off-patent, cheap and long-licensed. A tolerable placebo is achievable because the formulation is already unpalatable. This is an ordinary trial.\n\nWhy it has not happened is a chain of structural facts. There is no commercial sponsor, because the drug earns nobody anything. Public funders route through study sections that do not accept the case definition, so the application fails at the enrolment criteria before the design is read. The clinicians who use the treatment are in private practice and are not trial infrastructure. And the patient community's understandable distrust of academic medicine makes recruitment through academic centres harder than the numbers suggest.\n\nEvery one of those is fixable with money and a broker. None is a scientific obstacle. The map stops here for want of an institution, not for want of an idea.","angles":[["Off-patent drugs and the trials nobody sponsors","The economics that make a treatment affordable also remove any party with an incentive to test it, so cheapness and evidence-poverty travel together across many indications."],["Enrolment criteria as the gate a contested diagnosis cannot pass","A funding review that will not accept a case definition rejects the study before evaluating its design, which makes the definitional dispute self-perpetuating."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"capability","blocker2":"authority","condition":"A funder would have to accept an operational enrolment definition without endorsing the underlying framework — enrolling on symptoms and documented exposure rather than on the disputed markers. That separation is available and has not been used.","experiment":"A pragmatic randomised trial in a single well-characterised cohort, powered for a functional endpoint, with enrolment on symptom criteria and exposure history alone. Estimated cost is in the low millions — trivial against the amount currently spent by patients on this treatment out of pocket each year.","matters":"Step two is where the framework's evidence is thickest and still thin. Settling it either promotes the protocol's foundation to established or removes it, and either result reshapes everything above.","rivals":["The binder works and the trial would show it, and its absence is the field's fault rather than the treatment's.","Improvement attributed to binding is improvement from exposure removal, which every patient receives first and which is never separately controlled.","The effect exists but is small and slow, so a trial of realistic size and duration returns an ambiguous result that neither side accepts."],"unlocks":"The first genuinely arbitrable fact in the treatment argument. Almost every other dispute in this world is downstream of not knowing whether step two does anything."},"lon":357.498513408,"short":"▸ the binder trial"},{"id":"f_harms","level":1,"parent":"binderharm","tier":"point","ab":3,"label":"FRONTIER — The harms ledger nobody keeps","view":"Efficacy is argued about constantly in this field. Harm is not, and the asymmetry is the frontier.\n\nThere is no adverse-event register for CIRS treatment. Nobody counts the nutrient deficiencies from prolonged sequestrant use, the drug interactions that went unmanaged, the antibiotic courses for nasal biofilm and their microbiome consequences, the fungal-sensitisation patients who were not treated for their asthma while pursuing a marker panel, or the households financially destroyed by remediation and relocation decisions taken on contested evidence.\n\nNor is the null case counted: the harms of doing nothing. Patients who were told their symptoms were psychological, went untreated for years, lost work and relationships and were never assessed for orthostatic intolerance or sleep apnoea. That is also a harm ledger and it is also unkept.\n\nThe absence is not neutral between the two sides. Each faction's argument would be strengthened or weakened by data neither has gathered, and both have gone on arguing without it for two decades. A field that has not counted its own harms is not in a position to say that the other side's approach is dangerous, which is an argument both sides make routinely.\n\nBelow this there is nothing to descend into, because nobody has written the numbers down.","angles":[["Adverse-event registers as the marker of a field's maturity","Systematic harm collection appears when a treatment community becomes accountable to an external body, and its absence indicates a governance gap rather than a safety record."],["The harms of non-treatment as an uncounted comparator","Untreated illness produces losses that no registry captures, so any harm comparison between action and inaction is made against a blank."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"information","blocker2":null,"condition":"Somebody with standing in the treating community would have to build a voluntary registry and persuade practising clinicians to enter cases including the bad ones, in a field where reporting harm is read as disloyalty by patients and as ammunition by critics.","experiment":"A retrospective chart review across three or four cooperating practices, extracting nutrient panels, interaction events, discontinuations and financial outcomes. No new data collection, no consent complexity beyond ordinary review, and it would produce the first harm denominator this field has ever had.","matters":"Both sides make safety arguments they cannot support. Patients making expensive, irreversible decisions have no risk figure on either side of the choice, which means the most consequential decisions in this illness are made blind.","rivals":["Harms are minimal, which is why nobody has bothered to count them.","Harms are substantial and their absence from the record is selection rather than rarity.","The dominant harm is neither treatment nor its absence but the years spent deciding, and no registry design currently captures that."],"unlocks":"A risk figure to set against the efficacy argument, and the first thing a regulator or professional body could actually act on."},"lon":13.594171007999995,"short":"▸ the harms ledger"},{"id":"f_sequence","level":1,"parent":"panelsteps","tier":"point","ab":3,"label":"FRONTIER — Whether the order matters, or whether only step one does","view":"The protocol's central structural claim is that the steps must be taken in order, and it has never been tested. This is the frontier with the largest gap between how confidently a thing is asserted and how much evidence stands behind it.\n\nThe claim does real work. It explains why patients who try later steps first fail. It justifies a treatment course lasting years. It accounts for non-response as incomplete sequencing rather than as the treatment not working. And it makes the protocol unfalsifiable in ordinary use, because any failure can be attributed to a step done wrong or out of turn.\n\nThe competing account is stark and equally untested: only step one matters. Remove the exposure, wait long enough, and improvement follows on its own timescale, with the subsequent eleven steps supplying structure, attention, hope and a schedule — none of which are nothing, but none of which are what they claim to be.\n\nA dismantling design would separate these cheaply. Take patients through step one and then randomise to continue the sequence or to structured follow-up alone. If the sequence adds nothing beyond step one, that is the most important negative result available in this field. If it adds something, that is the strongest positive result the framework has ever had.\n\nNobody has run it, and the map stops here.","angles":[["Dismantling designs as the test of multi-component treatments","Removing components one at a time is the standard method for finding which part of a package does the work, and it is routine in psychotherapy research and absent here."],["Unfalsifiability arriving through the failure explanation","A protocol that attributes every non-response to incorrect execution cannot be disconfirmed by any outcome, which protects it from criticism and from evidence equally."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"untested assumption","blocker2":null,"condition":"The treating community would have to accept a design in which some enrolled patients do not receive the full sequence, which conflicts with a sincerely held belief that the sequence is what helps them. That is an ethical and cultural obstacle before it is a scientific one.","experiment":"A dismantling trial: all participants receive documented exposure removal, then randomise to full protocol versus structured clinical follow-up with equal contact time. Equal contact controls for attention, which is the confound doing the most unacknowledged work.","matters":"This single result would reallocate years of patient time and tens of thousands of dollars per household, in one direction or the other. No other unrun study in this orb has a larger practical consequence per dollar spent.","rivals":["The sequence is doing the work, and step one alone plateaus at partial recovery.","Step one is doing nearly all the work, and the rest supplies structure, attention and time.","A subgroup needs the full sequence and the rest do not, so the average effect is small while the individual effect for some is large."],"unlocks":"A protocol reduced to the steps that earn their place, or a protocol vindicated. Either outcome ends the current arrangement in which the whole package is defended or attacked as a single object."},"lon":31.744593408,"short":"▸ does order matter?"},{"id":"f_vip","level":1,"parent":"vipevidence","tier":"point","ab":3,"label":"FRONTIER — The controlled VIP trial, and the compounding problem","view":"The last step of the protocol is also the one with the clearest path to a real trial and the most specific obstacle standing in front of it.\n\nThe scientific case is unusually good for this field. VIP has a defined receptor biology, documented immunomodulatory effects, and has been through controlled studies in other indications including COPD and critical COVID-19. A nasal peptide is straightforwardly placebo-controllable — an identical vehicle spray is easy. The endpoint problem is soluble: function and symptom scores rather than the transcriptomic readout the open-label study leaned on.\n\nWhat blocks it is regulatory and pharmaceutical rather than scientific. VIP for this use is compounded, not a licensed product. Compounded peptides face a shifting regulatory position, supply is inconsistent, and formulation varies between compounding pharmacies, so a multi-site trial cannot guarantee that participants are receiving the same thing. No manufacturer holds a product to develop, so nobody has a commercial reason to standardise it.\n\nThe result is that the most biologically plausible step in the entire protocol is stuck behind a supply-chain problem. That is a genuine hard limit for now, and it is a different kind of blocker from the ones sitting under most of the other frontier positions in this orb.","angles":[["Compounded products and the trials they cannot support","Batch-to-batch variability that is tolerable in individual prescribing is disqualifying in a multi-site trial, which excludes an entire class of treatments from evidence generation."],["Plausible biology stranded by a supply chain","A compound's route to market determines whether it can be studied at all, so pharmaceutical structure filters which hypotheses get tested independently of their merit."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"hard limit","blocker2":null,"condition":"A standardised, characterised, consistently supplied preparation would have to exist — which in practice means a sponsor developing VIP as a product for some indication, at which point this one becomes testable as a secondary use.","experiment":"A single-site randomised placebo-controlled trial using one compounding source with batch characterisation, in patients who have completed exposure removal. Small, one site, one supplier: it sidesteps the variability problem rather than solving it, and would be the first controlled data in this indication.","matters":"This is the framework's endgame step, the one carrying its recovery claims. It is also the step patients spend the most on, over the longest period, on the weakest study design in the whole sequence.","rivals":["VIP replacement works and the open-label result is real, understated by an uncontrolled design rather than created by it.","The result is what an open-label study of a hopeful, selected, long-persisting cohort produces regardless of the compound.","The effect is real but not specific to VIP — a general anti-inflammatory or neuroendocrine effect any comparable agent would produce."],"unlocks":"A controlled result on the protocol's final step, and — if positive — a licensing pathway that would pull the entire framework into mainstream pharmacology through the one door it has left open."},"lon":47.840251008,"short":"▸ the VIP trial"},{"id":"f_pacing","level":1,"parent":"pem","tier":"point","ab":3,"label":"FRONTIER — Pacing's own missing trial, and why it cannot be blinded","view":"The management strategy this orb recommends most warmly is also the one with the weakest trial evidence, and saying so is the price of being consistent.\n\nPacing is recommended by NICE, the CDC and the WHO, and the recommendation rests on observational association, physiological rationale, patient-reported outcomes, and the documented harm of the alternative. What it does not rest on is a randomised trial showing that pacing outperforms usual care, because that trial has not been run and is unusually hard to run.\n\nThe obstacle is structural. Pacing cannot be blinded — the participant necessarily knows they are being asked to restrict activity. There is no credible sham. The comparator is ethically constrained, since the obvious contrast, graded exercise, is now contraindicated in this population and cannot be randomised to. And the outcome that matters, avoiding crashes over months, requires long follow-up in a population for whom study participation is itself an exertion.\n\nThe PACE trial's history hangs over this. A large randomised trial reported graded exercise and CBT as superior, was heavily criticised on outcome-switching and analysis grounds, and its recommendations were subsequently withdrawn. That episode makes both the patient community and the guideline bodies wary of the next trial, which is a rational response and also a barrier.\n\nThe map stops here, at a recommendation that is probably right and is not proven.","angles":[["Recommendations resting on harm avoidance rather than benefit","Where one option is documented to cause harm, its alternative can be recommended without positive evidence of its own, and the recommendation's basis is often misread as stronger than it is."],["A contested trial poisoning the well for its successors","A high-profile study whose analysis was disputed makes subsequent research in the same area harder to fund and to recruit for, regardless of the new design's quality."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"hard limit","blocker2":null,"condition":"A design would have to exist that produces interpretable results without blinding and without an unethical comparator — most plausibly a comparison of two active management approaches of differing intensity rather than pacing against nothing.","experiment":"A randomised comparison of structured pacing support against unstructured self-management, both with equal clinician contact, with crash frequency over twelve months as the primary endpoint. It cannot be blinded; equal contact time controls the main alternative explanation.","matters":"The strongest practical advice available to these patients currently rests on inference. If pacing were shown to work, it would be commissioned and funded rather than left to patients to discover; if it were shown not to, something else would have to be found.","rivals":["Pacing works and the evidence gap reflects design difficulty rather than absence of effect.","Pacing is a natural adaptation patients make anyway, so structured support adds little beyond what happens without it.","Its benefit is mediated by validation and permission to rest rather than by the energy management itself, in which case what is doing the work is not what is being taught."],"unlocks":"A management standard that can be commissioned, taught and reimbursed, instead of one patients transmit to each other because the health system did not."},"lon":80.532356608,"short":"▸ pacing’s own trial"},{"id":"f_autonomic","level":1,"parent":"oi","tier":"point","ab":3,"label":"FRONTIER — Whether the autonomic findings are the illness or its shadow","view":"Orthostatic intolerance is the most reliably measurable abnormality in this symptom picture, and what it means is unresolved.\n\nThree readings compete. In the first it is primary: the exposure or the illness damages autonomic regulation directly, small-fibre or central, and the resulting cerebral hypoperfusion generates the cognitive symptoms, the exertion intolerance and much of the fatigue. In that case treating it is treating the illness. In the second it is downstream: prolonged inactivity, low plasma volume and deconditioning produce orthostatic findings in anyone, and the finding is a consequence of being ill rather than a cause. In the third it is a shared final pathway that many post-infectious and post-exposure illnesses converge on, informative about severity and useless for attribution.\n\nThe distinction is not academic. If primary, autonomic testing becomes a candidate objective marker and autonomic treatment becomes disease-modifying. If downstream, it stays symptomatic relief — worth doing, and not evidence about anything.\n\nWhat would separate them is comparative: the same autonomic protocol across CIRS-criteria patients, ME/CFS patients, long COVID patients and deconditioned controls, with pre-specified analysis. Small-fibre biopsy and cerebral blood flow measurement in the same cohorts would sharpen it further. Nobody has run it, and so the most measurable thing in this illness explains nothing.","angles":[["The most measurable finding is not necessarily the most informative","Ease of measurement and causal relevance are unrelated properties, and research attention tracks the first, which distorts which questions get asked."],["Deconditioning as the confound that will not go away","Any physiological abnormality in a chronically inactive population invites an activity-level explanation, and only comparison against equally inactive controls removes it."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":null,"condition":"A deconditioned control group matched on activity level would have to be recruited — people equally inactive for unrelated reasons. That group is hard to find and harder to match, and its absence is why the confound has survived thirty years of autonomic research in fatiguing illness.","experiment":"A four-arm cross-sectional comparison using a single standardised autonomic protocol across CIRS-criteria, ME/CFS, long COVID and activity-matched controls. No intervention, no follow-up, one testing session per participant.","matters":"This is the most promising route to an objective measure in a field whose central problem is the absence of one, and it is being neglected in favour of markers with worse measurement properties.","rivals":["Autonomic dysfunction is primary and is the mechanism generating the cognitive and exertional symptoms.","It is a consequence of inactivity and low plasma volume, and would resolve with activity if activity were tolerable.","It is a shared final common pathway across post-infectious illnesses, real but non-specific and therefore useless for attribution."],"unlocks":"Either an objective marker for a field that has none, or the removal of a candidate that is currently absorbing attention it does not deserve."},"lon":97.655396608,"short":"▸ primary or shadow?"},{"id":"f_cure","level":1,"parent":"durable","tier":"point","ab":3,"label":"FRONTIER — What cured would have to mean, and the study that would show it","view":"This is the deepest position in this world and it is the question the person living with this actually asked. The answer is that nobody knows, and the reason is that the study which would find out has never been designed, let alone funded.\n\nTo say someone is cured requires four things this field does not have. A definition of remission stated before anyone is assessed. A minimum duration — twelve months of sustained function is the usual convention in fatiguing illness and none of the recovery claims here specify one. Assessment by someone blind to what the person was treated with. And, for the strong sense of cure, a demonstration of restored tolerance: the person can occupy an ordinary building without reacting.\n\nThat last one is the hardest and the most important, because it is what patients mean when they ask. It requires a re-exposure test, which is ethically fraught, potentially harmful, and impossible to blind convincingly given that patients detect building environments by smell.\n\nSo the honest statement is narrow. People get substantially better; that is well attested and not in dispute. Whether anyone returns to full pre-illness tolerance, how often, after what, and durably, is unrecorded. Every recovery rate quoted from any direction in this field is a number without a definition behind it.\n\nBelow this there is no terrain. There is a cohort study nobody has run.","angles":[["Pre-specification as what separates a finding from a story","Defining the outcome before the data are seen is the step that converts clinical impression into evidence, and it is cheap, unglamorous and routinely skipped."],["Provocation testing as the endpoint nobody can ethically run","Where confirming recovery requires re-exposing someone to what harmed them, the definitive test is foreclosed and the question stays open by construction."]],"world":"recovery","upAlt":null,"edge":["down"],"fr":{"blocker":"open question","blocker2":null,"condition":"A remission definition would have to be agreed across two communities that do not currently agree on the diagnosis — a consensus exercise, of the kind that produced case definitions in ME/CFS, run by someone both sides will sit down with.","experiment":"A prospective observational cohort: consecutive patients meeting stated criteria, followed five years with a pre-specified remission definition, blinded outcome assessment, and treatment recorded rather than assigned. It requires no randomisation, no intervention and no ethical complexity — only sustained funding and patience.","matters":"This is what the person with the illness is actually asking. Every other question in this orb is instrumental to it, and it is the one nobody has organised to answer.","rivals":["Full recovery occurs and is common, and its absence from the record reflects the absence of anyone recording it.","Substantial improvement is the ceiling and full restored tolerance is rare, which the framework's own emphasis on ongoing avoidance quietly concedes.","Recovery is real but the endpoint is unmeasurable, because tolerance can only be demonstrated by a re-exposure nobody can ethically conduct."],"unlocks":"The first defensible answer to the question every patient asks first, and a denominator against which every treatment claim in this world could finally be compared."},"lon":286.405636608,"short":"▸ what cured means"}]},"thread":[{"id":"building","label":"the wet building","entry":"builtstock","gloss":"the stock, the water, and what actually grows","cap":"the building as a moisture-management problem. Backward of this is construction physics and housing policy, which are real fields but stop being about anyone’s health."},{"id":"exposure","label":"exposure","entry":"route","gloss":"route, dose, and who is susceptible"},{"id":"cirs","label":"CIRS","entry":"syndrome","gloss":"the proposed illness, its biology, and the dispute over it"},{"id":"recovery","label":"getting better","entry":"recovery","gloss":"what is known about treatment, management and recovery"},{"id":"living","label":"living with it","entry":"avoidance","gloss":"what people actually do, and what it costs"},{"id":"field","label":"the fate of the idea","entry":"fate","gloss":"how contested diagnoses resolve, and what would settle this one","cap":"what becomes of the idea. Forward of this is the sociology of medical knowledge in general, which no longer says anything specific about damp buildings."}],"subject":{"world":"cirs","id":"syndrome","label":"CIRS as a proposed multisystem illness following biotoxin exposure in a water-damaged building"},"build":{"density":"standard (overshot — declared)","authored":"23 August 2026","worlds":6,"note":"Density was requested as a deep dive and built at standard, then deliberately overshot: the subject world carries 50 positions where standard bands at 36–44, and six altitude bands where the preset assumes five. The extra band exists because the request asked for the frontier at the bottom, and reaching a real edge honestly needs one more rung than a standard build provides — without it the deepest positions would have been mechanism summaries rather than declared blockers. The four adjacent worlds were built at 9 positions rather than 10 to keep the total near the intended weight. Placement is computed, not eyeballed: a recursive leaf-weighted sector layout assigns every longitude, with sibling spans capped at 176° so a single-position top band can still keep its children inside the 95° adjacency window. That cap has a visible cost, and it is not hidden: in the four thin adjacent worlds the largest empty arc runs about 206–247°, so those globes look lopsided and part of the rotation passes over nothing. Spreading them evenly would have broken the child rule, and a prettier sphere is not worth a false adjacency. A sixth world, “getting better”, was added on request and sits between the illness and living with it: 32 positions across five bands, ten of them frontier. It is the one world where the authoring rule mattered more than the density rule — everything in it describes claims and their evidence, no step is recommended, and no drug anywhere in this file is given a dose. A guided course was added on request: sixty stops in eleven chapters, authored as one deliberate reading of the terrain — building outward from the subject, treatment weighed before the frontier, the fate of the idea last. The course is navigation, not new terrain; every stop is an existing position, free roaming stays available throughout, and leaving the path is one click. All twelve structural self-checks pass under a headless browser, including the tap-versus-drag threshold, focus surviving a full revolution, the face being mounted once per world, and the instrument panel reading identically at every draw density.","course":60},"apex":[{"a":"cirs/syndrome","b":"living/relocate","apex":"Exposure cessation as the one move with an evidence base on both sides of the dispute","note":"Narrow base, near apex. Mainstream reviews and the CIRS protocol reach the same first instruction from opposite premises, which makes leaving a damp building the only well-supported act in the illness."},{"a":"cirs/syndrome","b":"cirs/f_pfiesteria","apex":"A clinical apparatus that outlived the exposure it was calibrated against","note":"Visual contrast sensitivity and cholestyramine were both validated in the Pocomoke estuary work; the Pfiesteria toxin was never isolated and the attribution collapsed. The instruments were never recalibrated against a confirmed agent."},{"a":"cirs/f_seafloor","b":"building/growth","apex":"Polyketide synthesis under substrate limitation — the shared chemistry of a reef and a wet wall","note":"Ciguatoxins and the fungal mycotoxins are both polyketides, both made by organisms whose toxin output rises under nutrient stress, and both depend on available substrate: dead coral and macroalgae in one case, wet cellulose in the other. The 2002 PNAS challenge to Pfiesteria turned on the absence of exactly these PKS genes."},{"a":"cirs/c4a","b":"cirs/msqpcr","apex":"Measurement variance, not biology, as the thing preventing resolution","note":"One analyte activates in the tube; one index depends on which corner was vacuumed. Both are used to make irreversible decisions, and neither has published bounds on its variance. Two cheap studies would close both."},{"a":"cirs/vcsmech","b":"cirs/f_objective","apex":"Instruments that detect a change reliably and attribute it to nothing","note":"Contrast sensitivity establishes that a visual pathway is impaired and is silent about cause. That is the same structure as the whole attribution problem: every measurement in this field is a measurement of response, and response does not name its trigger."},{"a":"living/arid","b":"building/assembly","apex":"Envelope condition dominating outdoor climate","note":"A wall's layer order and its capacity to dry decide whether it stays wet, which is why arid-state homes show dampness at roughly the same rate as humid-state homes. The relevant boundary is the building's, not the region's."},{"a":"cirs/syndrome","b":"field/equity","apex":"A diagnosis reachable only by those who can pay, describing an exposure concentrated among those who cannot","note":"Dampness clusters in rented and low-income housing; the diagnostic pathway requires uninsured clinicians, uncovered tests and paid building assessment. The published case series therefore describe a population selected on income rather than on biology."},{"a":"cirs/overlap","b":"field/precedent","apex":"One post-exposure state with many entry doors","note":"Wide base, far apex. If viral, bacterial, marine and indoor exposures converge on the same persistent state, the identity of the trigger stops determining the treatment, and the argument over whether CIRS is 'real' has been the wrong argument."},{"a":"exposure/dose","b":"cirs/f_measure","apex":"A twenty-year argument resting on a number nobody has measured","note":"Both sides calculate inhaled dose from spore counts. Fragment release rates make that denominator unknown. Personal breathing-zone sampling by size fraction in ten occupied buildings would settle the shared premise of both positions."},{"a":"exposure/hla","b":"cirs/f_provocation","apex":"Ancestry-matched case-control design as the missing step in both the genetic and the immunological claim","note":"The haplotype claim compares a regional case series against global registry frequencies; the immune claim has no exposed-but-well control arm. The same ordinary methodological fix is outstanding on both."},{"a":"building/who","b":"living/cost","apex":"Tenure as the variable that decides both exposure and remedy","note":"Renters are likelier to live in damp housing and cannot open a wall; owners can remediate and bear a devalued asset. Housing tenure predicts who gets exposed and who can act on it, which is one variable doing two jobs."},{"a":"cirs/f_seafloor","b":"field/climate","apex":"Warming as the one trend both arms of the biotoxin frame share","note":"Benthic dinoflagellates gain growth rate and latitude while flooding and airtight retrofits wet more buildings. The exposure side of this illness is expanding in both its marine and its indoor form, measured no better than now."},{"a":"cirs/bodies","b":"cirs/commerce","apex":"Each side engaging the other's weakest version","note":"Critics aim at consumer urine panels and treat the hit as disposing of the clinical framework; advocates read that as bad faith and stop engaging the dose argument. The structure is symmetrical and it is why nothing moves."},{"a":"cirs/f_buildings","b":"field/standards","apex":"A regulatory vacuum that guarantees the dispute stays individual","note":"No health-based dampness threshold exists, so no landlord, insurer or school district has a number to be held to, so every case becomes expert testimony — which is the mechanism that produced the conflicted literature in the first place."},{"a":"recovery/f_sequence","b":"cirs/csm","apex":"Step one as the confound the other eleven steps are built on top of","note":"Every patient receives exposure removal first, and exposure removal is the best-evidenced intervention in the illness. That ordering guarantees that no dataset can attribute improvement to any later step, which is why a dismantling trial would be worth more than another marker study."},{"a":"recovery/oi","b":"cirs/urine","apex":"Clinical attention flowing toward the expensive test and away from the free one","note":"A urine mycotoxin panel costs hundreds of dollars and is not validated; a ten-minute passive stand test costs nothing and detects a treatable cause of the cognitive symptoms. The same patients get the first and not the second, which is a fact about salience rather than about either test."},{"a":"recovery/pacing","b":"living/sensitisation","apex":"Activity treated as an exposure with its own dose-response","note":"Pacing and environmental avoidance are the same manoeuvre applied to different agents: identify a stimulus that reliably produces delayed multisystem worsening, and stay under its threshold. That both work without the mechanism being settled is the practical lesson of this whole orb."},{"a":"recovery/f_cure","b":"cirs/syndrome","apex":"A framework whose central promise has never been given a measurable endpoint","note":"The claim that draws patients in is that this is treatable and reversible. There is no pre-specified remission definition, no minimum duration, no blinded assessment and no tolerance test anywhere in the literature, so the promise cannot be checked in either direction."},{"a":"recovery/abpa","b":"exposure/dose","apex":"Route of exposure as the hinge every argument here swings on","note":"Fungi cause named, treatable disease by invasion, by IgE and IgG mechanisms, and by ingested dose. The disputed illness asks the same molecules to do it by inhalation at building concentrations, and the transfer across routes is the step that is asserted rather than calculated."},{"a":"recovery/vipevidence","b":"cirs/svm","apex":"Two small unreplicated studies from one group, both reporting near-perfect results","note":"Eleven cases against eleven controls with a flawless classifier, and twenty open-label patients with a seventy per cent symptom reduction. Both are the results those designs produce whether or not the underlying claim is true, and neither has an independent replication after a decade."},{"a":"recovery/f_remedstd","b":"living/cost","apex":"An irreversible financial decision taken against an unverifiable outcome","note":"Households spend tens of thousands on remediation with no clearance criterion to confirm it worked, then attribute continuing symptoms to a persisting illness rather than a persisting exposure. The missing standard converts a building problem into a medical one."},{"a":"recovery/binderharm","b":"field/equity","degenerate":true,"apex":"No third point","note":"Rejected. The candidate link was that both concern cost falling on the patient, which is true of nearly every position in this orb and therefore distinguishes nothing. A narrower base for the affordability question is the economics of leaving against the diagnostic pathway."},{"a":"cirs/f_seafloor","b":"cirs/roster","degenerate":true,"apex":"No third point","note":"Rejected. The only link is that both involve enumerating things — eighteen dinoflagellate species, thirteen symptom clusters. Swap either term for a random third topic and the sentence stays true, which is the definition of a degenerate base. Try a narrower base: the roster against the ME/CFS boundary."},{"a":"building/vocs","b":"cirs/mecfs","degenerate":true,"apex":"No third point","note":"Rejected. The candidate link was 'both are hard to measure objectively', which is true of most of this terrain and therefore says nothing about these two. A narrower base for the odour question is the NIOSH assessment tool."},{"a":"exposure/timing","b":"field/precedent","degenerate":true,"apex":"No third point","note":"Rejected. Latency and historical precedent both concern elapsed time, and that is all they share — one is a biological induction period, the other the career of an idea. The trivial link is the word 'time'."},{"a":"living/social","b":"cirs/masp2","degenerate":true,"apex":"No third point","note":"Rejected. 'Both describe something being activated' survives substituting either term for anything else. Being disbelieved and the lectin pathway do not triangulate; the honest narrower base is disbelief against the equity position."}],"reduction":[["Six-direction navigation, the ring, and the altitude axis","Nothing — all six pads work, and stated termini are rendered where the terrain runs out."],["The five noun instruments and the reading-time strip","The anchor scale is an authored absolute reading rather than a live strip test, so it cannot re-derive itself if you disagree with a placement."],["Every position’s reading, written out in full","Frozen at 23 August 2026. This is a genuinely moving and genuinely contested literature; a live orb would search, and this file cannot."],["The frontier band — twelve declared blockers with condition, experiment, stake and rivals","It names the experiments that would settle each question. It cannot run them, and it cannot tell you if one has since been published."],["The apex table — fourteen triangulations plus four rejected pairs","Bases are fixed at build time. You cannot hand it a new pair; the seed workshop hands the pair to a live orb instead."],["A guided course — an authored path through sixty of the positions, in eleven chapters","It is one reading order imposed on terrain that has none. Following it means trusting this build’s judgement about what matters and in what sequence; the other fifty-eight positions are reached only by leaving the path."],["The seed workshop on every position","The prompt is the exit. Composing one is not the same as getting the answer."],["The UP axis’s instance-of fan","Rendered, but empty at every position: the two ceiling positions sit 180° apart, so no position has both an instance-of and a part-of parent inside the 95° adjacency window. The fan states the absence and why, rather than inventing a category to fill itself."],["Verb mode — running this as work rather than as a subject","Absent. A printed orb is a noun-mode artifact; the workshop can request verb mode of the next orb."],["Images, diagrams, building photographs, panel screenshots","Absent by contract. Text and vector chrome only."],["Anything about your friend’s actual building, panel results or symptoms","Absent, and deliberately so. This is a map of a dispute, not an assessment of a person or a house."],["A treatment and recovery world — what is established, what the protocol claims, what is managed symptomatically, and what recovery would have to mean","It maps the evidence behind each step. It is not a treatment plan and cannot be one: no dose, no sequence to follow, no judgement about any particular person."],["Clinical advice — dosing, whether to start or stop anything, which clinician to see","Absent by design. Every intervention is described as a claim with an evidence base of a stated size, never recommended, and no drug in this file is given a dose."],["The harms side of every treatment described","Stated where it is known and declared as a frontier where it is not — there is no adverse-event register for this treatment community, so the harms ledger is genuinely missing rather than omitted here."]],"course":[{"title":"Start here","gloss":"The subject, and the two shelves it sits on.","stops":[{"k":"cirs/syndrome","why":"The anchor. Everything else in this file is positioned relative to this claim."},{"k":"cirs/eai","why":"The contested category the illness is filed under, which predicts the shape of the fight."},{"k":"cirs/innate","why":"The mechanism family it belongs to — where CIRS is most respectable and least distinctive."}]},{"title":"The building","gloss":"Where the exposure comes from, and why the desert did not fix it.","stops":[{"k":"building/builtstock","why":"The problem starts as construction physics, not biology."},{"k":"building/water","why":"How water gets in decides everything downstream."},{"k":"building/assembly","why":"The wall’s layer order matters more than the local climate — the crux for a dry-state move."},{"k":"building/growth","why":"What actually grows in a wet assembly, and what it needs."},{"k":"building/fragments","why":"Submicron fragments outnumber spores enormously — and spore counts miss them."},{"k":"building/vocs","why":"The smell is a crude instrument, but it is a real one."}]},{"title":"Exposure","gloss":"Route, dose, and who gets ill — where the dispute actually begins.","stops":[{"k":"exposure/route","why":"From a building to a body: exposure is a route plus a susceptibility."},{"k":"exposure/inhale","why":"What a respirable particle carries and where it lands."},{"k":"exposure/dose","why":"The dose question is the whole argument in one position."},{"k":"exposure/mycotoxin","why":"Potent molecules, real toxicology — and an aerosolisation bottleneck."},{"k":"exposure/susceptible","why":"Why two people in one house get two different illnesses."},{"k":"exposure/hla","why":"The genetic susceptibility claim, and the evidence it leans on."}]},{"title":"The illness as proposed","gloss":"The framework on its own terms, before the dispute.","stops":[{"k":"cirs/biology","why":"The proposed cascade from exposure to persistent illness."},{"k":"cirs/casedef","why":"What a clinician is asked to establish."},{"k":"cirs/clusters","why":"Thirteen symptom clusters and the counting rule."},{"k":"cirs/markers","why":"The blood panel the framework runs on."},{"k":"cirs/vcsmech","why":"The visual test at the centre of everything — what it measures, and what else moves it."},{"k":"cirs/natural","why":"Onset, plateau, relapse: the course the illness is said to run."}]},{"title":"The dispute","gloss":"What the professional bodies say, and where each side is weakest.","stops":[{"k":"cirs/contest","why":"A literature without a code: the shape of the recognition fight."},{"k":"cirs/bodies","why":"What the consensus documents actually say — and the large area where both sides agree."},{"k":"cirs/nam","why":"Dampness harms people; mycotoxicosis is not established. Both halves matter."},{"k":"cirs/nam2004","why":"What “sufficient evidence of association” licensed, precisely."},{"k":"cirs/acoem","why":"The statement, the litigation context, and the conflicts on the other side."},{"k":"cirs/urine","why":"The consumer test almost everyone agrees is unvalidated — and why it dominates anyway."},{"k":"cirs/c4a","why":"The signature marker, and the measurement problem underneath it."}]},{"title":"Getting better: what works anyway","gloss":"The floor of care that needs nobody to win the argument.","stops":[{"k":"recovery/recovery","why":"Four different things people mean by recovery. Separate them first."},{"k":"recovery/established","why":"The best-evidenced care in this illness does not depend on the dispute."},{"k":"recovery/removal2","why":"The one intervention both sides endorse."},{"k":"recovery/remedevidence","why":"The forty per cent figure, unpacked — what those trials measured and what they did not."},{"k":"recovery/partial","why":"Why half a remediation can be worse than none."},{"k":"recovery/airway","why":"The named, treatable respiratory disease hiding inside the contested one."}]},{"title":"The protocol, weighed","gloss":"Each step, with the evidence it actually has. Described, never prescribed.","stops":[{"k":"recovery/protocol","why":"A dozen gated steps: coherent, and coherence is not evidence."},{"k":"recovery/binders2","why":"Steps one and two, where the evidence is thickest."},{"k":"recovery/csmevidence","why":"What the cholestyramine studies show — and the exposure they were calibrated against."},{"k":"recovery/binderharm","why":"The harms side of a cheap old drug."},{"k":"recovery/sequence","why":"Steps three to twelve: markers corrected, outcomes untested."},{"k":"recovery/vipevidence","why":"The endgame step: ontested diagnoses resolve, and what would settle this one.","stops":[{"k":"field/fate","why":"Three historical paths: absorption, dissolution, and vindication."},{"k":"field/precedent","why":"What long COVID changed about arguments like this one."},{"k":"field/mechanism","why":"Why a mechanism, not a protocol, is what changes minds."},{"k":"field/who2","why":"The five studies that would settle it, and why none has been run."}]}]};

/* ============================================================== geometry */
function latFor(level) {

  return L.length === 1 ? 0 : 58 - (116 * i / (L.length - 1));

function vec(lon, lat) {
  var la = lat * RAD, lo = lon * RAD;
  return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];

function projV(v) {
  var a = viewLon * RAD, ca = Math.cos(a), sa = Math.sin(a);
  var x = v[0] * ca - v[2] * sa, z = v[0] * sa + v[2] * ca, y = v[1];

  var d = v0[0] * v1[0] + v0[1] * v1[1] + v0[2] * v1[2];
  d = Math.max(-1, Math.min(1, d));
  var om = Math.acos(d);

function arcRuns(p0, p1) {

  var d = v0[0] * v1[0] + v0[1] * v1[1] + v0[2] * v1[2]; d = Math.max(-1, Math.min(1, d));

function homeRoute() {

    WORLDS[w].forEach(function (o) {
      if (o.id === p.id) return;
      if (Math.abs(o.level - p.level) === 1 && dlon(o.lon, p.lon) <= 95) nb.push(w + '/' + o.id);
      else if (o.level === p.level) nb.push(w + '/' + o.id);
    });
    if (ti > 0) nb.push(THREAD[ti - 1].id + '/' + THREAD[ti - 1].entry);
    if (ti < THREAD.length - 1) nb.push(THREAD[ti + 1].id + '/' + THREAD[ti + 1].entry);
    for (var i = 0; i < nb.length; i++) {
      if (seen[nb[i]]) continue;
      if (nb[i] === goal) return path.concat([nb[i]]).slice(1);
      seen[nb[i]] = 1; q.push(path.concat([nb[i]]));

}

/* pooled path elements — nothing here is focusable, so reuse is free */
var POOLN = 80, poolB = [], poolF = [], poolT = [];
(function () {
  for (var i = 0; i < POOLN; i++) {
    var a = el('polyline', { 'class': 'pathln back', points: '' }); pbk.appendChild(a); poolB.push(a);
    var b = el('polyline', { 'class': 'pathln', points: '' }); pfr.appendChild(b); poolF.push(b);
  }
  for (var j = 0; j < 12; j++) {
    var t = el('text', { 'class': 'brk', 'text-anchor': 'middle' }, ''); pfr.appendChild(t); poolT.push(t);
  }
})();

function drawPath() {
  var ib = 0, iff = 0, it = 0, n = trail.length;
  for (var i = 1; i < n; i++) {
    var a = trail[i - 1], b = trail[i];
    var age = n < 3 ? 1 : (i - 1) / (n - 2);
    if (a.w !== b.w) {                       /* thread crossing: a break, never an arc */
      var pb = find(b.w, b.id), q = projP(pb);
      if (it < poolT.length && q.front) {
        poolT[it].setAttribute('x', q.x); poolT[it].setAttribute('y', q.y - 15);
        poolT[it].textContent = '\u2192 ' + THREAD[threadIdx(b.w)].label.toUpperCase();
        poolT[it].style.display = ''; it++;
      }
      continue;
    }
    var runs = arcRuns(find(a.w, a.id), find(b.w, b.id));
    for (var r = 0; r < runs.length; r++) {
      var pts = runs[r].pts.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
      var pool = runs[r].front ? poolF : poolB, idx = runs[r].front ? iff++ : ib++;
      if (idx >= POOLN) continue;
      pool[idx].setAttribute('points', pts);
      pool[idx].setAttribute('stroke-opacity', runs[r].front ? (0.35 + 0.55 * age).toFixed(2) : (0.10 + 0.16 * age).toFixed(2));
      pool[idx].setAttribute('stroke-width', (1.4 + 1.1 * age).toFixed(2));
      pool[idx].style.display = '';
    }
  }
  for (; ib < POOLN; ib++) poolB[ib].style.display = 'none';
  for (; iff < POOLN; iff++) poolF[iff].style.display = 'none';
  for (; it < poolT.length; it++) poolT[it].style.display = 'none';
}

function placeLabels(shown) {
  var placed = [], items = labelOrder.map(function (p) { return { p: p, q: projP(p) }; });
  items.sort(function (a, b) { return b.q.z - a.q.z; });
  items.forEach(function (it) {
    var g = nodes[world + '/' + it.p.id], tx = g.querySelector('text.lb');
    if (!it.q.front || !shown[it.p.id]) { tx.style.display = 'none'; return; }
    var wpx = it.p.short.length * 5.15 + 8, left = it.q.x + wpx + 14 > 520;
    var x0 = left ? it.q.x - wpx - 9 : it.q.x + 9;
    var box = [x0, it.q.y - 7, x0 + wpx, it.q.y + 5], hit = false;
    for (var i = 0; i < placed.length; i++) {

function tick() {
  if (targetLon !== null) {
    var d = ((targetLon - viewLon + 540) % 360) - 180;
    if (Math.abs(d) > 0.35) { viewLon = (viewLon + d * 0.16 + 360) % 360; }
    else { viewLon = targetLon; targetLon = null; }
    dirty = true;
  } else if (Math.abs(dragVel) > 0.02) {
    viewLon = (viewLon + dragVel + 360) % 360; dragVel *= 0.94; dirty = true;
  } else if (spinOn && !paused && !reduced()) {
    if (++idleFrames > 36) { viewLon = (viewLon + SPIN + 360) % 360; dirty = true; }
  }
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(tick);
}

  var k = world + '/' + cur.id; visits[k] = (visits[k] || 0) + 1;
  if (!same) { mountChrome(); mountFace(); viewLon = cur.lon; targetLon = null; }
  else { targetLon = cur.lon; }
  idleFrames = 0; dirty = true; render();
}
function togglePin(k) {
  if (pins[k]) { delete pins[k]; nPins--; } else { pins[k] = 1; nPins++; }
  dirty = true; renderPins(); renderWorkshop();
}

  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); var k = g.getAttribute('data-go').split('/');
    if (e.shiftKey) togglePin(g.getAttribute('data-go')); else travel(k[0], k[1]);
  }
});
document.addEventListener('keydown', function (e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  var ti = threadIdx(world), t = null;
  if (e.key === 'ArrowUp') { var u = up(); t = u[0] ? [world, u[0].id] : null; }
  else if (e.key === 'ArrowDown') { var d = down(); t = d[0] ? [world, d[0].id] : null; }
  else if (e.key === 'ArrowLeft') {
    if (e.shiftKey) { if (ti > 0) t = [THREAD[ti - 1].id, THREAD[ti - 1].entry]; }
    else { var l = step(-1); t = l ? [world, l.id] : null; }
  } else if (e.key === 'ArrowRight') {
    if (e.shiftKey) { if (ti < THREAD.length - 1) t = [THREAD[ti + 1].id, THREAD[ti + 1].entry]; }
    else { var r = step(1); t = r ? [world, r.id] : null; }
  } else if (e.key === 'n' || e.key === 'N') {
    e.preventDefault(); if (coMode === 'idle') coStart(); else coNext(); return;
  } else if (e.key === 'p' || e.key === 'P') {
    e.preventDefault(); coPrev(); return;
  } else return;
  e.preventDefault(); if (t) travel(t[0], t[1]);
});
/* delegated clicks must skip the SVG or a marker fires twice */
document.addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('svg')) return;
}, true);

cur = find(SUBJECT.world, SUBJECT.id);
world = SUBJECT.world;
trail = [{ w: world, id: cur.id }];
visits[world + '/' + cur.id] = 1;
viewLon = cur.lon;
mountChrome(); mountFace(); renderFace(); render(); draw();
requestAnimationFrame(tick);

/* ---- self-check hooks, used by the harness; harmless in a browser ---- */
window.__orb = {
  get viewLon() { return viewLon; },
  get world() { return world; },
  get cur() { return cur; },
  get trail() { return trail; },
  get faceNode() { return face.firstChild; },
  down: function () { return down().map(function (p) { return p.id; }); },
  up: function () { return up().map(function (p) { return p.id; }); },
  ring: function () { return ringBand().map(function (p) { return p.id; }); },
  goto: function (w, id) { travel(w, id); },
  setDraw: function (d) { drawDensity = d; dirty = true; draw(); renderControls(); },
  arcOnSphere: function () {
    var bad = 0;
    for (var i = 1; i < trail.length; i++) {
      if (trail[i - 1].w !== trail[i].w) continue;
      var runs = arcRuns(find(trail[i - 1].w, trail[i - 1].id), find(trail[i].w, trail[i].id));
      runs.forEach(function (r) {
        r.pts.forEach(function (p) {
          var d = Math.sqrt(Math.pow(p.x - CX, 2) + Math.pow(p.y - CY, 2));
          if (d > R + 0.75) bad++;
        });
      });
    }
    return bad;
  },
  gaugeText: function () { return document.getElementById('gauges').textContent; },
  drawnCount: function () {
    return Array.prototype.filter.call(face.children, function (g) {
      return g.getAttribute('class').indexOf('hidden') < 0;
    }).length;
  },
  words: function () { return BUILD.words; },
  positions: function () { return BUILD.positions; },
  gaugeCount: function () { return document.getElementById('gauges').children.length; },
  seed: function () { return document.getElementById('seedbox').value; },
  courseStart: coStart, courseNext: coNext, coursePrev: coPrev, courseLeave: coLeave,
  courseState: function () { return { mode: coMode, idx: coIdx, n: CSTOPS.length, ch: CH.length, at: CSTOPS[coIdx] && CSTOPS[coIdx].k }; },
  ttsState: function () { return ttsState; },
  ttsToggle: ttsToggle, ttsStop: ttsStop
};
</script>
